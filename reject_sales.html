<script>
(function () {
  var fmt = function (n) { return Number(n || 0).toLocaleString(); };
  var kes = function (n) { return 'KES ' + fmt(Math.round(n || 0)); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function tierClass(p) { return p === 1000 ? '1000' : p === 1200 ? '1200' : '1500'; }

  var bags = RJ.bags || [], T = RJ.totals || {}, tiers = RJ.tiers || [1000, 1200, 1500];

  document.getElementById('rj-loc').textContent = RJ.location || 'Kitengela';
  document.getElementById('rj-sub').textContent =
    'Clearance pricing for the reject stock' + (RJ.generated ? ' · ' + RJ.generated : '') +
    ' — every bag put into a ' + tiers.map(function (t) { return fmt(t); }).join(' / ') + ' tier by its BOM cost.';
  document.getElementById('rj-note').innerHTML =
    'Cost source: <b>' + esc(RJ.costSource || '—') + '</b>. Sale price is the cheapest tier that still clears the bag\'s production cost, so margins stay positive except where flagged.';

  // KPIs
  document.getElementById('rj-kpis').innerHTML =
    kpi('Bag types', fmt(T.bags), fmt(T.units) + ' units to clear') +
    kpi('Projected revenue', kes(T.revenue), 'if everything sells') +
    kpi('Projected margin', kes(T.margin), (T.revenue ? Math.round(T.margin / T.revenue * 100) + '% of revenue' : '')) +
    kpi('Tiers', tiers.map(function (t) { return fmt(t); }).join(' / '), 'KES sale prices');
  function kpi(l, v, s) {
    return '<div class="kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>';
  }

  // Tier cards
  var maxRev = Math.max.apply(null, (RJ.byTier || []).map(function (t) { return t.revenue; }).concat([1]));
  document.getElementById('rj-tiers').innerHTML = (RJ.byTier || []).map(function (t) {
    var cl = tierClass(t.price);
    return '<div class="tier">' +
      '<div class="p t' + cl + '">' + kes(t.price) + '</div>' +
      '<div class="m"><b style="color:#e2e8f0">' + fmt(t.bags) + '</b> bag types · <b style="color:#e2e8f0">' + fmt(t.units) + '</b> units</div>' +
      '<div class="m">Revenue <b style="color:#e2e8f0">' + kes(t.revenue) + '</b> · margin ' + kes(t.margin) + '</div>' +
      '<div class="bar"><span class="b' + cl + '" style="width:' + Math.round(t.revenue / maxRev * 100) + '%"></span></div>' +
      '</div>';
  }).join('');

  // Pricing rule caption
  var bd = RJ.bands || {};
  document.getElementById('rj-rule').innerHTML =
    'Tier by BOM cost: cost ≤ <b>' + fmt(bd.b1) + '</b> → <span class="t1000">' + kes(1000) + '</span> · ' +
    fmt(bd.b1) + '–<b>' + fmt(bd.b2) + '</b> → <span class="t1200">' + kes(1200) + '</span> · &gt; ' +
    fmt(bd.b2) + ' → <span class="t1500">' + kes(1500) + '</span>. ' +
    '<span class="flag-thin">Thin</span> = margin under KES ' + fmt(bd.thin) + '; <span class="flag-below">Below cost</span> = costs more than 1,500 (hold or price up); ' +
    '<span class="flag-nobom">No BOM</span> = no cost on file (defaulted, verify); <span class="flag-pinned">Pinned</span> = set by hand. Click a header to sort.';

  // Sortable + searchable table
  var COLS = [
    { k: 'bag', t: 'Bag', txt: true },
    { k: 'units', t: 'Units' },
    { k: 'ncol', t: 'Colours' },
    { k: 'cost', t: 'BOM cost', money: true },
    { k: 'price', t: 'Sale price', money: true },
    { k: 'marginUnit', t: 'Margin/u', money: true },
    { k: 'marginPct', t: 'Margin %', pct: true },
    { k: 'revenue', t: 'Revenue', money: true, col: '#34d399' }
  ];
  var sk = 'revenue', sd = 'desc';
  var thead = document.querySelector('#rj-table thead'), tbody = document.querySelector('#rj-table tbody');
  var searchEl = document.getElementById('rj-search');
  function v(b, k) { return k === 'ncol' ? (b.colours || []).length : b[k]; }

  function flagPill(b) {
    if (b.flag === 'below') return ' <span class="pill flag-below" style="background:rgba(248,113,113,0.15)" title="Costs more than KES 1,500 — 1,500 is below cost. Hold, or set a higher pinned price.">below cost</span>';
    if (b.flag === 'nobom') return ' <span class="pill flag-nobom" style="background:rgba(240,171,252,0.15)" title="No BOM cost on file — priced at the default tier. Verify.">no BOM</span>';
    if (b.flag === 'thin') return ' <span class="pill flag-thin" style="background:rgba(252,211,77,0.15)" title="Margin under the thin threshold.">thin</span>';
    if (b.flag === 'pinned') return ' <span class="pill flag-pinned" style="background:rgba(147,197,253,0.15)" title="Price pinned by hand in reject_overrides.json.">pinned</span>';
    return '';
  }

  function render() {
    thead.innerHTML = '<tr>' + COLS.map(function (c) {
      var ar = c.k === sk ? (sd === 'asc' ? ' ▲' : ' ▼') : '';
      return '<th class="sortable ' + (c.txt ? 'l' : '') + '" data-k="' + c.k + '">' + c.t + ar + '</th>';
    }).join('') + '</tr>';
    thead.querySelectorAll('th').forEach(function (th) {
      th.addEventListener('click', function () {
        var k = th.getAttribute('data-k');
        if (k === sk) sd = sd === 'asc' ? 'desc' : 'asc';
        else { sk = k; sd = k === 'bag' ? 'asc' : 'desc'; }
        render();
      });
    });
    var q = (searchEl && searchEl.value || '').trim().toUpperCase();
    var rows = bags.slice().filter(function (b) { return !q || b.bag.toUpperCase().indexOf(q) >= 0; })
      .sort(function (a, b) {
        var x = v(a, sk), y = v(b, sk);
        if (x == null) x = -1; if (y == null) y = -1;
        if (typeof x === 'string') return sd === 'asc' ? String(x).localeCompare(y) : String(y).localeCompare(x);
        return sd === 'asc' ? (x - y) : (y - x);
      });

    var cnt = document.getElementById('rj-count');
    if (q) {
      var u = rows.reduce(function (a, b) { return a + b.units; }, 0);
      var rev = rows.reduce(function (a, b) { return a + b.revenue; }, 0);
      cnt.innerHTML = rows.length ? ('Matches for <b style="color:#e2e8f0">' + esc(q) + '</b>: <b>' + rows.length + '</b> bag types · <b>' + fmt(u) + '</b> units · revenue <b style="color:#34d399">' + kes(rev) + '</b>')
        : 'No bag matches <b>' + esc(q) + '</b>.';
    } else { cnt.textContent = ''; }

    if (!rows.length) { tbody.innerHTML = '<tr><td colspan="' + COLS.length + '" style="text-align:center;color:#64748b;padding:1rem">No bags.</td></tr>'; return; }
    tbody.innerHTML = rows.map(function (b) {
      var cl = tierClass(b.price);
      var coltitle = (b.colours || []).map(function (x) { return x.c + ': ' + x.u; }).join(', ');
      return '<tr>' + COLS.map(function (c) {
        if (c.k === 'bag') return '<td class="l"><span class="name">' + esc(b.bag) + '</span>' +
          (b.canon ? ' <span style="color:#64748b;font-size:0.68rem">(' + esc(b.canon) + ')</span>' : '') + flagPill(b) + '</td>';
        if (c.k === 'ncol') return '<td title="' + esc(coltitle) + '" style="cursor:help">' + (b.colours || []).length + '</td>';
        if (c.k === 'price') return '<td class="t' + cl + '" style="font-weight:800">' + kes(b.price) + '</td>';
        if (c.k === 'cost') return '<td>' + (b.cost == null ? '—' : kes(b.cost)) + '</td>';
        if (c.k === 'marginUnit') return '<td' + (b.marginUnit != null && b.marginUnit < 0 ? ' class="flag-below"' : '') + '>' + (b.marginUnit == null ? '—' : kes(b.marginUnit)) + '</td>';
        if (c.k === 'marginPct') return '<td>' + (b.marginPct == null ? '—' : b.marginPct + '%') + '</td>';
        if (c.k === 'revenue') return '<td style="color:#34d399;font-weight:700">' + kes(b.revenue) + '</td>';
        return '<td>' + fmt(b[c.k]) + '</td>';
      }).join('') + '</tr>';
    }).join('');
  }
  render();
  if (searchEl) searchEl.addEventListener('input', render);

  // Flags footer
  var fl = RJ.flags || {}, parts = [];
  if ((fl.below || []).length) parts.push('<b class="flag-below">Below cost (' + fl.below.length + ')</b> — cost above KES 1,500, so 1,500 loses money; hold or pin a higher price: ' + fl.below.map(esc).join(', '));
  if ((fl.nobom || []).length) parts.push('<b class="flag-nobom">No BOM cost (' + fl.nobom.length + ')</b> — priced at the default tier, verify: ' + fl.nobom.map(esc).join(', '));
  if ((fl.thin || []).length) parts.push('<b class="flag-thin">Thin margin (' + fl.thin.length + ')</b>: ' + fl.thin.map(esc).join(', '));
  parts.push('Edit <code style="color:#a5f3fc">reject_stock.csv</code> to change stock, or <code style="color:#a5f3fc">reject_overrides.json</code> to pin a bag\'s price.');
  document.getElementById('rj-flags').innerHTML = parts.join('<br>');
})();
</script>

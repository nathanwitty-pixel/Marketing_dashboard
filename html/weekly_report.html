<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Report</title>
  <!-- Spec: docs/weekly-report.md. Each slide: Headline (B1) / Graph (B2) / Insight / Biz Rec (B3). -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --page: #e9ecf2; --paper: #ffffff; --ink: #0f172a; --ink-2: #334155; --muted: #64748b;
      --rule: #0f172a; --line: #d6dbe4; --accent: #2563eb; --good: #059669; --bad: #dc2626; --warn: #b45309;
      --rec-bg: #fff7e6; --rec-rule: #f59e0b; --ins-bg: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
           -webkit-font-smoothing: antialiased; }
    .bar { max-width: 1180px; margin: 0 auto; padding: 16px 16px 0; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .bar h1 { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--ink-2); }
    .bar h1 span { color: var(--muted); font-weight: 500; }
    .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; font: 600 0.85rem/1 inherit; padding: 9px 14px;
           border-radius: 8px; cursor: pointer; font-family: inherit; }
    .btn:hover { background: #1e293b; }
    .deck { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 22px; }

    .slide { background: var(--paper); border: 6px solid var(--rule); border-radius: 6px; aspect-ratio: 16 / 9;
             display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-shadow: 0 10px 30px rgba(15,23,42,0.12); }
    /* Foot traffic band (Walk-ins / Not walk-ins / WhatsApp), the Denri dashboard's Foot Traffic page figures */
    .slide.has-band { grid-template-rows: auto auto 1fr auto; }
    .slide.has-band .box ul { font-size: 0.8rem; line-height: 1.36; }
    .slide.has-band .box li { margin-bottom: 3px; }
    .band { display: grid; gap: 0 18px; padding: 7px 22px 8px; border-bottom: 4px solid var(--rule); background: #fafbfd; }
    .band .mk { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 2px; }
    .band .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: 0.74rem; line-height: 1.5; color: var(--ink-2); }
    .band .row .g { font-weight: 800; color: var(--ink); min-width: 92px; }
    .band .row .g i { font-weight: 500; font-style: normal; color: var(--muted); font-size: 0.66rem; margin-left: 5px; }
    .band .row span.k { white-space: nowrap; cursor: help; }
    .band .row span.k b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .head { border-bottom: 4px solid var(--rule); padding: 14px 22px 12px; }
    .kicker { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .headline { font-size: 1.45rem; font-weight: 800; line-height: 1.25; text-wrap: balance; }
    .headline.bad { color: #991b1b; } .headline.good { color: #065f46; }
    .body { display: grid; grid-template-columns: 1.55fr 1fr; min-height: 0; }
    .graph { border-right: 4px solid var(--rule); padding: 14px 16px 10px; display: flex; flex-direction: column; min-height: 0; }
    .graph .cap { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .graph .cv { position: relative; flex: 1; min-height: 0; }
    .side { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
    .box { padding: 12px 16px; min-height: 0; overflow: hidden; }
    .box h3 { margin: 0 0 6px; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .insight { background: var(--ins-bg); }
    .insight h3 { color: var(--accent); }
    .rec { background: var(--rec-bg); border-top: 4px solid var(--rule); }
    .rec h3 { color: var(--warn); }
    .box ul { margin: 0; padding-left: 1.05rem; font-size: 0.86rem; line-height: 1.42; color: var(--ink-2); }
    .box li { margin-bottom: 5px; }
    .box li b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .rec li { color: var(--ink); font-weight: 600; }
    .foot { font-size: 0.68rem; color: var(--muted); padding: 5px 22px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
    table.lead { width: 100%; border-collapse: collapse; font-size: 0.74rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
    table.lead th { text-align: left; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); padding: 1px 6px; }
    table.lead td { padding: 1px 6px; color: var(--ink-2); border-bottom: 1px solid #eef1f5; white-space: nowrap; }
    .ft { display: grid; gap: 10px; height: 100%; align-content: start; overflow: hidden; }
    .ft-m { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .ft-m.early { background: #f8fafc; }
    .ft-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; font-size: 0.85rem; }
    .ft-v { font-size: 0.78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e2e8f0; color: #334155; }
    .ft-v.chats { background: #d1fae5; color: #065f46; } .ft-v.awareness { background: #e0e7ff; color: #3730a3; }
    .ft-v.leak { background: #ffedd5; color: #9a3412; } .ft-v.none { background: #f1f5f9; color: #475569; }
    .ft-row { display: grid; grid-template-columns: auto 1fr auto 1fr auto; gap: 6px; align-items: center; }
    .ft-box { border: 2px solid var(--ink); border-radius: 6px; padding: 6px 8px; font-weight: 800; font-size: 0.78rem; text-align: center; background: #fff; white-space: nowrap; }
    .ft-arrow { position: relative; text-align: center; font-size: 0.68rem; line-height: 1.25; padding: 2px 10px 6px; color: #64748b; }
    .ft-arrow::after { content: ''; position: absolute; left: 0; right: 6px; bottom: 0; border-bottom: 3px solid currentColor; }
    .ft-arrow::before { content: ''; position: absolute; right: 0; bottom: -4px; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    .ft-arrow span, .ft-arrow b, .ft-arrow em { display: block; } .ft-arrow em { font-style: normal; }
    .ft-arrow.pass { color: var(--good); } .ft-arrow.fail { color: #94a3b8; } .ft-arrow.off { color: #cbd5e1; }
    .ft-arrow.pass span, .ft-arrow.fail span, .ft-arrow.off span { color: #334155; font-weight: 600; }
    .ft-aw { margin: 6px 40px 0; }
    .graph.has-table .cv { min-height: 55%; }
    .graph.has-table > div:last-child { flex: 0 1 auto; overflow: hidden; }
    table.lead.src { font-size: 0.68rem; }
    table.lead.wrap td { white-space: normal; vertical-align: top; } table.lead.wrap td, table.lead.wrap th { text-align: left; }
    table.lead.src td, table.lead.src th { padding: 0 6px; }
    table.lead .n { text-align: right; }
    table.lead td.neg { color: var(--bad); font-weight: 700; } table.lead td.pos { color: var(--good); font-weight: 700; }
    table.lead tr.fp td { background: #f3e8ff; color: #6b21a8; font-weight: 700; }
    table.lead tr.m td { font-weight: 700; color: var(--ink); border-top: 1px solid var(--line); }
    .empty { color: var(--muted); font-size: 0.9rem; margin: auto; text-align: center; }

    .cover { display: flex; flex-direction: column; justify-content: center; padding: 48px 56px; gap: 10px; }
    .cover .kicker { font-size: 0.85rem; }
    .cover h2 { margin: 0; font-size: 2.6rem; font-weight: 800; letter-spacing: -0.01em; }
    .cover .wk { font-size: 1.3rem; color: var(--ink-2); font-weight: 600; }
    .cover .beats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 22px; max-width: 760px; }
    .cover .beat { border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-2); }
    .cover .beat b { display: block; color: var(--ink); font-size: 0.95rem; margin-bottom: 2px; }
    .cover ol { margin: 18px 0 0; padding-left: 1.2rem; color: var(--ink-2); font-size: 0.9rem; line-height: 1.55; columns: 2; column-gap: 40px; max-width: 900px; }
    .cover .by { margin-top: auto; color: var(--muted); font-size: 0.85rem; }

    @media (max-width: 820px) {
      .slide { aspect-ratio: auto; }
      .body { grid-template-columns: 1fr; }
      .graph { border-right: 0; border-bottom: 4px solid var(--rule); height: 300px; }
      .headline { font-size: 1.15rem; }
      .cover { padding: 28px 20px; } .cover h2 { font-size: 1.8rem; }
      .cover .beats { grid-template-columns: 1fr; }
    }
    @media print {
      @page { size: A4 landscape; margin: 8mm; }
      body { background: #fff; }
      .bar { display: none; }
      .deck { padding: 0; gap: 0; max-width: none; }
      .slide { box-shadow: none; break-after: page; page-break-after: always; aspect-ratio: auto; height: 188mm; border-width: 4px; }
      .slide:last-child { break-after: auto; page-break-after: auto; }
    }
  </style>
</head>

<div class="bar">

</div>
<div class="deck" id="deck"></div>

<script>
(function () {
  var deck = document.getElementById('deck');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmt = function (n) { return n == null ? '—' : Math.round(n).toLocaleString('en-US'); };
  document.getElementById('bar-week').textContent = WR.weekLabel ? 'for ' + WR.weekLabel : '';

  // cover
  var cover = document.createElement('section');
  cover.className = 'slide';
  cover.innerHTML = '<div class="cover">'
    + '<div class="kicker">Denri Africa marketing</div>'
    + '<h2>Weekly Marketing Report</h2>'
    + '<div class="wk">Week of ' + esc(WR.weekLabel || '') + '</div>'
    + '<div class="beats"><div class="beat"><b>Headline</b>The takeaway, with its number</div>'
    + '<div class="beat"><b>Evidence</b>The graph behind it</div>'
    + '<div class="beat"><b>Recommendation</b>What we should do next</div></div>'
    + '<ol>' + (WR.slides || []).map(function (s) { return '<li>' + esc(s.kicker) + '</li>'; }).join('') + '</ol>'
    + '<div class="by">' + esc([WR.owner && WR.owner.name, WR.owner && WR.owner.title].filter(Boolean).join(', '))
    + (WR.built ? '<br>Built ' + esc(WR.built) : '') + '</div></div>';
  deck.appendChild(cover);

  var draw = {};
  (WR.slides || []).forEach(function (s, i) {
    var el = document.createElement('section');
    var band = s.band || [];
    el.className = 'slide' + (band.length ? ' has-band' : '');
    el.id = 'slide-' + s.id;
    el.innerHTML = '<div class="head"><div class="kicker">' + (i + 1) + '. ' + esc(s.kicker) + '</div>'
      + '<div class="headline ' + esc(s.tone) + '">' + esc(s.headline || 'No headline this week: the data wasn’t available.') + '</div></div>'
      + (band.length ? '<div class="band" style="grid-template-columns:repeat(' + band.length + ',minmax(0,1fr))">'
          + band.map(function (m) {
              return '<div><div class="mk">' + esc(m.name) + ', last week' + (band.length > 1 ? '' : ' (' + esc(WR.weekLabel) + ')') + '</div>'
                + m.groups.map(function (g) {
                    return '<div class="row"><span class="g">' + esc(g.label) + (band.length > 1 ? '' : '<i>' + esc(g.note) + '</i>') + '</span>'
                      + g.items.map(function (it) { return '<span class="k" title="' + esc(it[2]) + '">' + esc(it[0]) + ' <b>' + esc(it[1]) + '</b></span>'; }).join('')
                      + '</div>';
                  }).join('') + '</div>';
            }).join('') + '</div>' : '')
      + '<div class="body"><div class="graph"><div class="cap" id="cap-' + s.id + '"></div><div class="cv"><canvas id="cv-' + s.id + '"></canvas></div></div>'
      + '<div class="side"><div class="box insight"><h3>Insight</h3><ul>' + (s.insight || []).map(function (x) { return '<li>' + x + '</li>'; }).join('') + '</ul></div>'
      + '<div class="box rec"><h3>Business recommendation</h3><ul>' + (s.rec || []).map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div></div></div>'
      + '<div class="foot"><span>Source: ' + esc(s.source) + '</span><span>' + (i + 2) + '</span></div>';
    deck.appendChild(el);
    if (!(s.graph && s.graph.ok)) el.querySelector('.cv').innerHTML = '<div class="empty">The graph needs Odoo, which wasn’t reachable at build time.</div>';
  });

  // the line's name (and its last value) written at the end of each line, in its colour
  var endLabels = { id: 'endLabels', afterDatasetsDraw: function (ch) {
    var ctx = ch.ctx, area = ch.chartArea;
    ctx.save();
    ctx.font = '700 12px Segoe UI, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    var H = 18, GAP = 4, placed = [], labels = [];
    ch.data.datasets.forEach(function (ds, di) {
      if ((ds.type || ch.config.type) !== 'line' || !ch.isDatasetVisible(di) || ds.noEndLabel) return;
      var pts = ch.getDatasetMeta(di).data, atStart = ds.labelAt === 'start', i = atStart ? 0 : ds.data.length - 1;
      while (i >= 0 && i < ds.data.length && ds.data[i] == null) i += atStart ? 1 : -1;
      if (i < 0 || !pts[i]) return;
      var p = pts[i], text = ds.label + ' ' + fmt(ds.data[i]);
      var w = ctx.measureText(text).width, x = atStart ? Math.max(area.left + 4, p.x - w / 2) : Math.max(area.left + 4, p.x - w - 8);
      var y = p.y - 14 < area.top + 8 ? p.y + 14 : p.y - 14;     // below the point when it's at the top
      labels.push({ p: p, text: text, w: w, x: x, y: y, color: ds.borderColor });
    });
    // keep labels apart: a label that would overlap one already placed moves up (or down at the top edge)
    var hits = function (a, b) { return a.x < b.x + b.w + 6 && b.x < a.x + a.w + 6 && Math.abs(a.y - b.y) < H + GAP; };
    labels.sort(function (a, b) { return a.y - b.y; }).forEach(function (l) {
      var tries = 0;
      while (placed.some(function (o) { return hits(l, o); }) && tries++ < 12) {
        var o = placed.filter(function (q) { return hits(l, q); })[0];
        var up = o.y - H - GAP, down = o.y + H + GAP;
        l.y = (l.y <= o.y && up - H / 2 >= area.top) ? up : down;
      }
      placed.push(l);
    });
    placed.forEach(function (l) {
      if (Math.abs(l.y - l.p.y) > 20) {                         // a thin leader line back to its point once moved
        ctx.strokeStyle = l.color; ctx.lineWidth = 1; ctx.globalAlpha = 0.6;
        ctx.beginPath(); ctx.moveTo(l.p.x, l.p.y); ctx.lineTo(Math.min(l.p.x, l.x + l.w), l.y); ctx.stroke(); ctx.globalAlpha = 1;
      }
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      ctx.fillRect(l.x - 3, l.y - H / 2, l.w + 6, H);
      ctx.fillStyle = l.color;
      ctx.textAlign = 'left';
      ctx.fillText(l.text, l.x, l.y);
      ctx.beginPath(); ctx.arc(l.p.x, l.p.y, 3.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.restore();
  } };

  function axis(extra) {
    return Object.assign({ grid: { color: '#e5e9f0' }, ticks: { color: '#475569', font: { size: 11 } } }, extra || {});
  }

  // Slide 1: cumulative bags, this month vs last month vs the target pace
  function drawSales(g) {
    document.getElementById('cap-sales').textContent = 'Bags sold at the tills, added up day by day. Blue dashes: where ' + g.curLabel + ' lands at its current pace. Grey dashes: ' + g.prevLabel + '. Dotted: the pace that reaches the target.';
    var n = g.days.length;
    var pace = g.days.map(function (d) { return g.target ? Math.round(g.target * d / n) : null; });
    var prev = g.days.map(function (d) { return g.prev[d - 1] != null ? g.prev[d - 1] : null; });
    new Chart(document.getElementById('cv-sales'), {
      type: 'line',
      plugins: [endLabels],
      data: { labels: g.days, datasets: [
        { label: g.curLabel, data: g.cur, borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.10)', fill: true, borderWidth: 3, pointRadius: 0, tension: 0.2 },
        { label: 'Projection', data: g.proj || [], borderColor: '#2563eb', borderDash: [7, 5], borderWidth: 2.5, pointRadius: 0, tension: 0.2 },
        { label: g.prevLabel, data: prev, borderColor: '#94a3b8', borderDash: [6, 4], borderWidth: 2, pointRadius: 0, tension: 0.2 },
        { label: 'Target pace', data: pace, borderColor: '#d97706', borderDash: [2, 4], borderWidth: 2, pointRadius: 0 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { color: '#334155', boxWidth: 18 } },
          tooltip: { callbacks: { title: function (it) { return 'Day ' + it[0].label; }, label: function (c) { return c.dataset.label + ': ' + fmt(c.raw); } } } },
        scales: { x: axis({ grid: { display: false }, title: { display: true, text: 'Day of the month', color: '#64748b' } }),
                  y: axis({ beginAtZero: true, ticks: { color: '#475569', callback: function (v) { return fmt(v); } } }) } }
    });
  }
  draw.sales = drawSales;

  // Slide 2: weekly Kenya till bags (bars) vs new follows and WhatsApp chats (lines)
  function drawFollowers(g) {
    document.getElementById('cap-followers').textContent = 'Kenya, Sun to Sat weeks. Bars: bags at Kenya’s tills (left). Lines: new follows on Instagram + Facebook, and WhatsApp chats (right).';
    var W = g.weeks;
    new Chart(document.getElementById('cv-followers'), {
      type: 'bar',
      plugins: [endLabels],
      data: { labels: W.map(function (w) { return 'Week of ' + w.label; }), datasets: [
        { type: 'bar', label: 'Bags sold (Kenya tills)', data: W.map(function (w) { return w.bags; }), backgroundColor: '#93c5fd', borderRadius: 4, yAxisID: 'y', order: 3 },
        { type: 'line', label: 'New follows', data: W.map(function (w) { return w.follows; }), borderColor: '#9333ea', backgroundColor: '#9333ea', borderWidth: 3, pointRadius: 4, yAxisID: 'y1', order: 1 },
        { type: 'line', label: 'WhatsApp chats', data: W.map(function (w) { return w.chats; }), borderColor: '#059669', backgroundColor: '#059669', borderWidth: 2, borderDash: [5, 4], pointRadius: 3, yAxisID: 'y1', order: 2 }
      ] },
      options: { responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
        plugins: { legend: { position: 'bottom', labels: { color: '#334155', boxWidth: 18 } },
          tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + fmt(c.raw); } } } },
        scales: { x: axis({ grid: { display: false } }),
                  y: axis({ beginAtZero: true, position: 'left', title: { display: true, text: 'Bags', color: '#64748b' }, ticks: { color: '#475569', callback: function (v) { return fmt(v); } } }),
                  y1: axis({ beginAtZero: true, position: 'right', grid: { display: false }, title: { display: true, text: 'Follows and chats', color: '#64748b' }, ticks: { color: '#475569', callback: function (v) { return fmt(v); } } }) } }
    });
  }
  draw.followers = drawFollowers;

  // numbers written at the end of each bar (dataset.endText[i], or the value)
  var barText = { id: 'barText', afterDatasetsDraw: function (ch) {
    var ctx = ch.ctx, horiz = ch.options.indexAxis === 'y';
    ctx.save(); ctx.font = '700 11px Segoe UI, system-ui, sans-serif'; ctx.fillStyle = '#334155';
    ch.data.datasets.forEach(function (ds, di) {
      if ((ds.type || ch.config.type) !== 'bar' || !ch.isDatasetVisible(di) || ds.noText) return;
      ch.getDatasetMeta(di).data.forEach(function (el, i) {
        var t = ds.endText ? ds.endText[i] : fmt(ds.data[i]);
        if (t == null || t === '') return;
        if (horiz) { ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(t, el.x + 5, el.y); }
        else { ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(t, el.x, el.y - 3); }
      });
    });
    ctx.restore();
  } };
  var baseOpts = function (extra) {
    return Object.assign({ responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { position: 'bottom', labels: { color: '#334155', boxWidth: 14 } },
        tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + fmt(c.raw); } } } } }, extra || {});
  };
  var BLUE = '#2563eb', BLUE2 = '#93c5fd', PURPLE = '#9333ea', AMBER = '#d97706', GREY = '#cbd5e1';

  // A. Bag of the Month: units per week for the top seller and the mover, dotted line at each one's month average a week
  draw.botm = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Bags sold each Sun to Sat week of the month. Dotted lines: the month average a week (value in the legend).';
    var cols = [BLUE, PURPLE], ds = [];
    g.series.forEach(function (s, i) {
      ds.push({ type: 'bar', label: s.label, data: s.data, backgroundColor: cols[i] + (i ? 'aa' : 'cc'), borderRadius: 4 });
    });
    var wk = (g.leaders || []).filter(function (l) { return !l.month; });
    if (wk.some(function (l) { return !l.topIsMonth; })) {          // a week led by another bag: that week's top seller, named
      ds.push({ type: 'bar', label: 'That week’s top seller', backgroundColor: '#0d9488cc', borderRadius: 4,
                data: wk.map(function (l) { return l.topIsMonth ? null : l.topUnits; }),
                endText: wk.map(function (l) { return l.topIsMonth ? '' : l.top + ' ' + fmt(l.topUnits); }),
                names: wk.map(function (l) { return l.top; }), before: wk.map(function () { return null; }) });
    }
    if (wk.some(function (l) { return l.moverTo != null; })) {      // each week's own biggest mover, named on its bar
      ds.push({ type: 'bar', label: 'That week’s biggest mover', backgroundColor: AMBER + 'cc', borderRadius: 4,
                data: wk.map(function (l) { return l.moverTo; }),
                endText: wk.map(function (l) { return l.moverTo == null ? '' : l.mover + ' ' + fmt(l.moverTo); }),
                before: wk.map(function (l) { return l.moverFrom; }), names: wk.map(function (l) { return l.mover; }) });
    }
    g.series.forEach(function (s, i) {
      ds.push({ type: 'line', label: s.label.replace(/ \(.*\)$/, '') + ' month average, ' + fmt(s.avg) + ' a week', noEndLabel: true, data: g.labels.map(function () { return s.avg; }),
                borderColor: cols[i], borderDash: [2, 4], borderWidth: 2, pointRadius: 0, labelAt: 'start' });
    });
    var canvasId = 'cv-' + id;
    if (g.leaders && g.leaders.length) {        // each week's own leaders under the chart
      var cv = document.getElementById(canvasId).parentElement, flag = '<span style="color:#b45309;font-weight:800" title="Not the month’s bag"> ●</span>';
      cv.innerHTML = '<div style="position:relative;height:calc(100% - ' + (22 + 19 * g.leaders.length) + 'px)"><canvas id="' + canvasId + '"></canvas></div>'
        + '<table class="lead"><thead><tr><th>Week</th><th>Top seller</th><th>Biggest mover (week before → this week)</th></tr></thead><tbody>'
        + g.leaders.map(function (l) {
            return '<tr' + (l.month ? ' class="m"' : '') + '><td>' + esc(l.week) + '</td><td>' + esc(l.top) + ' ' + fmt(l.topUnits) + (l.topIsMonth ? '' : flag) + '</td>'
              + '<td>' + esc(l.mover) + (l.moverTo != null ? ' ' + fmt(l.moverFrom) + ' → ' + fmt(l.moverTo) : '') + (l.moverIsMonth || l.mover === '—' ? '' : flag) + '</td></tr>';
          }).join('') + '</tbody></table>';
    }
    new Chart(document.getElementById(canvasId), { type: 'bar', plugins: [barText, endLabels], data: { labels: g.labels, datasets: ds },
      options: baseOpts({ plugins: { legend: { position: 'bottom', labels: { color: '#334155', boxWidth: 14 } },
          tooltip: { callbacks: { label: function (c) {
            var d = c.dataset;
            if (!d.names) return d.label + ': ' + fmt(c.raw);
            var b = d.before[c.dataIndex];
            return d.label + ', ' + d.names[c.dataIndex] + ': ' + (b == null ? '' : fmt(b) + ' the week before → ') + fmt(c.raw);
          } } } },
        scales: { x: axis({ grid: { display: false } }), y: axis({ beginAtZero: true, grace: '14%' }) } }) });
  };

  // B. Top 10 moving (units, share on the bar) and the stuck 5 (shop stock vs sold last week)
  draw.top10 = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Top: the 10 bags with the most units last week, % share at the end. Bottom: bags with stock in the shops that barely sold.';
    var cv = document.getElementById('cv-' + id).parentElement;
    cv.innerHTML = '<div style="position:relative;height:58%"><canvas id="cv-' + id + '-a"></canvas></div>'

      + '<div style="position:relative;height:calc(42% - 24px)"><canvas id="cv-' + id + '-b"></canvas></div>';
    new Chart(document.getElementById('cv-' + id + '-a'), { type: 'bar', plugins: [barText],
      data: { labels: g.top.map(function (r) { return r.bag; }), datasets: [{ label: 'Units last week', data: g.top.map(function (r) { return r.units; }),
        backgroundColor: BLUE + 'cc', borderRadius: 3, endText: g.top.map(function (r) { return fmt(r.units) + '  ' + r.share.toFixed(1) + '%'; }) }] },
      options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 70 } }, plugins: { legend: { display: false } },
        scales: { x: axis({ beginAtZero: true, ticks: { display: false }, grid: { display: false } }), y: axis({ grid: { display: false } }) } }) });
    if (!g.stuck.length) return;
    new Chart(document.getElementById('cv-' + id + '-b'), { type: 'bar', plugins: [barText],
      data: { labels: g.stuck.map(function (r) { return r.bag; }), datasets: [
        { label: 'In the shops now', data: g.stuck.map(function (r) { return r.stock; }), backgroundColor: AMBER + 'cc', borderRadius: 3 },
        { label: 'Sold last week', data: g.stuck.map(function (r) { return r.units; }), backgroundColor: GREY, borderRadius: 3 }] },
      options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 40 } },
        plugins: { legend: { position: 'right', labels: { color: '#334155', boxWidth: 12, font: { size: 11 } } } },
        scales: { x: axis({ beginAtZero: true, ticks: { display: false }, grid: { display: false } }), y: axis({ grid: { display: false } }) } }) });
  };

  // C. Top 5 categories: last week vs the week before, share on last week's bar
  draw.cats = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Bags sold per category: last week (dark) vs the week before (light). % = share of all units last week.';
    new Chart(document.getElementById('cv-' + id), { type: 'bar', plugins: [barText],
      data: { labels: g.labels, datasets: [
        { label: g.curLabel, data: g.cur, backgroundColor: BLUE + 'cc', borderRadius: 4,
          endText: g.cur.map(function (v, i) { return fmt(v) + ' (' + g.share[i].toFixed(0) + '%)'; }) },
        { label: g.prevLabel, data: g.prev, backgroundColor: BLUE2, borderRadius: 4, noText: true }] },
      options: baseOpts({ scales: { x: axis({ grid: { display: false } }), y: axis({ beginAtZero: true, grace: '12%' }) } }) });
  };

  // Follower test: Follows → Chats → Bags, and the awareness arrow Follows → Bags, per market
  draw.ftest = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Each arrow is one test on daily figures (weekday-adjusted). Green = passed: score 0.3+ and under 5% chance. Lag = how many days later it shows.';
    var arrow = function (l, label) {
      if (!l || l.score == null) return '<div class="ft-arrow off"><span>' + esc(label) + '</span><b>not enough days</b></div>';
      var when = l.lag ? l.lag + ' day' + (l.lag > 1 ? 's' : '') + ' later' : 'same day';
      return '<div class="ft-arrow ' + (l.passed ? 'pass' : 'fail') + '"><span>' + esc(label) + '</span><b>' + (l.passed ? '✔ passed' : '✖ not passed')
        + '</b><em>score ' + l.score.toFixed(2) + ', ' + when + ', chance ' + (l.p * 100).toFixed(1) + '%</em></div>';
    };
    var cv = document.getElementById('cv-' + id).parentElement;
    cv.innerHTML = '<div class="ft">' + g.markets.map(function (m) {
      var L = m.links || {}, early = m.code === 'early';
      return '<div class="ft-m' + (early ? ' early' : '') + '"><div class="ft-head"><b>' + esc(m.name) + '</b><span class="ft-v ' + esc(m.code) + '">' + esc(m.verdict) + '</span></div>'
        + (early ? '' : '<div class="ft-row"><div class="ft-box">New follows</div>' + arrow(L.f2c, 'Follows → Chats')
          + '<div class="ft-box">WhatsApp chats</div>' + arrow(L.c2b, 'Chats → Bags') + '<div class="ft-box">Bags sold</div></div>'
          + '<div class="ft-aw">' + arrow(L.f2b, 'Follows → Bags, awareness (up to 7 days later)') + '</div>')
        + '</div>';
    }).join('') + '</div>';
  };

  // New products 1: bags per week vs the weekly target (the per-product table is added under it)
  draw.npweeks = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'New-product bags sold each Sun to Sat week of the month (all markets). Dotted: the weekly target.';
    var ds = [{ type: 'bar', label: 'Bags sold', data: g.bags, backgroundColor: BLUE + 'cc', borderRadius: 4 }];
    if (g.target) ds.push({ type: 'line', label: 'Weekly target', data: g.labels.map(function () { return g.target; }), borderColor: AMBER, borderDash: [2, 4], borderWidth: 2, pointRadius: 0 });
    new Chart(document.getElementById('cv-' + id), { type: 'bar', plugins: [barText, endLabels], data: { labels: g.labels, datasets: ds },
      options: baseOpts({ scales: { x: axis({ grid: { display: false } }), y: axis({ beginAtZero: true, grace: '12%' }) } }) });
  };

  // New products 2: runway styles, sold this month and last week (since created + stock on hover and at the end)
  draw.runway = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Last month’s new styles: bags sold this month (dark) and last week (light). At the end: last week (the week before), sold since created, stock now.';
    var R = g.rows;
    if (!R.some(function (r) { return r.month || r.last || r.life; })) {   // nothing sold yet: how long each has waited, and its stock
      document.getElementById('cap-' + id).textContent = 'No runway bag has sold yet. Bars: days since the style was created in Odoo; at the end: stock in the shops now.';
      new Chart(document.getElementById('cv-' + id), { type: 'bar', plugins: [barText],
        data: { labels: R.map(function (r) { return r.style; }), datasets: [
          { label: 'Days since created', data: R.map(function (r) { return r.age; }), borderRadius: 3,
            backgroundColor: R.map(function (r) { return r.stock ? '#059669cc' : '#dc2626aa'; }),
            endText: R.map(function (r) { return r.age + (r.age === 1 ? ' day, ' : ' days, ') + (r.stock ? fmt(r.stock) + ' in stock' : 'no stock'); }) }] },
        options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 120 } }, plugins: { legend: { display: false } },
          scales: { x: axis({ beginAtZero: true, ticks: { display: false }, grid: { display: false } }), y: axis({ grid: { display: false } }) } }) });
      return;
    }
    new Chart(document.getElementById('cv-' + id), { type: 'bar', plugins: [barText],
      data: { labels: R.map(function (r) { return r.style; }), datasets: [
        { label: 'This month', data: R.map(function (r) { return r.month; }), backgroundColor: BLUE + 'cc', borderRadius: 3,
          endText: R.map(function (r) { return fmt(r.month) + '   last wk ' + fmt(r.last) + (r.prev != null ? ' (was ' + fmt(r.prev) + ')' : '')
                                                 + ', since created ' + fmt(r.life) + ', stock ' + fmt(r.stock); }) },
        { label: 'Last week', data: R.map(function (r) { return r.last; }), backgroundColor: BLUE2, borderRadius: 3, noText: true }] },
      options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 280 } },
        scales: { x: axis({ beginAtZero: true, ticks: { display: false }, grid: { display: false } }), y: axis({ grid: { display: false } }) } }) });
  };

  // New products 3: per shop, last week vs the week before, month to date at the end
  draw.npshops = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'New-product bags per shop: last week (dark) vs the week before (light). At the end: month to date.';
    var R = g.rows;
    new Chart(document.getElementById('cv-' + id), { type: 'bar', plugins: [barText],
      data: { labels: R.map(function (r) { return r.shop; }), datasets: [
        { label: g.curLabel, data: R.map(function (r) { return r.last; }), backgroundColor: BLUE + 'cc', borderRadius: 3,
          endText: R.map(function (r) { return fmt(r.last) + (r.prev == null ? '' : ' (was ' + fmt(r.prev) + ')') + ', month ' + fmt(r.month); }) },
        { label: g.prevLabel, data: R.map(function (r) { return r.prev; }), backgroundColor: BLUE2, borderRadius: 3, noText: true }] },
      options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 130 } },
        scales: { x: axis({ beginAtZero: true, ticks: { display: false }, grid: { display: false } }), y: axis({ grid: { display: false }, ticks: { color: '#475569', font: { size: 10 }, autoSkip: false } }) } }) });
  };

  // New products 4: sold vs still needed per product, % at the end, where it should be by now as a tick
  draw.nptarget = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Sold this month (green = on pace, red = behind) and still needed (light). The | mark = where it should be by now (' + g.gone + '% of the month gone).';
    var R = g.rows;
    var tick = { id: 'paceTick', afterDatasetsDraw: function (ch) {
      var ctx = ch.ctx, x = ch.scales.x, y = ch.scales.y;
      ctx.save(); ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 2;
      R.forEach(function (r, i) { var px = x.getPixelForValue(r.expected), py = y.getPixelForValue(i), h = 9;
        ctx.beginPath(); ctx.moveTo(px, py - h); ctx.lineTo(px, py + h); ctx.stroke(); });
      ctx.restore();
    } };
    new Chart(document.getElementById('cv-' + id), { type: 'bar', plugins: [barText, tick],
      data: { labels: R.map(function (r) { return r.name; }), datasets: [
        { label: 'Sold', data: R.map(function (r) { return r.sold; }), stack: 's', noText: true,
          backgroundColor: R.map(function (r) { return r.onPace ? '#059669cc' : '#dc2626bb'; }), borderRadius: 3 },
        { label: 'Still needed', data: R.map(function (r) { return Math.max(r.target - r.sold, 0); }), stack: 's', backgroundColor: '#e2e8f0', borderRadius: 3,
          endText: R.map(function (r) { return fmt(r.sold) + ' of ' + fmt(r.target) + '  ' + r.pct + '%'; }) }] },
      options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 100 } }, plugins: { legend: { display: false } },
        scales: { x: axis({ stacked: true, beginAtZero: true }), y: axis({ stacked: true, grid: { display: false } }) } }) });
  };

  // New products 5: colours with stock, could move well (top) vs least performers (bottom)
  draw.npstock = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'New-product colours with 5+ in stock: sold this month vs in stock now.';
    var cv = document.getElementById('cv-' + id).parentElement;
    cv.innerHTML = '<div style="font-size:0.74rem;font-weight:700;color:#059669;margin:0 0 2px">Could move well: selling, with stock behind them</div>'
      + '<div style="position:relative;height:calc(50% - 22px)"><canvas id="cv-' + id + '-a"></canvas></div>'
      + '<div style="font-size:0.74rem;font-weight:700;color:#b45309;margin:6px 0 2px">Least performers: stock, few sales</div>'
      + '<div style="position:relative;height:calc(50% - 22px)"><canvas id="cv-' + id + '-b"></canvas></div>';
    [['a', g.movers, '#059669'], ['b', g.least, AMBER]].forEach(function (p) {
      if (!p[1].length) return;
      new Chart(document.getElementById('cv-' + id + '-' + p[0]), { type: 'bar', plugins: [barText],
        data: { labels: p[1].map(function (r) { return r.name; }), datasets: [
          { label: 'Sold this month', data: p[1].map(function (r) { return r.sold; }), backgroundColor: p[2] + 'cc', borderRadius: 3 },
          { label: 'In stock', data: p[1].map(function (r) { return r.stock; }), backgroundColor: GREY, borderRadius: 3 }] },
        options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 40 } },
          plugins: { legend: { position: 'right', labels: { color: '#334155', boxWidth: 12, font: { size: 11 } } } },
          scales: { x: axis({ beginAtZero: true, ticks: { display: false }, grid: { display: false } }), y: axis({ grid: { display: false } }) } }) });
    });
  };

  // E. Who buys: top 10 bags women bought (top) and men bought (bottom), share of that bag's buyers at the end
  draw.buyers = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'The bags with the highest share of women (left) or men (right) among their buyers this month, from the customer’s gender in Odoo. At the end: units that side bought, and its share.';
    var cv = document.getElementById('cv-' + id).parentElement;
    cv.innerHTML = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100%">'
      + '<div style="display:flex;flex-direction:column;min-height:0"><div style="font-size:0.78rem;font-weight:700;color:#db2777;margin-bottom:2px">Bags women lean to</div>'
      + '<div style="position:relative;flex:1;min-height:0"><canvas id="cv-' + id + '-f"></canvas></div></div>'
      + '<div style="display:flex;flex-direction:column;min-height:0"><div style="font-size:0.78rem;font-weight:700;color:#2563eb;margin-bottom:2px">Bags men lean to</div>'
      + '<div style="position:relative;flex:1;min-height:0"><canvas id="cv-' + id + '-m"></canvas></div></div></div>';
    [['f', g.women, '#db2777', 'women'], ['m', g.men, '#2563eb', 'men']].forEach(function (p) {
      if (!p[1].length) return;
      new Chart(document.getElementById('cv-' + id + '-' + p[0]), { type: 'bar', plugins: [barText],
        data: { labels: p[1].map(function (r) { return r.bag; }), datasets: [{ label: 'Bags', data: p[1].map(function (r) { return r.units; }),
          backgroundColor: p[2] + 'cc', borderRadius: 3, endText: p[1].map(function (r) { return fmt(r.units) + '  ' + r.pct + '% ' + p[3]; }) }] },
        options: baseOpts({ indexAxis: 'y', layout: { padding: { right: 92 } }, plugins: { legend: { display: false } },
          scales: { x: axis({ beginAtZero: true, ticks: { display: false }, grid: { display: false } }), y: axis({ grid: { display: false }, ticks: { color: '#475569', font: { size: 10 }, autoSkip: false } }) } }) });
    });
  };

  // D. Male vs female bags: units per week of the month, share on the bar
  draw.gender = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Bags sold each Sun to Sat week of the month, by who the bag is for. % = share of that week’s units.';
    var sides = [['Male', '#2563eb'], ['Female', '#db2777'], ['Unisex', '#94a3b8']];
    new Chart(document.getElementById('cv-' + id), { type: 'bar', plugins: [barText],
      data: { labels: g.weeks.map(function (w) { return w.label; }), datasets: sides.map(function (s) {
        return { label: s[0], data: g.weeks.map(function (w) { return w[s[0]]; }), backgroundColor: s[1] + 'cc', borderRadius: 4,
                 endText: g.weeks.map(function (w) { return fmt(w[s[0]]) + ' (' + w[s[0] + 'Pct'] + '%)'; }) };
      }) },
      options: baseOpts({ scales: { x: axis({ grid: { display: false } }), y: axis({ beginAtZero: true, grace: '12%' }) } }) });
  };

  // 2b. Sinza and Uganda: one panel each, bags at the till per day (bars) and new follows (line)
  draw.folmk = function (g, id) {
    document.getElementById('cap-' + id).textContent = 'Each day since the pages joined Odoo. Bars: bags sold at the shop (left). Dashed line: shop visitors counted (left; gaps = not counted). Line: new follows on Instagram + Facebook (right).';
    var cv = document.getElementById('cv-' + id).parentElement;    // the markets side by side, each the full height
    cv.innerHTML = '<div style="display:grid;grid-template-columns:repeat(' + g.panels.length + ',minmax(0,1fr));gap:12px;height:100%">'
      + g.panels.map(function (p, i) {
          return '<div style="display:flex;flex-direction:column;min-height:0"><div style="font-size:0.78rem;font-weight:700;color:#334155;margin-bottom:2px">'
            + esc(p.name) + '</div><div style="position:relative;flex:1;min-height:0"><canvas id="cv-' + id + '-' + i + '"></canvas></div></div>';
        }).join('') + '</div>';
    g.panels.forEach(function (p, i) {
      new Chart(document.getElementById('cv-' + id + '-' + i), { type: 'bar', plugins: [endLabels],
        data: { labels: p.labels, datasets: [
          { type: 'bar', label: 'Bags sold', data: p.bags, backgroundColor: BLUE2, borderRadius: 3, yAxisID: 'y' },
          { type: 'line', label: 'Shop visitors', data: p.visitors || [], borderColor: AMBER, backgroundColor: AMBER, borderWidth: 2, borderDash: [5, 4], pointRadius: 2.5, spanGaps: false, yAxisID: 'y' },
          { type: 'line', label: 'New follows', data: p.follows, borderColor: PURPLE, backgroundColor: PURPLE, borderWidth: 2.5, pointRadius: 2.5, yAxisID: 'y1' }] },
        options: baseOpts({ interaction: { mode: 'index', intersect: false },
          plugins: { legend: { display: true, position: 'bottom', labels: { color: '#334155', boxWidth: 14 } } },
          scales: { x: axis({ grid: { display: false }, ticks: { color: '#475569', font: { size: 10 }, maxRotation: 0, autoSkip: true } }),
                    y: axis({ beginAtZero: true, position: 'left' }),
                    y1: axis({ beginAtZero: true, position: 'right', grid: { display: false } }) } }) });
    });
  };

  (WR.slides || []).forEach(function (s) {
    var k = s.graph && (s.graph.kind || s.id);
    if (k && draw[k] && s.graph.ok && window.Chart) draw[k](s.graph, s.id);
    var t = s.graph && s.graph.table;                // a table under the chart (WhatsApp buyers by source)
    if (t && t.rows && t.rows.length) {
      var box = document.createElement('div');
      box.innerHTML = '<div style="font-size:0.72rem;font-weight:700;color:#334155;margin:6px 0 2px">' + esc(t.title) + '</div>'
        + '<table class="lead src' + (t.wrap ? ' wrap' : '') + '"><thead><tr>' + t.cols.map(function (c, i) { return '<th' + (i ? ' class="n"' : '') + '>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>'
        + t.rows.map(function (r) {
            return '<tr' + (r[0] === t.mark ? ' class="fp"' : '') + '>' + r.map(function (c, i) {
              var neg = typeof c === 'string' && /^-\d|\(-\d/.test(c), pos = typeof c === 'string' && /^\+\d|\(\+\d/.test(c);
              return '<td' + (i ? ' class="n' + (neg ? ' neg' : pos ? ' pos' : '') + '"' : '') + '>' + esc(c) + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table>';
      var gr = document.querySelector('#slide-' + s.id + ' .graph');
      gr.classList.add('has-table');
      if (t.rows.length > 7) { var cvx = gr.querySelector('.cv'); if (cvx) cvx.style.minHeight = '34%'; }
      gr.appendChild(box);
    }
  });
})();
</script>
</body>
</html>

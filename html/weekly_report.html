<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Report</title>
  <!-- Spec: docs/weekly-report.md. Each slide: Headline (B1) / Graph (B2) / Insight / Biz Rec (B3). -->
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --page: #e9ecf2; --paper: #ffffff; --ink: #0f172a; --ink-2: #334155; --muted: #64748b;
      --rule: #0f172a; --line: #d6dbe4; --accent: #2563eb; --good: #059669; --bad: #dc2626; --warn: #b45309;
      --rec-bg: #fff7e6; --rec-rule: #f59e0b; --ins-bg: #f4f7fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; font-feature-settings: "tnum" 1, "cv11" 1;
           -webkit-font-smoothing: antialiased; }
    .bar { max-width: 1180px; margin: 0 auto; padding: 16px 16px 0; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .bar h1 { margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--ink-2); }
    .bar h1 span { color: var(--muted); font-weight: 500; }
    .btn { border: 1px solid var(--ink); background: var(--ink); color: #fff; font: 600 0.85rem/1 inherit; padding: 9px 14px;
           border-radius: 8px; cursor: pointer; font-family: inherit; }
    .btn:hover { background: #1e293b; }
    .deck { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 22px; }

    .slide { background: var(--paper); border: 6px solid var(--rule); border-radius: 6px; aspect-ratio: 16 / 9;
             display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-shadow: 0 10px 30px rgba(15,23,42,0.12); }
    /* Foot traffic band (Walk-ins / Not walk-ins / WhatsApp), the Denri dashboard's Foot Traffic page figures */
    .slide.has-band { grid-template-rows: auto auto 1fr auto; }
    .slide.has-band .box ul { font-size: 0.76rem; line-height: 1.3; }
    .slide.has-band .box { padding: 9px 14px; } .slide.has-band .box h3 { margin-bottom: 4px; }
    .slide.has-band .box li { margin-bottom: 3px; }
    .band { display: grid; gap: 0 18px; padding: 7px 22px 8px; border-bottom: 4px solid var(--rule); background: #fafbfd; }
    .band .mk { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 2px; }
    .band .row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: 0.74rem; line-height: 1.5; color: var(--ink-2); }
    .band .row .g { font-weight: 800; color: var(--ink); min-width: 92px; }
    .band .row .g i { font-weight: 500; font-style: normal; color: var(--muted); font-size: 0.66rem; margin-left: 5px; }
    .band .row span.k { white-space: nowrap; cursor: help; }
    .band .row span.k b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .band { gap: 8px 12px; padding: 8px 16px; }
    .band .mkbox { border: 1.5px solid var(--line); border-radius: 8px; padding: 6px 8px 7px; background: #fff; min-width: 0; }
    .band .grp { display: grid; grid-template-columns: 84px minmax(0, 1fr); align-items: stretch; gap: 6px; margin-top: 4px; }
    .band .gl { font-size: 0.7rem; font-weight: 800; color: var(--ink); display: flex; align-items: center; cursor: help;
                border-left: 3px solid var(--acc, #94a3b8); padding-left: 6px; }
    .band .grp.g0 { --acc: #059669; } .band .grp.g1 { --acc: #94a3b8; } .band .grp.g2 { --acc: #16a34a; }
    .band .tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
    .totals { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin: 0 0 6px; font-size: 0.72rem; }
    .totals .tl { color: var(--ink); margin-right: 4px; }
    .tchip { display: inline-flex; align-items: baseline; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; background: #f8fafc; }
    .tchip i { font-style: normal; color: var(--muted); } .tchip b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .tchip.up { background: #ecfdf5; border-color: #a7f3d0; } .tchip.up b { color: #15803d; }
    .tchip.down { background: #fef2f2; border-color: #fecaca; } .tchip.down b { color: #b91c1c; }
    table.lead td.up { color: #15803d; font-weight: 700; } table.lead td.dn { color: #b91c1c; font-weight: 700; }
    .dtog { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
    .dtog button { border: 0; background: transparent; font: 600 0.85rem/1 inherit; font-family: inherit; color: var(--ink-2);
                   padding: 8px 14px; border-radius: 999px; cursor: pointer; }
    .dtog button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .slide.off { display: none !important; }
    .sgroups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
    .sgrp { border: 1.5px solid var(--line); border-radius: 8px; padding: 4px 7px 5px; font-size: 0.68rem; line-height: 1.35; background: #fff; }
    .sgrp b { display: flex; justify-content: space-between; font-size: 0.72rem; margin-bottom: 2px; }
    .sgrp b span { border-radius: 999px; padding: 0 7px; font-size: 0.68rem; }
    .sgrp i { font-style: normal; display: inline-block; margin: 0 6px 1px 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sgcol { display: flex; flex-direction: column; gap: 6px; min-height: 0; overflow: hidden; }
    .sgcol .sgrp table { width: 100%; border-collapse: collapse; font-size: 0.66rem; font-variant-numeric: tabular-nums; }
    .sgcol .sgrp th { font-size: 0.56rem; color: var(--muted); font-weight: 700; text-align: right; padding: 0 2px; }
    .sgcol .sgrp th:first-child, .sgcol .sgrp td:first-child { text-align: left; }
    .sgcol .sgrp td { text-align: right; padding: 0 2px; color: #334155; } .sgcol .sgrp td:last-child { font-weight: 800; }
    .sgcol .sgrp.dn td:last-child { color: #b91c1c; } .sgcol .sgrp.up td:last-child { color: #15803d; }
    .sgrp.dn { border-color: #fecaca; } .sgrp.dn b { color: #b91c1c; } .sgrp.dn b span { background: #fee2e2; }
    .sgrp.up { border-color: #a7f3d0; } .sgrp.up b { color: #15803d; } .sgrp.up b span { background: #dcfce7; }
    .sgrp.eq b { color: #475569; } .sgrp.eq b span { background: #f1f5f9; }
    .sgrp .none, .sgrp .more { color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
    .ccard { border: 1.5px solid var(--line); border-radius: 8px; padding: 5px 7px; background: #fff; font-size: 0.68rem; line-height: 1.3; min-width: 0; }
    .ccard .ch { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .ccard .ch b { font-size: 0.78rem; color: var(--ink); } .ccard .ch span { color: var(--muted); }
    .ccard i { font-style: normal; font-weight: 700; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 5px; }
    .ccard .best { background: #ecfdf5; border-left: 3px solid #059669; border-radius: 4px; padding: 1px 5px; margin-bottom: 3px; color: #064e3b; }
    .ccard .best i { color: #059669; } .ccard .best b { font-variant-numeric: tabular-nums; }
    .ccard .weak i { color: #b45309; display: block; margin-bottom: 1px; }
    .ccard .chip { display: inline-block; background: #fff7ed; border: 1px solid #fed7aa; color: #7c2d12; border-radius: 999px;
                   padding: 0 6px; margin: 0 3px 2px 0; white-space: nowrap; }
    .ccard .chip b { font-variant-numeric: tabular-nums; } .ccard .none { color: var(--muted); }
    .cards.c5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
    /* a slide whose Insight carries a full explanation: wider side column, a touch smaller text */
    .slide.wide-side .body { grid-template-columns: 1.12fr 1fr; }
    .slide.wide-side .box ul { font-size: 0.68rem; line-height: 1.28; } .slide.wide-side .box li { margin-bottom: 3px; }
    .slide.wide-side .box { padding: 8px 14px; }
    .sortbtn { margin-left: 8px; border: 1px solid #cbd5e1; background: #fff; color: #334155; border-radius: 999px; padding: 1px 9px;
               font: 600 0.68rem/1.5 inherit; font-family: inherit; cursor: pointer; vertical-align: middle; }
    .sortbtn:hover { border-color: #64748b; } .sortbtn.on { background: #0f172a; border-color: #0f172a; color: #fff; }
    html.cap .sortbtn { display: none; }
    html.cap .box ul { list-style: none; padding-left: 0; }
    @media print { .sortbtn { display: none; } }
    .wsgrid { columns: 2; column-gap: 8px; height: 100%; }
    .wsgrid .wscard { break-inside: avoid; margin-bottom: 5px; }
    .wscard { border: 1.5px solid var(--line); border-radius: 8px; padding: 2px 5px 3px; background: #fff; min-width: 0; }
    .wscard.up { border-color: #a7f3d0; } .wscard.dn { border-color: #fecaca; }
    .wscard table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 0.7rem; font-variant-numeric: tabular-nums; }
    .wscard th { font-size: 0.6rem; color: var(--muted); font-weight: 700; text-align: right; padding: 0 2px; white-space: nowrap; }
    .wscard th:first-child { width: 37%; }
    .wscard th.rn { text-align: left; font-size: 0.74rem; font-weight: 800; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
    .wscard .wt { display: flex; justify-content: space-between; font-size: 0.74rem; font-weight: 800; color: var(--ink); margin-bottom: 1px; }
    .wscard td { padding: 0 2px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #334155; }
    .wscard td:first-child { text-align: left; }
    .wscard tr.reg td { font-weight: 800; color: var(--ink); font-size: 0.7rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; }
    .wscard tr.shop td:first-child { padding-left: 8px; }
    .wscard td.pos { color: #15803d; font-weight: 700; } .wscard td.neg { color: #b91c1c; font-weight: 700; }
    .ccard .ct { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 0.64rem; }
    .ccard .ct th { font-size: 0.56rem; font-weight: 700; color: var(--muted); text-align: right; text-transform: uppercase; }
    .ccard .ct th:first-child { width: 42%; } .ccard .ct th:nth-child(2) { width: 25%; } .ccard .ct th { white-space: nowrap; padding: 0 2px 0 4px; }
    .ccard .ct th:nth-child(2), .ccard .ct td:nth-child(2) { padding-right: 5px; } .ccard .ct th:last-child, .ccard .ct td:last-child { padding-left: 5px; border-left: 1px solid #eef1f5; }
    .ccard .ct td + td { overflow: visible; text-overflow: clip; }
    .ccard .ct td { padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .ccard .ct td:first-child { white-space: normal; line-height: 1.15; }
    .cards.c5 .ccard { padding: 5px 5px; } .cards.c5 .ccard .ch { flex-direction: column; align-items: flex-start; } .cards.c5 .ccard .ch span { font-size: 0.6rem; }
    .ccard .ct td + td { text-align: right; font-variant-numeric: tabular-nums; }
    .ccard .ct tr.best td { background: #ecfdf5; color: #064e3b; font-weight: 700; }
    .ccard .ct tr.weak td { color: #7c2d12; } .ccard .ct tr.weak td:nth-child(2) { font-weight: 700; }
    .ccard .ct td.lb { font-size: 0.56rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; padding-top: 3px; }
    .ccard .ct td.lb.best { color: #059669; background: none; } .ccard .ct td.lb.weak { color: #b45309; }
    .band .mkbox.wide .grps { display: grid; grid-template-columns: 5fr 5fr 3fr; gap: 10px; }
    .band .mkbox.wide .grp { grid-template-columns: 1fr; gap: 2px; margin-top: 3px; }
    .band .mkbox.wide .gl { border-left: 0; border-bottom: 2px solid var(--acc); padding: 0 0 1px; font-size: 0.68rem; }
    .band .mkbox.wide .tiles { grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
    .band .tile b { font-size: 0.8rem; } .band .tile { padding: 1px 5px 2px; } .band .grp { margin-top: 3px; }
    .band .tile { border: 1px solid #e2e8f0; border-top: 2px solid var(--acc, #cbd5e1); border-radius: 6px; padding: 2px 6px 3px;
                  background: #f8fafc; line-height: 1.15; min-width: 0; cursor: help; }
    .band .tile b { display: block; font-size: 0.84rem; color: var(--ink); font-variant-numeric: tabular-nums; }
    .band .tile em { display: block; font-style: normal; font-size: 0.58rem; font-weight: 600; color: #475569; line-height: 1.15; }
    .band .tile span { display: block; font-size: 0.6rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .head { border-bottom: 4px solid var(--rule); padding: 14px 22px 12px; }
    .kicker { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .headline { font-size: 1.45rem; font-weight: 800; line-height: 1.25; text-wrap: balance; }
    .headline.bad { color: #991b1b; } .headline.good { color: #065f46; }
    .body { display: grid; grid-template-columns: 1.55fr 1fr; min-height: 0; }
    .graph { border-right: 4px solid var(--rule); padding: 14px 16px 10px; display: flex; flex-direction: column; min-height: 0; }
    .graph .cap { font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; }
    .graph .cv { position: relative; flex: 1; min-height: 0; }
    .side { display: grid; grid-template-rows: 1fr auto; min-height: 0; }
    .box { padding: 12px 16px; min-height: 0; overflow: hidden; }
    .box h3 { margin: 0 0 6px; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .insight { background: var(--ins-bg); }
    .insight h3 { color: var(--accent); }
    .rec { background: var(--rec-bg); border-top: 4px solid var(--rule); }
    .rec h3 { color: var(--warn); }
    .box ul { margin: 0; padding-left: 1.05rem; font-size: 0.86rem; line-height: 1.42; color: var(--ink-2); }
    .box li { margin-bottom: 5px; }
    .box li b { color: var(--ink); font-variant-numeric: tabular-nums; }
    .rec li { color: var(--ink); font-weight: 600; }
    .foot { font-size: 0.68rem; color: var(--muted); padding: 5px 22px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; }
    table.lead { width: 100%; border-collapse: collapse; font-size: 0.74rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
    table.lead th { text-align: left; color: var(--muted); font-weight: 700; border-bottom: 1px solid var(--line); padding: 1px 6px; }
    table.lead td { padding: 1px 6px; color: var(--ink-2); border-bottom: 1px solid #eef1f5; white-space: nowrap; }
    .ft { display: grid; gap: 10px; height: 100%; align-content: start; overflow: hidden; }
    .ft-m { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
    .ft-m.early { background: #f8fafc; }
    .ft-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; font-size: 0.85rem; }
    .ft-v { font-size: 0.78rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #e2e8f0; color: #334155; }
    .ft-v.chats { background: #d1fae5; color: #065f46; } .ft-v.awareness { background: #e0e7ff; color: #3730a3; }
    .ft-v.leak { background: #ffedd5; color: #9a3412; } .ft-v.none { background: #f1f5f9; color: #475569; }
    .ft-row { display: grid; grid-template-columns: auto 1fr auto 1fr auto; gap: 6px; align-items: center; }
    .ft-box { border: 2px solid var(--ink); border-radius: 6px; padding: 6px 8px; font-weight: 800; font-size: 0.78rem; text-align: center; background: #fff; white-space: nowrap; }
    .ft-arrow { position: relative; text-align: center; font-size: 0.68rem; line-height: 1.25; padding: 2px 10px 6px; color: #64748b; }
    .ft-arrow::after { content: ''; position: absolute; left: 0; right: 6px; bottom: 0; border-bottom: 3px solid currentColor; }
    .ft-arrow::before { content: ''; position: absolute; right: 0; bottom: -4px; border-left: 8px solid currentColor; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
    .ft-arrow span, .ft-arrow b, .ft-arrow em { display: block; } .ft-arrow em { font-style: normal; }
    .ft-arrow.pass { color: var(--good); } .ft-arrow.fail { color: #94a3b8; } .ft-arrow.off { color: #cbd5e1; }
    .ft-arrow.pass span, .ft-arrow.fail span, .ft-arrow.off span { color: #334155; font-weight: 600; }
    .ft-aw { margin: 6px 40px 0; }
    .graph.has-table .cv { min-height: 55%; }
    .graph.has-table > div:last-child { flex: 0 0 auto; }          /* the table keeps its full height; the chart gives way */
    .graph.has-table .cv { flex: 1 1 auto; min-height: 110px !important; }
    table.lead.src { font-size: 0.68rem; }
    table.lead.wrap td { white-space: normal; vertical-align: top; } table.lead.wrap td, table.lead.wrap th { text-align: left; }
    table.lead.src td, table.lead.src th { padding: 0 6px; }
    table.lead .n { text-align: right; }
    table.lead td.neg { color: var(--bad); font-weight: 700; } table.lead td.pos { color: var(--good); font-weight: 700; }
    table.lead tr.fp td { background: #f3e8ff; color: #6b21a8; font-weight: 700; }
    table.lead tr.m td { font-weight: 700; color: var(--ink); border-top: 1px solid var(--line); }
    .empty { color: var(--muted); font-size: 0.9rem; margin: auto; text-align: center; }

    .cover { display: flex; flex-direction: column; justify-content: flex-start; padding: 32px 44px 24px; gap: 8px; min-height: 0; overflow: hidden; }
    .cover .kicker { font-size: 0.85rem; }
    .cover h2 { margin: 0; font-size: 2.6rem; font-weight: 800; letter-spacing: -0.01em; }
    .cover .wk { font-size: 1.3rem; color: var(--ink-2); font-weight: 600; }
    .cover .beats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 12px; max-width: 760px; }
    .cover .beat { border: 2px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 0.82rem; color: var(--ink-2); }
    .cover .beat b { display: block; color: var(--ink); font-size: 0.95rem; margin-bottom: 2px; }
    .cover ol { margin: 12px 0 0; padding-left: 1.4rem; color: var(--ink-2); font-size: 0.86rem; line-height: 1.62; columns: 3; column-gap: 28px; }
    .cover ol li { break-inside: avoid; }
    .cover .cclock { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 5px 14px; border-radius: 999px;
                     border: 1px solid var(--line); background: #f8fafc; font-size: 0.88rem; font-weight: 600; color: var(--ink-2);
                     font-variant-numeric: tabular-nums; }
    .cover .cclock i { width: 9px; height: 9px; border-radius: 50%; background: #d4af5f; box-shadow: 0 0 0 3px rgba(212,175,95,.22); }
    .cover .ctop { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px; }
    .cover .by { text-align: right; color: var(--muted); font-size: 0.85rem; line-height: 1.45; padding-top: 4px; white-space: nowrap; }
    .cover .by b { color: var(--ink); font-size: 0.95rem; }

    /* Colours (23 Nov 2026, trial for the user's approval): light slides, navy headline band, dashboard emerald accent */
    :root { --page: #ecebe7; --ins-bg: #eef4ff; --panel: #fafaf8; --navy: #15130f; --emerald: #d4af5f; --gold: #c99a3e; --gold2: #e2bf6e; }
    .slide, .slide * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .head { background: var(--navy); color: #fff; }
    .head .kicker { color: var(--emerald); }
    .head .headline { color: #fff; } .head .headline.bad { color: #fecaca; } .head .headline.good { color: #a7f3d0; }
    .graph { background: var(--panel); }
    .foot { background: #f1f5f9; }
    .cover { background: var(--navy); color: #fff; } .slide:has(.cover) { background: var(--navy); }
    .cover .kicker { color: var(--emerald); } .cover h2 { color: #fff; } .cover .wk { color: #cbd5e1; }
    .cover .beat { border-color: #334155; background: rgba(255,255,255,0.05); color: #cbd5e1; } .cover .beat b { color: #fff; }
    .cover ol { color: #d6d0c4; } .cover ol li::marker { color: var(--emerald); }
    .cover .beat { border-color: #3a3326 !important; } .cover .cclock { border-color: #3a3326 !important; }
    /* Denri logo: on the cover (large, with the wordmark and tagline) and in every headline band (small) */
    .dlogo { display: block; color: #f3ead6; } .dlogo svg { display: block; width: 100%; height: 100%; }
    .cover .dlogo { width: 74px; height: 74px; margin: 0 auto 2px; }

    load.then(function () {
      var pressed = document.querySelector('.dtog button[aria-pressed="true"]');
      var d = pressed ? pressed.getAttribute('data-deck') : 'marketing';
      var slides = [].filter.call(deck.querySelectorAll('section.slide'), function (el) {
        return !el.classList.contains('off') && el.querySelector('.graph'); });
      var k = 0, shots = [];
      function shoot() {
        if (k >= slides.length) return Promise.resolve();
        igBtn.textContent = 'Graph ' + (k + 1) + ' of ' + slides.length + '…';
        var el = slides[k++], gEl = el.querySelector('.graph');
        return html2canvas(gEl, { scale: 1.5, backgroundColor: '#f8fafc', logging: false, onclone: capMode }).then(function (c) {
          var h = el.querySelector('.headline'), kk = el.querySelector('.kicker'), r = el.querySelector('.rec li');
          shots.push({ img: c.toDataURL('image/jpeg', 0.9), kicker: kk ? kk.textContent : '', head: h ? h.textContent : '',
                       tone: h && h.classList.contains('bad') ? 'bad' : h && h.classList.contains('good') ? 'good' : '',
                       rec: r ? r.textContent : '' });
          return shoot();
        });
      }
      return shoot().then(function () {
        igBtn.textContent = 'Drawing…';
        var kp = [], S = byId.sales && byId.sales.graph, C = byId.corporate && byId.corporate.graph;
        if (S && S.ok) {
          kp.push(['#2563eb', fmt(S.tillToDate), 'bags at the tills, ' + S.curLabel + ' to date']);
          if (S.target) kp.push([S.tillToDate / S.target >= (S.done / (S.days.length || S.days)) ? '#059669' : '#dc2626',
                                 Math.round(S.tillToDate / S.target * 100) + '%', 'of the ' + fmt(S.target) + ' target, ' + Math.round(S.done / (S.days.length || S.days) * 100) + '% of the month gone']);
          if (S.proj && S.proj.length) kp.push(['#0f172a', fmt(Math.round(S.proj[S.proj.length - 1] || 0)), 'projected by month end']);
          if (S.samePrev) { var c = Math.round((S.tillToDate - S.samePrev) / S.samePrev * 100);
            kp.push([c >= 0 ? '#059669' : '#dc2626', (c >= 0 ? '+' : '') + c + '%', 'vs the same days of ' + S.prevLabel]); }
        }
        if (d === 'sales' && C && C.strip) {
          var col = (C.strip.kes || 0) + ((C.shopStrip || {}).kes || 0), owed = (C.strip.owed || 0) + ((C.shopStrip || {}).owed || 0);
          kp.push(['#059669', 'KES ' + igKm(col), 'corporate collected']);
          kp.push(['#dc2626', 'KES ' + igKm(owed), 'corporate still owed']);
        }
        box = document.createElement('div'); box.className = 'ig';
        box.innerHTML = '<div class="ig-top"><div style="display:flex;gap:22px;align-items:center"><div style="width:84px;height:84px;flex:none">' + DLOGO + '</div><div><div class="k">Denri Africa ' + (d === 'sales' ? 'Sales' : 'Marketing') + '</div>'
          + '<h1 style="font-family:\'Playfair Display\',Georgia,serif;font-weight:600">Weekly ' + (d === 'sales' ? 'Sales' : 'Marketing') + ' Report</h1><div class="wk">Week of ' + esc(WR.weekLabel || '') + '</div></div></div>'
          + '<div class="by"><b>' + esc((WR.owner || {}).name || '') + '</b><br>' + esc((WR.owner || {}).title || '') + '<br>Built ' + esc(WR.built || '') + '</div></div>'
          + (kp.length ? '<div class="ig-kpis" style="--n:' + kp.length + '">' + kp.map(function (x) {
              return '<div class="ig-kpi" style="--c:' + x[0] + '"><b>' + x[1] + '</b><span>' + esc(x[2]) + '</span></div>'; }).join('') + '</div>' : '')
          + '<div class="ig-grid">' + shots.map(function (x) {
              return '<div class="ig-card"><div class="h ' + x.tone + '"><i>' + esc(x.kicker) + '</i><b>' + esc(x.head) + '</b></div>'
                + '<img src="' + x.img + '">' + (x.rec ? '<div class="r"><i>Do next</i>' + esc(x.rec) + '</div>' : '') + '</div>'; }).join('') + '</div>'
          + '<div class="ig-foot">Source: Odoo and the Denri dashboard pages. Full detail in the weekly report.</div>';
        document.body.appendChild(box);
        var imgs = [].slice.call(box.querySelectorAll('img'));
        return Promise.all(imgs.map(function (im) { return im.decode ? im.decode().catch(function () {}) : null; }))
          .then(function () { return html2canvas(box, { scale: 1.5, backgroundColor: '#e9eef5', logging: false, onclone: capMode, windowWidth: 1200 }); })
          .then(function (c) {
            igBtn.textContent = 'Saving…';
            return new Promise(function (ok) { c.toBlob(function (b) {
              var a = document.createElement('a'); a.href = URL.createObjectURL(b);
              a.download = ('Weekly ' + (d === 'sales' ? 'Sales' : 'Marketing') + ' Infographic ' + (WR.weekLabel || '')).replace(/[^\w ]+/g, '').trim() + '.png';
              document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); ok(); }, 1500);
            }, 'image/png'); });
          });
      });
    }).catch(function (e) { alert('Could not build the infographic: ' + (e && e.message || e)); })
      .then(function () { if (box) box.remove(); document.documentElement.classList.remove('cap'); igBtn.disabled = false; igBtn.textContent = label; });
  });
})();
</script>
</body>
</html>

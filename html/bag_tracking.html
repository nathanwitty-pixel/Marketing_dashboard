<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n || 0).toLocaleString(); };
  var kes = function (n) { return n ? 'KES ' + fmt(Math.round(n)) : '—'; };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  var B = BT.bags || [];
  var sum = function (rows, k) { return rows.reduce(function (t, r) { return t + (r[k] || 0); }, 0); };
  var since = BT.startLabel || BT.start;

  $('sub').innerHTML = 'The chosen bags, tracked from <b>' + esc(since) + '</b>. Kenya shop stock (all colours), Odoo stock moves since the start. '
    + 'Updated <b>' + esc(BT.built || '') + '</b>.';
  $('hint').innerHTML = '<b>Stock was</b> = Kenya shop stock at the start (worked back from Odoo once, then frozen). <b>Sold</b> = till sales since (customer returns taken off), '
    + '<b>Received</b> = restocks into the shops, <b>Sent out</b> = moved out of the shops. <b>Sell-through</b> = sold ÷ (stock was + received). Click a bag for its colours.';

  var W = sum(B, 'was'), N = sum(B, 'now'), S = sum(B, 'sold'), R = sum(B, 'received');
  var val = B.reduce(function (t, r) { return t + r.sold * (r.priceNow || 0); }, 0);
  var card = function (c, l, v, s) { return '<div class="card" style="--c:' + c + '"><div class="k-lbl">' + l + '</div><div class="k-val">' + v + '</div><div class="k-sub">' + s + '</div></div>'; };
  $('kpis').innerHTML = card('#6366f1', 'Bags tracked', B.length, 'bag types, every colour')
    + card('#94a3b8', 'Stock was', fmt(W), esc(since))
    + card('#38bdf8', 'Stock now', fmt(N), (N - W >= 0 ? '+' : '') + fmt(N - W) + ' since the start')
    + card('#10b981', 'Sold since the start', fmt(S), kes(val) + ' at today\'s prices')
    + card('#f59e0b', 'Received', fmt(R), 'restocked into the shops');

  var cats = {}; B.forEach(function (b) { if (b.category) cats[b.category] = 1; });
  $('f-cat').innerHTML += Object.keys(cats).sort().map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');

  var rows = B.map(function (b) {
    var base = b.was + b.received;
    return { b: b, change: b.now - b.was, st: base > 0 ? b.sold / base * 100 : null,
             disc: b.priceWas && b.priceNow && b.priceWas > b.priceNow ? Math.round((b.priceWas - b.priceNow) / b.priceWas * 100) : null,
             value: b.sold * (b.priceNow || 0) };
  });
  var COLS = [['bag', 'Bag', 0], ['category', 'Category', 0], ['was', 'Stock was', 1], ['now', 'Stock now', 1], ['change', 'Change', 1],
              ['sold', 'Sold', 1], ['received', 'Received', 1], ['sentOut', 'Sent out', 1], ['st', 'Sell-through', 1],
              ['priceWas', 'Price was', 1], ['priceNow', 'Price now', 1], ['disc', 'Discount', 1], ['value', 'Sold value', 1]];
  var TXT = { bag: 1, category: 1 };
  var sortK = null, sortD = -1, open = {}, cur = [];
  var get = function (r, k) { return k in r.b ? r.b[k] : r[k]; };

  function draw() {
    var q = $('q').value.trim().toUpperCase(), fc = $('f-cat').value, fm = $('f-mv').value;
    var list = rows.filter(function (r) {
      return (!q || r.b.bag.indexOf(q) >= 0) && (!fc || r.b.category === fc)
        && (!fm || (fm === 'sold' ? r.b.sold > 0 : fm === 'none' ? r.b.sold <= 0 : r.b.received > 0));
    });
    if (sortK) list.sort(function (a, c) {
      var x = get(a, sortK), y = get(c, sortK);
      if (x == null) x = TXT[sortK] ? '' : -Infinity; if (y == null) y = TXT[sortK] ? '' : -Infinity;
      return (x < y ? -1 : x > y ? 1 : 0) * sortD; });
    else list.sort(function (a, c) { return c.b.sold - a.b.sold || c.b.now - a.b.now; });
    cur = list;
    $('shown').textContent = list.length === rows.length ? '' : 'Showing ' + list.length + ' of ' + rows.length;
    $('tbl').querySelector('thead').innerHTML = '<tr>' + COLS.map(function (c) {
      return '<th data-k="' + c[0] + '"' + (c[2] ? ' class="r"' : '') + ' title="Sort">' + c[1]
        + (sortK === c[0] ? ' <span style="color:#a5b4fc">' + (sortD < 0 ? '▼' : '▲') + '</span>' : '') + '</th>'; }).join('') + '</tr>';
    $('tbl').querySelector('tbody').innerHTML = list.map(function (r) {
      var b = r.b, ch = r.change;
      var tr = '<tr class="row" data-bag="' + esc(b.bag) + '"><td><b style="color:#f1f5f9">' + (open[b.bag] ? '▾ ' : '▸ ') + esc(b.bag) + '</b></td>'
        + '<td class="muted">' + esc(b.category || '—') + '</td>'
        + '<td class="r">' + fmt(b.was) + '</td><td class="r"><b style="color:#a5f3fc">' + fmt(b.now) + '</b></td>'
        + '<td class="r ' + (ch > 0 ? 'up' : ch < 0 ? 'dn' : 'muted') + '">' + (ch > 0 ? '+' : '') + fmt(ch) + '</td>'
        + '<td class="r"><b style="color:#6ee7b7">' + fmt(b.sold) + '</b></td><td class="r">' + fmt(b.received) + '</td><td class="r">' + fmt(b.sentOut) + '</td>'
        + '<td class="r">' + (r.st == null ? '—' : r.st.toFixed(1) + '%') + '</td>'
        + '<td class="r">' + (b.priceWas && b.priceWas !== b.priceNow ? '<span class="strike">' + kes(b.priceWas) + '</span>' : kes(b.priceWas)) + '</td>'
        + '<td class="r"><b style="color:#e2e8f0">' + kes(b.priceNow) + '</b></td>'
        + '<td class="r">' + (r.disc == null ? '—' : r.disc + '%') + '</td><td class="r">' + kes(r.value) + '</td></tr>';
      if (open[b.bag]) tr += '<tr class="cols"><td colspan="' + COLS.length + '">' + (b.colours.length ? b.colours.map(function (c) {
          return '<span class="chip"><b>' + esc(c.colour) + '</b> ' + fmt(c.was) + ' → ' + fmt(c.now) + (c.sold ? ', sold ' + fmt(c.sold) : '')
            + (c.received ? ', received ' + fmt(c.received) : '') + '</span>'; }).join('') : '<span class="muted">No Odoo stock for this bag in the Kenya shops.</span>') + '</td></tr>';
      return tr;
    }).join('');
    var t = function (k) { return sum(list.map(function (r) { return r.b; }), k); };
    var tv = list.reduce(function (s, r) { return s + r.value; }, 0), tb = t('was') + t('received');
    $('tbl').querySelector('tfoot').innerHTML = '<tr><td>Total</td><td></td><td class="r">' + fmt(t('was')) + '</td><td class="r">' + fmt(t('now')) + '</td>'
      + '<td class="r">' + (t('now') - t('was') > 0 ? '+' : '') + fmt(t('now') - t('was')) + '</td><td class="r">' + fmt(t('sold')) + '</td><td class="r">' + fmt(t('received')) + '</td>'
      + '<td class="r">' + fmt(t('sentOut')) + '</td><td class="r">' + (tb ? (t('sold') / tb * 100).toFixed(1) + '%' : '—') + '</td><td></td><td></td><td></td><td class="r">' + kes(tv) + '</td></tr>';
  }

  $('tbl').querySelector('thead').addEventListener('click', function (e) {   // a heading: sort; again: flip; third: default
    var h = e.target.closest('th[data-k]'); if (!h) return; var k = h.getAttribute('data-k'), first = TXT[k] ? 1 : -1;
    if (sortK !== k) { sortK = k; sortD = first; } else if (sortD === first) sortD = -sortD; else sortK = null;
    draw(); });
  $('tbl').querySelector('tbody').addEventListener('click', function (e) {
    var tr = e.target.closest('tr.row'); if (!tr) return; var k = tr.getAttribute('data-bag'); open[k] = !open[k]; draw(); });
  ['f-cat', 'f-mv'].forEach(function (id) { $(id).addEventListener('change', draw); });
  $('q').addEventListener('input', draw);
  $('reset').addEventListener('click', function () { $('q').value = $('f-cat').value = $('f-mv').value = ''; sortK = null; draw(); });

  var fold = $('fold'), body = $('body');
  function setFold(shut) { body.style.display = shut ? 'none' : ''; fold.textContent = shut ? 'Expand ▾' : 'Collapse ▴'; }
  try { setFold(localStorage.getItem('bt-fold') === '1'); } catch (e) {}
  fold.addEventListener('click', function () { var shut = body.style.display !== 'none'; setFold(shut);
    try { localStorage.setItem('bt-fold', shut ? '1' : '0'); } catch (e) {} });

  $('csv').addEventListener('click', function () {                          // the bags that pass the filters, on-screen order
    var q = function (v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var out = [['Bag', 'Category', 'Stock was (' + since + ')', 'Stock now', 'Change', 'Sold', 'Received', 'Sent out', 'Sell-through %',
                'Price was', 'Price now', 'Discount %', 'Sold value', 'Colours (was > now)']];
    cur.forEach(function (r) { var b = r.b;
      out.push([b.bag, b.category, b.was, b.now, r.change, b.sold, b.received, b.sentOut, r.st == null ? '' : r.st.toFixed(1),
                b.priceWas || '', b.priceNow || '', r.disc == null ? '' : r.disc, Math.round(r.value),
                b.colours.map(function (c) { return c.colour + ' ' + c.was + '>' + c.now; }).join('; ')]); });
    var blob = new Blob(['﻿' + out.map(function (row) { return row.map(q).join(','); }).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'bag_tracking_' + (BT.built || '').slice(0, 10) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  if (!B.length) { $('body').innerHTML = '<div class="hint">No data yet: run generators/bag_tracking.py.</div>'; return; }
  draw();
})();
</script>
</body>
</html>

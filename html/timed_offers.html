<!DOCTYPE html>
<html lang="en">
<head>
<meta name="darkreader-lock" /><!-- the dashboard has its own light/dark theme: stop the Dark Reader extension re-darkening it -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timed Offer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { overflow-y: scroll; }
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: #0f1117; }
    ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 6px; border: 3px solid #0f1117; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f1117; color: #e2e8f0;
           min-height: 100vh; padding: 2rem; }
    .wrap { width: 100%; max-width: 960px; margin: 0 auto; }
    .head { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
    .pill { color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
            padding: 0.3rem 0.75rem; border-radius: 999px; background: #f59e0b; }
    .head h1 { font-size: 1.5rem; font-weight: 800; color: #f8fafc; letter-spacing: 0.01em; }
    .sub { font-size: 0.82rem; color: #64748b; margin-bottom: 1.6rem; line-height: 1.5; }
    .sub b { color: #94a3b8; }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.6rem; }
    .card { background: #1e2130; border: 1px solid #2d3148; border-radius: 10px; padding: 1.2rem 1.4rem;
            position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
                    background: #f59e0b; }
    .card.g::before { background: #10b981; }
    .card.c::before { background: #06b6d4; }
    .card.v::before { background: #8b5cf6; }
    .k-lbl { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.5rem; }
    .k-val { font-size: 2rem; font-weight: 800; color: #f8fafc; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .k-val.green { color: #34d399; } .k-val.cyan { color: #22d3ee; } .k-val.violet { color: #a78bfa; }
    .k-sub { font-size: 0.76rem; color: #64748b; margin-top: 0.35rem; line-height: 1.4; }

    .panel { background: #1e2130; border: 1px solid #2d3148; border-radius: 10px; padding: 1.3rem 1.4rem; margin-bottom: 1.6rem; }
    .panel h2 { font-size: 0.95rem; font-weight: 700; color: #f1f5f9; margin-bottom: 0.2rem; }
    .panel .cap { font-size: 0.76rem; color: #64748b; margin-bottom: 1rem; }
    .chart-wrap { position: relative; height: 320px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
    thead th { text-align: left; padding: 0.6rem 0.75rem; font-size: 0.68rem; font-weight: 700;
               letter-spacing: 0.08em; text-transform: uppercase; color: #64748b; border-bottom: 1px solid #2d3148; }
    thead th.r, tbody td.r { text-align: right; }
    tbody td { padding: 0.6rem 0.75rem; border-top: 1px solid #262a3d; color: #cbd5e1; }
    tbody tr:hover { background: #252840; }
    tbody td.name { color: #f1f5f9; font-weight: 600; }
    .zero { color: #f87171; font-weight: 700; }
    /* "Why these bags?" — scrollable body (~first 10 rows) with the TOTAL pinned on top,
       the column header pinned just below it. */
    .why-scroll { max-height: 26rem; overflow: auto; border: 1px solid #262a3d; border-radius: 8px; }
    .why-scroll table { border-collapse: separate; border-spacing: 0; }
    .why-scroll thead tr.tot td { position: sticky; top: 0; z-index: 3; background: #14161f;
        padding: 0.55rem 0.75rem; line-height: 1.2; font-weight: 800; color: #f1f5f9;
        text-transform: none; letter-spacing: normal; font-size: 0.86rem; border-bottom: 1px solid #2d3148; }
    .why-scroll thead tr.tot td.r { text-align: right; }
    .why-scroll thead tr.hdr th { position: sticky; top: 2.25rem; z-index: 2; background: #12131c; }
    .why-scroll tbody td { border-top: 1px solid #262a3d; }
    .note { font-size: 0.78rem; color: #94a3b8; line-height: 1.55; }
    .note b { color: #cbd5e1; }
    /* Offers compared / Best bags / Next offer check (docs/timed-offers.md › Offers compared) */
    .cmp-scroll { overflow-x: auto; }
    .cmp-sub { font-size: 0.7rem; color: #64748b; font-weight: 400; margin-top: 0.15rem; }
    .cmp-win { font-size: 0.66rem; color: #64748b; font-weight: 600; text-transform: none; letter-spacing: 0; margin-top: 0.15rem; }
    .cmp-table td.best { color: #34d399; font-weight: 800; }
    .cmp-star { color: #fbbf24; font-size: 0.8rem; }
    .cmp-table .up { color: #34d399; } .cmp-table .down { color: #f87171; }
    .cmp-table tr.cmp-tot td { font-weight: 800; color: #f1f5f9; border-top: 2px solid #2d3148; }
    .cmp-two { display: grid; grid-template-columns: 1fr; gap: 1.2rem; }
    .cmp-h { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 0.3rem; }
    .cmp-ctl { display: flex; align-items: center; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 0.7rem; }
    .cmp-flbl { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: #64748b; margin-right: 0.2rem; }
    .cmp-chips { display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .cmp-chip { background: #161824; border: 1px solid #2d3148; color: #94a3b8; font: inherit; font-size: 0.74rem; font-weight: 600;
                padding: 0.25rem 0.6rem; border-radius: 999px; cursor: pointer; }
    .cmp-chip.on { background: rgba(16,185,129,0.16); border-color: #10b981; color: #6ee7b7; }
    .cmp-ctl input { width: 4.5rem; background: #161824; border: 1px solid #2d3148; color: #e2e8f0; padding: 0.3rem 0.5rem; border-radius: 6px; font: inherit; font-size: 0.8rem; }
    .cmp-verdict { font-size: 0.84rem; color: #cbd5e1; line-height: 1.55; padding: 0.7rem 0.9rem; border-radius: 8px; border: 1px solid #2d3148; margin-bottom: 0.8rem; }
    .cmp-verdict.ok { border-color: #10b981; } .cmp-verdict.mid { border-color: #f59e0b; } .cmp-verdict.weak { border-color: #ef4444; }
    .cmp-verdict.ok b:first-child { color: #34d399; } .cmp-verdict.mid b:first-child { color: #fbbf24; } .cmp-verdict.weak b:first-child { color: #f87171; }
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{ transition-duration:.12s!important; transition-property:opacity!important;
        animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; }
    }
  
    /* Spectral Edge — aura backdrop (decorative; fixed, behind all content). */
    body{ background-color:#100e0b; }
    .aura-layer-1,.aura-layer-2,.aura-layer-3{ position:fixed; inset:0; z-index:-1;
      pointer-events:none; transform:translateZ(0); will-change:transform; }
    .aura-layer-1{ mix-blend-mode:screen; filter:blur(108px);
      background:linear-gradient(90deg, transparent 0%, rgba(59,130,246,0.04) 32%, rgba(6,182,212,0.12) 45%, rgba(34,197,94,0.13) 51%, rgba(250,204,21,0.12) 57%, rgba(244,63,94,0.11) 64%, transparent 82%); }
    .aura-layer-2{ mix-blend-mode:screen; filter:blur(58px); opacity:0.24;
      background:linear-gradient(102deg, transparent 38%, rgba(255,255,255,0.08) 46%, rgba(125,211,252,0.06) 51%, transparent 60%); }
    .aura-layer-3{ mix-blend-mode:screen; filter:blur(126px); opacity:0.55;
      background:radial-gradient(ellipse 25% 65% at 92% 50%, rgba(139,92,246,0.16) 0%, transparent 78%); }
    @media (max-width:640px){
      .aura-layer-1{ filter:blur(75px); } .aura-layer-2{ filter:blur(40px); } .aura-layer-3{ filter:blur(88px); }
    }

    /* Frosted-glass card surfaces — the aura shows through (matches the Offer-Type look). */
    .card, .panel, .kpi, .sec, .exec, .mini{
      background-color: rgba(24,27,40,0.52) !important;
      background-image: none !important;
      backdrop-filter: blur(14px) saturate(1.08);
      -webkit-backdrop-filter: blur(14px) saturate(1.08);
    }
    @media (prefers-reduced-transparency: reduce){
      .card, .panel, .kpi, .sec, .exec, .mini{
        background-color:#141824 !important; backdrop-filter:none; -webkit-backdrop-filter:none; }
    }
</style>

  <div class="wrap">
    <div class="head">
      <span class="pill">Timed Offers</span>

  <!-- One offer's card stack — cloned per offer in TO_LIST. Data hooks use

      </div>

      <div class="grid" data-el="kpis"></div>

      <div class="panel" data-el="why-panel" style="display:none">
        <h2>Why these bags — and was it a good move?</h2>
        <div class="cap"><b>Price was</b> = the product's Odoo Sales Price incl. tax; <b>Price now</b> = the offer pricelist price incl. tax — both pulled live from Odoo (not typed, not an average). <b>Discount</b> = the real cut. <b>Sales lift</b> = the bag's own units/day during vs before the offer.</div>
        <div data-el="why-filter" style="display:none"></div>
        <div class="to-ctl" style="display:flex;justify-content:flex-end;align-items:center;gap:0.5rem;margin:0.2rem 0 0.6rem;padding:0.2rem 0.4rem">
          <label style="font-size:0.72rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Sort</label>
          <select data-el="why-sort" style="background:#161824;color:#e2e8f0;border:1px solid #2d3148;border-radius:6px;padding:0.3rem 0.5rem;font-size:0.8rem">
            <option value="sold-desc">Sold — largest to smallest</option>
            <option value="sold-asc">Sold — smallest to largest</option>
            <option value="stock-desc">In stock — largest to smallest</option>
            <option value="stock-asc">In stock — smallest to largest</option>
            <option value="disc-desc">Discount — largest to smallest</option>
          </select>
        </div>
        <div class="why-scroll">
          <table>
            <thead>
              <tr class="tot" data-el="why-total-row"></tr>
              <tr class="hdr" data-el="why-head-row">
                <th>Bag</th><th class="r">Sold</th><th class="r">In stock</th>
                <th class="r">Price was</th><th class="r">Price now</th><th class="r">Discount</th><th class="r">Sales lift</th><th>Category</th>
              </tr>
            </thead>
            <tbody data-el="why-tbody"></tbody>
          </table>
        </div>
        <div data-el="why-insights" style="margin-top:1rem"></div>
        <div data-el="why-verdict" style="margin-top:0.9rem;padding:0.9rem 1rem;background:rgba(245,158,11,0.08);border:1px solid rgba(245,158,11,0.28);border-radius:10px;font-size:0.9rem;color:#e2e8f0;line-height:1.55"></div>
      </div>

      <div class="panel" data-el="clearance-panel" style="display:none">
        <h2>Clearance rate — how much of each is cleared</h2>
        <div class="cap"><b>% cleared</b> = units sold &divide; (sold + stock on hand). A bag near 100% is nearly gone; a low % means lots of stock is still sitting. Switch between <b>bag type</b> (all colours together, e.g. every Prime colour as one) and <b>category</b>.</div>
        <div class="to-ctl" style="display:flex;justify-content:flex-end;align-items:center;gap:0.5rem;margin:0.2rem 0 0.6rem;padding:0.2rem 0.4rem">
          <label style="font-size:0.72rem;color:#94a3b8;font-weight:700;text-transform:uppercase;letter-spacing:0.04em">Group by</label>
          <select data-el="clearance-mode" style="background:#161824;color:#e2e8f0;border:1px solid #2d3148;border-radius:6px;padding:0.3rem 0.5rem;font-size:0.8rem">
            <option value="product">Bag type (all colours)</option>
            <option value="category">Category</option>
          </select>
        </div>
        <div class="chart-wrap" data-el="clearance-wrap"><canvas data-el="clearance-chart"></canvas></div>
      </div>

      <div class="panel">
        <h2>Bags sold per bag</h2>
        <div class="cap" data-el="chart-cap">Kenya POS · offer window</div>
        <div class="chart-wrap"><canvas data-el="chart"></canvas></div>
      </div>

      <div class="panel">
        <div class="note" data-el="note"></div>
      </div>
    </section>
  </template>

<script>
/* Reusable table filter bar (Colour / Category / Product / Bag Type, or any dims).
   DenriTableFilter.attach({bar, rows, dims, onChange}) renders the bar into `bar`, filters
   `rows`, and calls onChange(filtered) on every change / reset. A dimension whose rows carry
   no values is skipped. Matches the New Products filter look; drop-in on any page/table. */
(function(){
  if (window.DenriTableFilter) return;
  if (!document.getElementById('dtf-css')) {
    var st = document.createElement('style'); st.id = 'dtf-css';
    st.textContent =
      '.dtf-bar{display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;padding:0.6rem 0.9rem;'
      + 'background:#13151f;border:1px solid #2d3148;border-radius:8px;margin:0.3rem 0 0.6rem}'
      + '.dtf-bar label{font-size:0.66rem;color:#64748b;font-weight:700;text-transform:uppercase;letter-spacing:0.07em}'
      + '.dtf-bar select{background:#1e2130;border:1px solid #2d3148;color:#e2e8f0;padding:0.3rem 0.6rem;'
      + 'border-radius:6px;font-size:0.78rem;cursor:pointer;outline:none}'
      + '.dtf-bar select:focus{border-color:#10b981}'
      + '.dtf-bar .dtf-reset{margin-left:auto;background:none;border:1px solid #374151;color:#94a3b8;'
      + 'padding:0.3rem 0.65rem;border-radius:6px;font-size:0.74rem;cursor:pointer}'
      + '.dtf-bar .dtf-reset:hover{border-color:#6b7280;color:#e2e8f0}';
    document.head.appendChild(st);
  }
  function uniq(rows, key){
    var seen={}, out=[];
    rows.forEach(function(r){ var v=(r[key]==null?'':String(r[key])); if(v && !seen[v]){seen[v]=1;out.push(v);} });
    return out.sort();
  }
  window.DenriTableFilter = { attach: function(opts){
    var bar = opts.bar, rows = opts.rows||[], dims = opts.dims||[], onChange = opts.onChange||function(){};
    bar.classList.add('dtf-bar'); bar.innerHTML=''; var sels = {};
    dims.forEach(function(d){
      var vals = uniq(rows, d.key); if (!vals.length) return;   // no data for this dimension
      var lab = document.createElement('label'); lab.textContent = d.label; bar.appendChild(lab);
      var s = document.createElement('select');
      s.innerHTML = '<option value="">'+ (d.all || ('All '+d.label)) +'</option>';
      vals.forEach(function(v){ var o=document.createElement('option'); o.value=v; o.textContent=v; s.appendChild(o); });
      bar.appendChild(s); sels[d.key]=s; s.addEventListener('change', apply);
    });
    var reset = document.createElement('button'); reset.className='dtf-reset'; reset.textContent='Reset Filters';
    reset.addEventListener('click', function(){ Object.keys(sels).forEach(function(k){ sels[k].value=''; }); apply(); });
    bar.appendChild(reset);
    function getFiltered(){
      return rows.filter(function(r){
        return Object.keys(sels).every(function(k){ var v=sels[k].value; return !v || String(r[k]==null?'':r[k])===v; });
      });
    }
    function apply(){ onChange(getFiltered()); }
    apply();
    return { getFiltered: getFiltered, apply: apply };
  }};
})();
</script>

<script>
(function(){
  var fmt = function(n){ return Number(n||0).toLocaleString(); };

  function renderOffer(TO, root){
    var set = function(sel, txt){ var el = root.querySelector('[data-el="'+sel+'"]'); if (el) el.textContent = txt; };



    set('title', TO.name || 'Timed Offer');
    var sub = root.querySelector('[data-el="sub"]');
    if (sub) sub.innerHTML = '<b>' + (TO.windowLabel || '') + '</b> · ' + TO.bags.length + ' bags · <b>'
      + (TO.scopeLabel || TO.market || 'Kenya') + '</b> · sales <b>live from Odoo POS</b> for the exact window · '
      + 'posting = <b>last week (Kenya)</b>'
      + (TO.salesLive ? '' : ' · <span style="color:#f87171">DB unreachable — sales showing 0</span>');
    var cap = root.querySelector('[data-el="chart-cap"]');
    if (cap) cap.textContent = 'Kenya POS · ' + (TO.windowLabel || 'offer window');

    // ── KPI cards ──
    var perPost = TO.perPost != null ? TO.perPost.toFixed(1) : '—';
    // Revenue actually taken on the bags sold (realised incl-tax) — for the reject clearance this
    // comes from the per-variant rows; shown as a hover on the Bags Sold figure.
    var _rev = (TO.why && (TO.why.variants || []).length)
      ? (TO.why.variants || []).reduce(function (a, v) { return a + (v.rev || 0); }, 0) : null;
    var _revTip = (_rev != null)
      ? ('Revenue from these ' + fmt(TO.totalSold) + ' bags sold: KES ' + fmt(_rev)
         + ' (actual realised, incl. tax).').replace(/"/g, '&quot;') : '';
    var kpis = [
      ['g', 'Bags Sold',       'green',  fmt(TO.totalSold),  'across ' + TO.bags.length + ' bags, ' + (TO.shops && TO.shops.length ? 'Nairobi CBD' : (TO.market||'Kenya')) + (_rev != null ? ' · hover for revenue' : ''), _revTip],
      ['c', 'Marketing Posts', 'cyan',   fmt(TO.totalPosts), 'last week, Kenya side'],
      ['v', 'Bags per Post',   'violet', perPost,            'sales ÷ posts'],
      ['',  'Top Seller',      '',       TO.bestName || '—', fmt(TO.bestSold) + ' bags sold']
    ];
    var kg = root.querySelector('[data-el="kpis"]');
    if (kg) kg.innerHTML = kpis.map(function(k){
      return '<div class="card ' + k[0] + '"' + (k[5] ? ' title="' + k[5] + '" style="cursor:help"' : '') + '><div class="k-lbl">' + k[1] + '</div>'
           + '<div class="k-val ' + k[2] + '">' + k[3] + '</div>'
           + '<div class="k-sub">' + k[4] + '</div></div>';
    }).join('');

    // ── Lift: did the offer improve sales? (before vs during) ──
    var L = TO.lift;
    if (L && L.basePerDay != null) {
      var panel = root.querySelector('[data-el="lift-panel"]');
      if (panel) panel.style.display = '';
      var up = (L.liftPct || 0) >= 0;
      var _clr = L.clearanceStart, _cmp = L.cmpNormal;
      set('lift-cap', _cmp
        ? ('Normal (full-price) sales of these bag types at ' + (TO.market || 'Kenya') + ' vs the reject clearance, '
           + L.winStart + ' → ' + L.winEnd + ' (' + L.winDays + ' days), per day — how the clearance moved rejects compared with normal selling of the same bags.')
        : (_clr
          ? ('The clearance started ' + _clr + '. Comparing the days before it this month ('
             + L.baseStart + ' → ' + L.baseEnd + ', ' + L.baseDays + ' days) against the '
             + L.offerDays + ' clearance days (' + _clr + ' → offer end), per day.')
          : ('Same bags, ' + (TO.market || 'Kenya') + ' · offer window (' + L.offerDays + ' days) vs the '
             + L.baseDays + ' pre-offer days this month (' + L.baseStart + ' → ' + L.baseEnd + '), per day.')));
      var lk = _cmp
        ? [
            ['', 'Clearance vs Normal', '', (L.normalPerDay > 0 ? Math.round(L.clearancePerDay / L.normalPerDay * 100) + '%' : '—'), 'clearance ÷ normal, per day'],
            ['c', 'Normal / day', 'cyan',  (L.normalPerDay).toFixed(1),  fmt(L.normalTotal) + ' full-price over ' + L.winDays + ' days'],
            ['g', 'Clearance / day', 'green', (L.clearancePerDay).toFixed(1), fmt(L.clearanceTotal) + ' rejects over ' + L.winDays + ' days']
          ]
        : [
            ['', 'Sales Lift', (up ? 'green' : ''), (L.liftPct != null ? (up ? '+' : '') + L.liftPct + '%' : 'n/a'),
              _clr ? 'clearance vs before, per day' : 'offer vs pre-offer, per day'],
            ['c', _clr ? 'Before clearance / day' : 'Before (per day)', 'cyan',  (L.basePerDay).toFixed(1),  L.baseTotal + ' over ' + L.baseDays + ' days'],
            ['g', _clr ? 'During clearance / day' : 'During (per day)', 'green', (L.offerPerDay).toFixed(1), L.offerTotal + ' over ' + L.offerDays + ' days']
          ];
      // Bulk / corporate orders in either window → also show the lift without them.
      if (!_cmp && L.liftPctExBulk !== undefined) {
        var _xu = (L.liftPctExBulk || 0) >= 0;
        lk.push(['', 'Without corporate orders', (_xu ? 'green' : ''),
          (L.liftPctExBulk != null ? (_xu ? '+' : '') + L.liftPctExBulk + '%' : 'n/a'),

    // ── Why these bags? (stock · price · season · discount check) ──
    var W = TO.why;
    if (W && (W.bags || []).length) {

      var wtb = root.querySelector('[data-el="why-tbody"]');
      if (wtb) {

        var _sortSel = root.querySelector('[data-el="why-sort"]');
        // Per-variant rows (reject clearance) → filterable by Colour / Category / Product / Bag Type.

            var sorted = list.slice().sort(function (a, b) { var d = key(a) - key(b); return asc ? d : -d; });
            wtb.innerHTML = sorted.map(_vRow).join('') || '<tr><td colspan="9" style="color:#64748b;padding:0.8rem">No rows match these filters.</td></tr>';
            // Totals recompute over the (filtered) list.

            var _exUp = (b.bagLiftExBulk || 0) >= 0;

        };

        var totTip = ('Totals — ' + fmt(tSold) + ' sold · ' + fmt(tStock) + ' still in stock · '

        // TOTAL row lives in the (sticky) thead so it stays pinned on top while the body scrolls.

    if (CV.length) {

                      y: { ticks: { color: '#cbd5e1', font: { size: 11 } }, grid: { display: false } } },

            meta.data.forEach(function (bar, i) {

           + '<td class="r">' + fmt(b.sold) + '</td>'
           + '<td class="r">' + postsCell + '</td>'
           + '<td class="r">' + pp + '</td></tr>';
    }).join('') + '<tr style="border-top:2px solid #2d3148"><td class="name">Total</td>'
      + '<td class="r" style="font-weight:800;color:#f8fafc">' + fmt(TO.totalSold) + '</td>'
      + '<td class="r" style="font-weight:800;color:#f8fafc">' + fmt(TO.totalPosts) + '</td>'
      + '<td class="r">' + perPost + '</td></tr>';

    // ── Note ──
    var zeros = TO.bags.filter(function(b){ return b.posts === 0 && b.sold > 0; }).map(function(b){ return b.name; });
    var note = root.querySelector('[data-el="note"]');
    if (note) {
      var msg = '<b>Reading it:</b> ' + fmt(TO.totalSold) + ' bags moved on ' + fmt(TO.totalPosts)
        + ' Kenya posts (' + perPost + ' bags per post). ';
      if (zeros.length) msg += '<b>' + zeros.join(' and ') + '</b> sold with <b>0 recorded posts</b> — moving without marketing. ';
      msg += 'Sales are the exact ' + (TO.windowLabel || 'window') + ' from Odoo (Sinza/Uganda tills excluded, combos/delivery/samples filtered). '
        + 'Posting is the last week’s Kenya figure from the marketing sheet — the closest available, since posts aren’t stored per day.';
      note.innerHTML = msg;
    }

    // ── Chart: bags sold per bag (single series, direct labels) ──
    var el = root.querySelector('[data-el="chart"]');
    if (el && typeof Chart !== 'undefined' && TO.bags.length) {
      var rows = TO.bags.slice();   // already sorted by sold desc
      var VAL = { id:'v', afterDatasetsDraw:function(ch){
        var c = ch.ctx, m = ch.getDatasetMeta(0); c.save();
        c.font='700 0.66rem "Segoe UI", system-ui, sans-serif'; c.fillStyle='#f8fafc';
        c.textAlign='left'; c.textBaseline='middle';
        m.data.forEach(function(bar,i){ var v = rows[i].sold; if (v==null) return;
          c.fillText(fmt(v), bar.x + 6, bar.y); });
        c.restore();
      }};
      new Chart(el, { type:'bar', plugins:[VAL],
        data:{ labels: rows.map(function(r){ return r.name; }),
          datasets:[{ label:'Bags sold', data: rows.map(function(r){ return r.sold; }),
            backgroundColor:'#10b981', borderRadius:4, maxBarThickness:34 }] },
        options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
          layout:{ padding:{ right: 42 } },
          interaction:{ mode:'index', axis:'y', intersect:false },
          plugins:{ legend:{ display:false },
            tooltip:{ backgroundColor:'#1e2130', borderColor:'#2d3148', borderWidth:1,
              titleColor:'#f8fafc', bodyColor:'#94a3b8', padding:10, cornerRadius:6,
              callbacks:{ label:function(c){ var r = rows[c.dataIndex];
                return [ fmt(r.sold) + ' bags sold',
                         (r.posts>0 ? r.posts + ' posts · ' + (r.perPost!=null?r.perPost.toFixed(1):'—') + ' sold/post'
                                    : '0 posts — sold without marketing') ]; } } } },
          scales:{ x:{ beginAtZero:true, grid:{ color:'rgba(45,49,72,0.55)' }, ticks:{ color:'#94a3b8' } },
                   y:{ grid:{ display:false }, ticks:{ color:'#cbd5e1', font:{ size:12 } } } } } });
    }

  }

  // ── Driver: stack every offer in the month ──
  var LIST = (typeof TO_LIST !== 'undefined' && TO_LIST) ? TO_LIST
           : ((typeof TO !== 'undefined' && TO) ? [TO] : []);
  var month = (typeof TO_DATA !== 'undefined' && TO_DATA && TO_DATA.month) ? TO_DATA.month : '';
  var monthLbl = '';
  if (month) { var dp = new Date(month + '-01T00:00:00');
    if (!isNaN(dp)) monthLbl = dp.toLocaleDateString(undefined, {month:'long', year:'numeric'}); }
  var pt = document.getElementById('page-title');
  if (pt) pt.textContent = 'Timed Offers' + (monthLbl ? ' \u2014 ' + monthLbl : '');
  var ps = document.getElementById('page-sub');
  if (ps) ps.innerHTML = LIST.length
    ? '<b>' + LIST.length + '</b> offer' + (LIST.length > 1 ? 's' : '') + ' this month, compared first, then each one below. Sales <b>live from Odoo POS</b> for each exact window.'
    : '';
  var cont = document.getElementById('to-offers');
  var tpl  = document.getElementById('to-offer-tpl');
  if (!LIST.length) {
    var emp = document.getElementById('to-empty'); if (emp) emp.style.display = '';
  } else if (cont && tpl) {
    LIST.forEach(function(offer){
      if (!offer) return;
      var node = tpl.content.firstElementChild.cloneNode(true);
      cont.appendChild(node);
      renderOffer(offer, node);
    });
  }
})();
</script>

<script>
/* Offers compared, Best bags and Next offer check (docs/timed-offers.md › Offers compared). Reads TO_DATA.compare. */
(function(){
  var C = (typeof TO_DATA !== 'undefined' && TO_DATA) ? TO_DATA.compare : null;
  var box = document.getElementById('to-compare');
  if (!C || !box || !C.offers || !C.offers.length) return;
  var R = C.rules || {}, F = C.fit || {};
  var n = function(v){ return v == null ? '—' : Number(v).toLocaleString(); };
  var kes = function(v){ return v == null ? '—' : 'KES ' + Math.round(v).toLocaleString(); };
  var pct = function(v, sign){ return v == null ? '—' : (sign && v > 0 ? '+' : '') + v + '%'; };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var cls = function(v){ return v == null ? '' : v > 0 ? 'up' : v < 0 ? 'down' : ''; };
  // "9–10 Oct · Up to KES 1,400 Off (Kenya)" → "Up to KES 1,400 Off"
  var short = function(o){ var s = String(o.name || ''); var p = s.split(/\s+·\s+/); s = p.length > 1 ? p.slice(1).join(' ') : s;
                           return s.replace(/\s*\((Kenya|CBD)\)\s*$/i, ''); };

  // ── Offers compared ──
  var O = C.offers;
  var signed = function(v, f){ return '<span class="' + cls(v) + '">' + (v > 0 ? '+' : '') + f(v) + '</span>'; };
  var rows = [
    { l: 'Days run', g: function(o){ return o.days; }, f: n },
    { l: 'Bags on offer', g: function(o){ return o.bags; }, f: n },
    { l: 'Units sold', g: function(o){ return o.units; }, f: n, best: 'high', s: function(o){ return n(o.unitsWalkIn) + ' walk-in'; } },
    { l: 'Units a day', g: function(o){ return o.perDay; }, f: n, best: 'high', s: function(o){ return n(o.basePerDay) + ' a day before'; } },
    { l: 'Lift (walk-in)', g: function(o){ return o.lift; }, f: function(v){ return '<span class="' + cls(v) + '">' + pct(v, true) + '</span>'; }, best: 'high',
      s: function(o){ return 'vs the ' + o.baseDays + ' days before'; } },
    { l: 'Revenue', g: function(o){ return o.revenue; }, f: kes, best: 'high' },
    { l: 'Revenue a day', g: function(o){ return o.revenuePerDay; }, f: kes, best: 'high' },
    { l: 'Average selling price', g: function(o){ return o.avgPrice; }, f: kes, best: 'high', s: function(o){ return 'normal ' + kes(o.avgWas); } },
    { l: 'Real discount', g: function(o){ return o.realDiscPct; }, f: function(v){ return v == null ? '—' : v + '% off'; } },
    { l: 'Discount given away', g: function(o){ return o.discountKes; }, f: kes },
    { l: 'Extra units', g: function(o){ return o.extraUnits; }, f: function(v){ return v == null ? '—' : signed(v, n); }, best: 'high',
      s: function(){ return 'walk-in, over the baseline'; } },
    { l: 'Extra revenue', g: function(o){ return o.extraRevenue; }, f: function(v){ return v == null ? '—' : signed(v, kes); }, best: 'high' },
    { l: 'Extra revenue per KES 1 of discount', g: function(o){ return o.discountKes ? Math.round(o.extraRevenue / o.discountKes * 100) / 100 : null; },
      f: function(v){ return v == null ? '—' : 'KES ' + v.toFixed(2); }, best: 'high', s: function(){ return 'extra revenue ÷ discount given away'; } },
    { l: 'Sell-through', g: function(o){ return o.sellThrough; }, f: function(v){ return v == null ? '—' : v + '%'; }, best: 'high',
      s: function(o){ return 'of ' + n(o.stockStart) + ' in the shops at the start'; } },
    { l: 'After the offer', g: function(o){ return o.postDays ? o.postVsBase : null; },
      f: function(v){ return '<span class="' + cls(v) + '">' + pct(v, true) + '</span>'; }, best: 'high',
      s: function(o){ return o.postDays ? n(o.postPerDay) + ' a day over ' + o.postDays + ' day' + (o.postDays === 1 ? '' : 's') : 'no full day yet'; } },
    { l: 'Share of Kenya bag sales', g: function(o){ return o.share; }, f: function(v){ return v == null ? '—' : v + '%'; }, best: 'high',
      s: function(o){ return o.baseShare == null ? '' : o.baseShare + '% before'; } }
  ];
  var head = '<tr><th>Measure</th>' + O.map(function(o){
    return '<th class="r">' + esc(short(o)) + '<div class="cmp-win">' + esc(String(o.window).replace(/&middot;/g, ',')) + '</div></th>'; }).join('') + '</tr>';
  var body = rows.map(function(r){
    var vals = O.map(r.g), ok = vals.filter(function(v){ return v != null; });
    var top = (r.best && ok.length > 1) ? (r.best === 'high' ? Math.max.apply(null, ok) : Math.min.apply(null, ok)) : null;
    return '<tr><td class="name">' + r.l + '</td>' + O.map(function(o, i){
      var v = vals[i], b = top != null && v === top;
      return '<td class="r' + (b ? ' best' : '') + '">' + r.f(v) + (b ? ' <span class="cmp-star" title="Best of the offers">★</span>' : '')
        + (r.s ? '<div class="cmp-sub">' + r.s(o) + '</div>' : '') + '</td>'; }).join('') + '</tr>';
  }).join('');

  // ── Best bags ──
  var B = C.bags || [];
  var withLift = B.filter(function(b){ return b.avgLift != null; }).sort(function(a, b){ return b.avgLift - a.avgLift; });
  var noLift = B.filter(function(b){ return b.avgLift == null; });
  var bagRow = function(b, i){
    var disc = (b.avgPrice && b.was) ? Math.round((1 - b.avgPrice / b.was) * 100) : null;
    return '<tr><td class="name">' + (i + 1) + '. ' + esc(b.name) + '<div class="cmp-sub">' + esc((b.category || '').toLowerCase()) + '</div></td>'
      + '<td class="r">' + b.offers.length + '</td><td class="r">' + n(b.units) + '</td>'
      + '<td class="r"><span class="' + cls(b.avgLift) + '">' + pct(b.avgLift, true) + '</span></td>'
      + '<td class="r">' + kes(b.avgPrice) + '<div class="cmp-sub">normal ' + kes(b.was) + (disc != null ? ', ' + disc + '% off' : '') + '</div></td>'
      + '<td class="r">' + (b.sellThrough == null ? '—' : b.sellThrough + '%') + '</td></tr>';
  };
  var bagHead = '<tr><th>Bag</th><th class="r">Offers</th><th class="r">Units</th><th class="r">Lift (walk-in)</th><th class="r">Avg price</th><th class="r">Sell-through</th></tr>';
  var topN = withLift.slice(0, 5), botN = withLift.slice(-5).reverse().filter(function(b){ return topN.indexOf(b) < 0; });

  box.innerHTML =
    '<div class="panel" id="to-cmp-panel"><h2>Offers compared</h2>'
    + '<div class="cap">Each offer against the same bags over the ' + (R.baseDays || 28) + ' days before it, with other offers\' days left out, '
    + 'walk-in only (POS lines of ' + (R.bulkQty || 10) + '+ units taken out). ★ = the best offer on that row.</div>'
    + '<div class="cmp-scroll"><table class="cmp-table"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
    + '<div class="note" style="margin-top:0.8rem">Sell-through uses each offer\'s shop stock at its start: shop stock now minus what moved into the Kenya shops since (Odoo stock moves). '
    + 'Money comes from the bags\' own sale lines; bags sold inside a combo count in units but carry no price of their own.</div></div>'

    + '<div class="panel" id="to-bags-panel"><h2>Best bags across the offers</h2>'
    + '<div class="cap">Every bag that was on at least one offer. Lift is its walk-in units a day on offer against its own baseline, averaged over its offers.</div>'
    + '<div class="cmp-two"><div><div class="cmp-h">Responded best</div><div class="cmp-scroll"><table class="cmp-table"><thead>' + bagHead + '</thead><tbody>' + topN.map(bagRow).join('') + '</tbody></table></div></div>'
    + '<div><div class="cmp-h">Responded least</div><div class="cmp-scroll"><table class="cmp-table"><thead>' + bagHead + '</thead><tbody>' + botN.map(bagRow).join('') + '</tbody></table></div></div></div>'
    + (noLift.length ? '<div class="note" style="margin-top:0.7rem">Too little sold before to give a lift (under ' + (R.minBase || 0.5) + ' a day): '
       + noLift.map(function(b){ return '<b>' + esc(b.name) + '</b> (' + n(b.units) + ' units)'; }).join(', ') + '.</div>' : '')
    + '</div>'

    + '<div class="panel" id="to-next-panel"><h2>Next offer check</h2>'
    + '<div class="cap">Pick the bags, the discount and the days. Each bag starts from its walk-in rate over the last ' + (R.nowDays || '') + ' non-offer days ('
    + esc(R.nowFrom || '') + ' to ' + esc(R.nowTo || '') + ') and takes its own past lift on offer, moved to the chosen discount by '
    + '<b>+' + (F.slope || 0) + ' lift points per 1% off</b> (fitted on ' + (F.points || 0) + ' offers, so it is indicative).</div>'
    + '<div class="cmp-ctl"><span class="cmp-flbl">Bags</span><div class="cmp-chips" id="to-next-bags"></div></div>'
    + '<div class="cmp-ctl"><label class="cmp-flbl" for="to-next-disc">Discount</label><input id="to-next-disc" type="number" min="0" max="80" step="1"> <span class="cmp-sub">% off</span>'
    + '<label class="cmp-flbl" for="to-next-days" style="margin-left:1rem">Days</label><input id="to-next-days" type="number" min="1" max="31" step="1"></div>'
    + '<div id="to-next-verdict" class="cmp-verdict"></div>'
    + '<div class="cmp-scroll"><table class="cmp-table"><thead><tr><th>Bag</th><th>Estimate from</th><th class="r">Now a day</th><th class="r">Lift</th>'
    + '<th class="r">On offer a day</th><th class="r">Units</th><th class="r">Revenue</th><th class="r">Discount given away</th><th class="r">Extra revenue</th></tr></thead>'
    + '<tbody id="to-next-body"></tbody></table></div></div>';

  // ── Next offer check: client-side prediction ──
  var last = O[O.length - 1], lastBags = {};
  ((TO_DATA.offers[last.index] || {}).bags || []).forEach(function(b){ lastBags[String(b.name).toUpperCase()] = 1; });
  var pick = {}; B.forEach(function(b){ pick[b.name] = !!lastBags[b.name.toUpperCase()]; });
  var discIn = document.getElementById('to-next-disc'), daysIn = document.getElementById('to-next-days');
  discIn.value = Math.round(F.avgDisc || 20); daysIn.value = 2;
  var offDisc = {}; O.forEach(function(o){ offDisc[o.index] = o.realDiscPct; });
  var clamp = function(v){ return Math.max(-80, Math.min(300, v)); };
  var catLift = {};
  B.forEach(function(b){ if (b.avgLift == null) return; var c = b.category || ''; (catLift[c] = catLift[c] || []).push(clamp(b.avgLift)); });

  function estimate(b, D){
    var own = b.offers.filter(function(o){ return o.lift != null; });
    var lift, basis;
    if (own.length) {
      lift = own.reduce(function(a, o){ return a + clamp(o.lift) + (F.slope || 0) * (D - (offDisc[o.offer] == null ? D : offDisc[o.offer])); }, 0) / own.length;
      basis = 'its own ' + own.length + ' offer' + (own.length === 1 ? '' : 's');
    } else if (catLift[b.category]) {
      var cl = catLift[b.category]; lift = cl.reduce(function(a, x){ return a + x; }, 0) / cl.length + (F.slope || 0) * (D - (F.avgDisc || D));
      basis = (b.category || 'category').toLowerCase() + ' average';
    } else {
      lift = (F.avgLift || 0) + (F.slope || 0) * (D - (F.avgDisc || D)); basis = 'all offers’ average';
    }
    lift = clamp(lift);
    var base = b.nowPerDay || 0, price = b.normalPrice || b.was || 0;
    return { lift: lift, basis: basis, base: base, perDay: base * (1 + lift / 100), price: price };
  }
  function draw(){
    document.getElementById('to-next-bags').innerHTML = B.map(function(b){
      return '<button type="button" class="cmp-chip' + (pick[b.name] ? ' on' : '') + '" data-b="' + esc(b.name) + '">' + esc(b.name) + '</button>'; }).join('');
    var D = Math.max(0, Math.min(80, Number(discIn.value) || 0)), N = Math.max(1, Math.round(Number(daysIn.value) || 1));
    var sel = B.filter(function(b){ return pick[b.name]; });
    var T = { base: 0, perDay: 0, units: 0, rev: 0, disc: 0, extra: 0 };
    document.getElementById('to-next-body').innerHTML = sel.map(function(b){
      var e = estimate(b, D), units = e.perDay * N, rev = units * e.price * (1 - D / 100), disc = units * e.price * D / 100;
      var extra = rev - e.base * N * e.price;
      T.base += e.base; T.perDay += e.perDay; T.units += units; T.rev += rev; T.disc += disc; T.extra += extra;
      return '<tr><td class="name">' + esc(b.name) + '</td><td>' + esc(e.basis) + '</td><td class="r">' + e.base.toFixed(1) + '</td>'
        + '<td class="r"><span class="' + cls(e.lift) + '">' + pct(Math.round(e.lift), true) + '</span></td><td class="r">' + e.perDay.toFixed(1) + '</td>'
        + '<td class="r">' + n(Math.round(units)) + '</td><td class="r">' + kes(rev) + '</td><td class="r">' + kes(disc) + '</td>'
        + '<td class="r">' + signed(Math.round(extra), kes) + '</td></tr>';
    }).join('') + (sel.length ? '<tr class="cmp-tot"><td class="name">Total</td><td></td><td class="r">' + T.base.toFixed(1) + '</td>'
        + '<td class="r">' + (T.base ? pct(Math.round((T.perDay / T.base - 1) * 100), true) : '—') + '</td><td class="r">' + T.perDay.toFixed(1) + '</td>'
        + '<td class="r">' + n(Math.round(T.units)) + '</td><td class="r">' + kes(T.rev) + '</td><td class="r">' + kes(T.disc) + '</td>'
        + '<td class="r">' + signed(Math.round(T.extra), kes) + '</td></tr>' : '');
    var v = document.getElementById('to-next-verdict');
    if (!sel.length) { v.className = 'cmp-verdict'; v.innerHTML = 'Pick at least one bag.'; return; }
    var lift = T.base ? (T.perDay / T.base - 1) * 100 : 0;
    var word = lift <= 0 ? 'weak' : (lift >= 20 && T.extra > 0) ? 'likely okay' : 'marginal';
    v.className = 'cmp-verdict ' + (word === 'likely okay' ? 'ok' : word === 'weak' ? 'weak' : 'mid');
    v.innerHTML = '<b>' + word.charAt(0).toUpperCase() + word.slice(1) + '.</b> ' + sel.length + ' bag' + (sel.length === 1 ? '' : 's') + ' at ' + D + '% off for ' + N
      + ' day' + (N === 1 ? '' : 's') + ': about <b>' + n(Math.round(T.perDay)) + ' a day</b> against ' + n(Math.round(T.base)) + ' now (' + pct(Math.round(lift), true)
      + '), <b>' + kes(T.rev) + '</b> in revenue, ' + kes(T.disc) + ' given away in discount, '
      + (T.extra >= 0 ? '<b>+' + kes(T.extra) + '</b> more' : '<b>' + kes(-T.extra) + '</b> less')
      + ' than the same days at the normal pace and price. Likely okay = a lift of 20% or more and more revenue than without the offer.';
  }
  document.getElementById('to-next-bags').addEventListener('click', function(e){
    var b = e.target.closest('[data-b]'); if (!b) return; var k = b.getAttribute('data-b'); pick[k] = !pick[k]; draw(); });
  discIn.addEventListener('input', draw); daysIn.addEventListener('input', draw);
  draw();
})();
</script>

<!-- Page sidebar (page_sidebar.js): each offer, with its panels underneath, and scroll-spy -->
<script src="../assets/page_sidebar.js"></script>
<script>
  PageSidebar.init({
    content: 'body > .wrap',
    label: 'Timed Offers navigation',
    collapseSubs: true,
    sections: function () {
      var out = [], cols = ['#f59e0b', '#22d3ee', '#a78bfa', '#34d399', '#f472b6'];
      // Offers compared, Best bags, Next offer check — above the offers
      document.querySelectorAll('#to-compare > .panel').forEach(function (p) {
        var h = p.querySelector('h2');
        out.push({ el: p, num: '★', color: '#fbbf24', name: h ? h.textContent : '' });
      });
      document.querySelectorAll('#to-offers > .offer').forEach(function (offer, i) {
        var t = offer.querySelector('[data-el="title"]');
        var col = cols[i % cols.length];
        // 'KES 300 Off — Bags Not On Offer (CBD)' → 'KES 300 Off (CBD)': short, but still tells offers apart
        var full = (t ? t.textContent : 'Offer ' + (i + 1)).trim(), tag = full.match(/\(([^)]*)\)\s*$/);
        out.push({ el: offer, num: String(i + 1), color: col, name: full.split(' — ')[0].trim() + (tag && full.indexOf(' — ') > 0 ? ' (' + tag[1] + ')' : '') });
        offer.querySelectorAll('.panel > h2').forEach(function (h) {
          if (h.parentElement.offsetParent === null) return;   // panels this offer doesn't use stay hidden
          out.push({ el: h.parentElement, num: '·', sub: true, color: '#475569', name: h.textContent.split(' — ')[0].trim() });
        });
      });
      return out;
    }
  });
</script>

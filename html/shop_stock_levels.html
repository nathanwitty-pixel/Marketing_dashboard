<script>
(function () {

  function save() { try { localStorage.setItem('ssl-state', JSON.stringify({ leads: state.leads, show: state.show, pace: state.pace })); } catch (e) {} }
  var n = function (v) { return Math.round(v || 0).toLocaleString(); };
  var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  var ST = { oos: 'Out of stock', low: 'Below min', ok: 'OK', over: 'Over max', idle: 'Not moving', none: 'Not stocked' };
  // Send now looks to month end (docs/shop-stock-levels.md › Send now — ready for next month): the sum, on hover.
  function monName() { return (D.month || '').split(' ')[0] || 'this month'; }
  function nmName() { return ((D.nextMonth || {}).label || '').split(' ')[0] || 'next month'; }

    var dl = D.daysLeft;
    return 'On the shelf ' + r.have + (r.prepaid ? ' minus ' + r.prepaid + ' prepaid' : '') + ' minus ' + fmt1((r.wr || 0) / 7 * dl) + ' sales in the ' + dl + ' days left'

      + (r.send ? 'Send ' + r.send + ' now to last to month end. ' : 'Enough to last to month end. ')
      + (r.sendNm ? 'Then ' + r.sendNm + ' by the 1st so ' + nmName() + ' opens at Max (' + r.max + ', 2.5 weeks).' : 'No top-up needed for ' + nmName() + '.');
  }
  // Where each bag sells: the shop's part of the bag's weekly sales across all shops.
  var BAG_RATE = {};
  D.rows.forEach(function (r) { if (r.wr) BAG_RATE[r.bag] = (BAG_RATE[r.bag] || 0) + r.wr; });

  // The shop's five fastest sellers that run down to Min by month end: where to put the emphasis.
  function emphasisLine(s) {
    var top = D.rows.filter(function (r) { return r.shop === s && r.wr > 0 && (r.send > 0 || r.sendNm > 0); })
      .sort(function (a, b) { return b.wr - a.wr; }).slice(0, 5);
    if (!top.length) return '';
    return '<div style="margin:0.2rem 0 0.7rem;font-size:0.78rem;color:#cbd5e1"><b style="color:#fcd34d">Put emphasis on</b> (fastest sellers that are short now or for ' + esc(nmName()) + '): '
      + top.map(function (r) { return '<b>' + esc(capW(r.bag)) + '</b> ' + fmt1(r.wr) + ' a week, send ' + n(r.send) + ' now and ' + n(r.sendNm) + ' for ' + esc(nmName()); }).join('; ') + '</div>';
  }
  // Min / Max come from the weekly sales rate (docs/shop-stock-levels.md › Min / Max): the sum, on hover.
  var fmt1 = function (v) { return (Math.round(v * 10) / 10).toLocaleString('en-US'); };
  function rateWhy(r) {
    var f = (D.rateFactors || {})[r.shop] || {};
    if (!r.wr) return 'No sale at ' + r.shop + ' in the last ' + (D.recentWeeks || 13) + ' weeks: no Min / Max';
    return 'Sells ' + fmt1(r.wr) + ' a week = last ' + (D.recentWeeks || 13) + ' weeks, times season ' + (f.season || 1) + 'x and growth '

  }

    var mine = L.filter(function (p) { return p.cty === cty; });
    var per = state.prPer || 'one', today = D.today || new Date().toISOString().slice(0, 10);
    var m0 = today.slice(0, 7) + '-01', lm = new Date(m0 + 'T00:00:00'); lm.setMonth(lm.getMonth() - 1);
    var lm0 = lm.getFullYear() + '-' + String(lm.getMonth() + 1).padStart(2, '0') + '-01';
    var dates = mine.map(function (p) { return p.date; }).sort();
    var rFrom = state.prFrom || dates[0], rTo = state.prTo || dates[dates.length - 1];
    var picked = per === 'month' ? mine.filter(function (p) { return p.date >= m0; })
      : per === 'last' ? mine.filter(function (p) { return p.date >= lm0 && p.date < m0; })
      : per === 'range' ? mine.filter(function (p) { return p.date >= rFrom && p.date <= rTo; })
      : [mine.filter(function (p) { return String(p.id) === String(state.prPlan); })[0] || mine[0]].filter(Boolean);
    var cur = prAgg(picked);
    // Region / Shop filter: asks of the chosen shops only; allowed shared by their part of each product's asks
    var prShopsAll = {}; cur.rows.forEach(function (r) { Object.keys(r.shops || {}).forEach(function (sx) { prShopsAll[sx] = 1; }); });
    var prRegs = Object.keys(prShopsAll).map(regionOf).filter(function (v, i, a2) { return a2.indexOf(v) === i; }).sort();
    if (state.prReg && prRegs.indexOf(state.prReg) < 0) state.prReg = '';
    var prIn = Object.keys(prShopsAll).filter(function (sx) { return !state.prReg || regionOf(sx) === state.prReg; }).sort();
    if (state.prShop && prIn.indexOf(state.prShop) < 0) state.prShop = '';
    if (state.prReg || state.prShop) cur = prFilter(cur, state.prShop ? [state.prShop] : prIn);
    var segB = function (k, l) { return '<button type="button" data-v="' + k + '"' + (per === k ? ' class="on"' : '') + '>' + l + '</button>'; };
    var h = '<div class="rq-top" style="flex-wrap:wrap"><select id="ss-pr-cty">' + ctys.map(function (c) { return '<option' + (c === cty ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>'
      + '<div class="seg" id="ss-pr-per">' + segB('one', 'One list') + segB('month', 'This month') + segB('last', 'Last month') + segB('range', 'Date range') + '</div>';
    if (per === 'one') h += '<select id="ss-pr-plan">' + mine.map(function (p) {
        return '<option value="' + p.id + '"' + (picked[0] === p ? ' selected' : '') + '>' + esc(p.name) + ' · ' + dt(p.date) + ' · ' + (p.allowedPct == null ? 'no asks' : p.allowedPct + '% of asks allowed') + '</option>'; }).join('') + '</select>';
    if (per === 'range') h += '<span class="muted" style="font-size:0.74rem">from</span><input type="date" id="ss-pr-from" value="' + rFrom + '" min="' + dates[0] + '" max="' + dates[dates.length - 1] + '"><span class="muted" style="font-size:0.74rem">to</span><input type="date" id="ss-pr-to" value="' + rTo + '" min="' + dates[0] + '" max="' + dates[dates.length - 1] + '">';
    h += '<span class="muted" style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em">Region</span><select id="ss-pr-reg"><option value="">All regions</option>'
      + prRegs.map(function (g2) { return '<option' + (g2 === state.prReg ? ' selected' : '') + '>' + esc(g2) + '</option>'; }).join('') + '</select>'
      + '<span class="muted" style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.06em">Shop</span><select id="ss-pr-shop"><option value="">All shops</option>'
      + prIn.map(function (sx) { return '<option' + (sx === state.prShop ? ' selected' : '') + '>' + esc(sx) + '</option>'; }).join('') + '</select>';
    h += '<span class="muted" style="font-size:0.74rem">' + (cur.n ? n(cur.n) + ' list' + (cur.n === 1 ? '' : 's') + ' (' + esc(cur.names) + ') · ' + esc(cty) + ' shops\' requests ' + dt(cur.from) + ' – ' + dt(cur.date) : 'no approved list in this period') + ' · history from ' + dt(dates[0]) + '</span></div>';
    if (!cur.n) { box.innerHTML = h + '<div class="empty">No approved list in this period.</div>'; bindPr(); return; }
    var beyond = Math.max(cur.approved - cur.allowed, 0);
    var prF = !!(state.prReg || state.prShop);
    h += '<div class="rq-strip"><span>' + (prF ? 'Asked by ' + esc(state.prShop || state.prReg) : 'Shops asked') + ' <b>' + n(cur.req) + '</b></span><span>' + (prF ? 'Approved for these products (whole list)' : 'Approved') + ' <b>' + n(cur.approved) + '</b></span>'
      + '<span>Asks allowed <b>' + n(cur.allowed) + '</b> ' + sc(cur.allowedPct, 'Share of the shops asks that made the list') + '</span>'
      + '<span>Approved beyond the asks <b style="color:#c4b5fd">' + n(beyond) + '</b></span><span>Tailors given <b>' + n(cur.tailor) + '</b></span></div>';
    if (cur.allowedPct != null) h += '<div class="note"><b>' + cur.allowedPct + '% of asks allowed</b> = of every 100 bags the ' + esc(cty) + ' shops asked for, ' + cur.allowedPct + ' were put on the approved production list; the other ' + (100 - cur.allowedPct) + ' were cut or not allowed. '
      + n(beyond) + ' approved units go beyond what shops asked (the planner choice: stock building, targets, launches) and do not raise this %.</div>';
    h += prGroups(cur);
    var f = state.prF || '';
    h += '<div class="rq-top">' + ['', 'full', 'cut', 'not', 'added'].map(function (k) {
        var c = k ? (cur.counts || {})[k] || 0 : cur.rows.length;
        return '<button type="button" class="fchip' + (f === k ? ' on' : '') + '" data-f="' + k + '">' + (k ? PST[k] : 'All') + ' <b>' + c + '</b></button>'; }).join('') + '</div>';
    var rows = cur.rows.filter(function (r) { return (!f || r.status === f) && (!q || r.bag.indexOf(q) >= 0 || r.product.toUpperCase().indexOf(q) >= 0); });
    rows = rows.slice().sort(function (a2, b2) { return b2.req - a2.req || b2.approved - a2.approved; });   // tiles ranked by units asked
    if (!rows.length) h += '<div class="empty">Nothing here.</div>';
    else {
      var tv = function (l, val, cls) { return '<div class="mv"><span>' + l + '</span><b' + (cls ? ' class="' + cls + '"' : '') + '>' + val + '</b></div>'; };
      var PCL = { full: 'ok', cut: 'low', not: 'oos', added: 'over' };
      h += '<div class="mt-grid">' + rows.slice(0, 200).map(function (r, i) {
        var id = 'pr' + i, sh = Object.keys(r.shops || {}).sort(function (a2, b2) { return r.shops[b2] - r.shops[a2]; });
        var allowed = r.allowedSel != null ? r.allowedSel : Math.min(r.req, r.approved);
        popOf[id] = function () {
          return '<div class="h">' + esc(r.product) + '</div>' + row('Shops asked' + (r.reqAll != null ? ' (this filter)' : ''), n(r.req)) + (r.reqAll != null ? row('All shops asked', n(r.reqAll), '#94a3b8') : '')
            + row('Approved (whole list)', n(r.approved), '#34d399') + row('Allowed of these asks', n(Math.round(allowed)), '#34d399') + row('Tailors given', n(r.tailor), '#7dd3fc')
            + row('Status', PST[r.status]) + (r.priority ? row('Priority', esc(r.priority.replace('_', ' '))) : '')
            + '<div class="sec" style="color:#7dd3fc">Asked by shop</div>' + (sh.length ? sh.map(function (sx) { return row(esc(sx), n(r.shops[sx])); }).join('') : '<div class="muted">No shop asked, added on the list.</div>');
        };
        var ap = r.req ? Math.round(allowed / r.req * 100) : null;
        return '<div class="mt-tile ' + (PCL[r.status] || 'idle') + '" tabindex="0" role="button" data-pop="' + id + '">'
          + '<div class="mt-h"><span class="mt-rk' + (i === 0 ? ' top' : '') + '" title="Rank by units asked">#' + (i + 1) + '</span><span class="mt-nm" title="' + esc(r.product) + '">' + esc(r.product) + '</span></div>'
          + '<div class="mt-st"><span class="pst ' + r.status + '">' + PST[r.status] + '</span></div>'
          + '<div class="mt-big"><b>' + (ap == null ? '–' : ap + '%') + '</b><span>of asks allowed</span></div>'
          + '<div class="mt-vals">' + tv('Asked', n(r.req)) + tv('Approved', n(r.approved), 'pos') + tv('Allowed', n(Math.round(allowed)))
          + tv('Tailors', n(r.tailor), 'muted') + tv('Priority', esc((r.priority || 'none').replace('_', ' ')), 'muted') + tv('Shops', n(sh.length)) + '</div>'
          + (sh.length ? '<div class="muted" style="font-size:0.62rem;margin-top:0.3rem;line-height:1.3">' + sh.slice(0, 3).map(function (sx) { return esc(sx) + ' ' + n(r.shops[sx]); }).join(', ') + (sh.length > 3 ? ' and ' + (sh.length - 3) + ' more' : '') + '</div>' : '')
          + '</div>';
      }).join('') + '</div>' + (rows.length > 200 ? '<div class="empty">+' + (rows.length - 200) + ' more, use the search box.</div>' : '');
    }
    box.innerHTML = h;
    bindPr();
  }
  function bindPr() {
    var box = document.getElementById('ss-pr'), on = function (id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
    on('ss-pr-plan', 'change', function (ev) { state.prPlan = ev.target.value; drawProduction(); });
    on('ss-pr-cty', 'change', function (ev) { state.prCty = ev.target.value; state.prPlan = null; state.prFrom = state.prTo = null; drawProduction(); });
    on('ss-pr-from', 'change', function (ev) { state.prFrom = ev.target.value; drawProduction(); });
    on('ss-pr-to', 'change', function (ev) { state.prTo = ev.target.value; drawProduction(); });
    on('ss-pr-reg', 'change', function (ev) { state.prReg = ev.target.value; state.prShop = ''; drawProduction(); });
    on('ss-pr-shop', 'change', function (ev) { state.prShop = ev.target.value; drawProduction(); });
    box.querySelectorAll('#ss-pr-per button').forEach(function (b) { b.addEventListener('click', function () { state.prPer = b.getAttribute('data-v'); drawProduction(); }); });
    box.querySelectorAll('.fchip').forEach(function (b) { b.addEventListener('click', function () { state.prF = b.getAttribute('data-f'); drawProduction(); }); });
  }
  // Only the chosen shops' asks; allowed shared by their part of each product's asks (the list is per product).
  function prFilter(cur, shopList) {
    var set = {}; shopList.forEach(function (sx) { set[sx] = 1; });
    var out = { n: cur.n, names: cur.names, from: cur.from, date: cur.date, req: 0, approved: 0, allowed: 0, tailor: 0, counts: {}, rows: [] };
    cur.rows.forEach(function (r) {
      var mine = {}, req = 0;
      Object.keys(r.shops || {}).forEach(function (sx) { if (set[sx]) { mine[sx] = r.shops[sx]; req += r.shops[sx]; } });
      if (!req) return;
      var x = Object.assign({}, r, { shops: mine, reqAll: r.req, req: req, allowedSel: r.req ? Math.min(r.req, r.approved) * req / r.req : 0 });
      out.req += req; out.approved += r.approved; out.allowed += x.allowedSel; out.tailor += r.tailor;
      out.counts[r.status] = (out.counts[r.status] || 0) + 1; out.rows.push(x);
    });
    out.allowed = Math.round(out.allowed);
    out.allowedPct = out.req ? Math.round(out.allowed / out.req * 100) : null;
    return out;
  }
  // Lists added together per product (asks windows don't overlap: each starts the day after the previous list).
  function prAgg(plans) {
    var by = {}, out = { n: plans.length, names: plans.map(function (p) { return p.name; }).join(', '), req: 0, approved: 0, allowed: 0, tailor: 0, counts: {}, rows: [],
      from: plans.reduce(function (a, p) { return !a || p.from < a ? p.from : a; }, null), date: plans.reduce(function (a, p) { return !a || p.date > a ? p.date : a; }, null) };
    plans.forEach(function (p) { (p.rows || []).forEach(function (r) {
      var x = by[r.product] || (by[r.product] = { product: r.product, bag: r.bag, req: 0, approved: 0, tailor: 0, priority: r.priority, shops: {} });
      x.req += r.req || 0; x.approved += r.approved || 0; x.tailor += r.tailor || 0;
      Object.keys(r.shops || {}).forEach(function (s) { x.shops[s] = (x.shops[s] || 0) + r.shops[s]; });
    }); });
    Object.keys(by).forEach(function (k) {
      var x = by[k]; x.status = !x.req ? 'added' : x.approved >= x.req ? 'full' : x.approved > 0 ? 'cut' : 'not';
      out.req += x.req; out.approved += x.approved; out.allowed += Math.min(x.req, x.approved); out.tailor += x.tailor;
      out.counts[x.status] = (out.counts[x.status] || 0) + 1; out.rows.push(x);
    });
    out.rows.sort(function (a, b) { return Math.max(b.req, b.approved) - Math.max(a.req, a.approved); });
    out.allowedPct = out.req ? Math.round(out.allowed / out.req * 100) : null;
    return out;
  }
  // By category and by region (region allowed = product allowed shared by the shops part of the asks).
  function prGroups(cur) {
    var CATS = D.cats || {}, CORE = D.core || [], C = {}, R = {};
    var pct = function (a, b) { return b ? Math.round(a / b * 100) : null; };
    var cap = function (c) { return c ? c.charAt(0) + c.slice(1).toLowerCase() : 'No category'; };
    cur.rows.forEach(function (r) {
      var allowed = r.allowedSel != null ? r.allowedSel : Math.min(r.req, r.approved), c = CATS[r.bag] || '';
      var k = C[c] || (C[c] = { c: c, req: 0, approved: 0, allowed: 0 });
      k.req += r.req; k.approved += r.approved; k.allowed += allowed;
      Object.keys(r.shops || {}).forEach(function (s) {
        var g = regionOf(s), x = R[g] || (R[g] = { g: g, req: 0, allowed: 0, shops: {} });
        x.req += r.shops[s]; x.allowed += r.req ? allowed * r.shops[s] / r.req : 0; x.shops[s] = 1;
      });
    });
    var cl = Object.keys(C).map(function (k) { return C[k]; }).sort(function (a, b) { var ca = CORE.indexOf(a.c) >= 0, cb = CORE.indexOf(b.c) >= 0; return (cb - ca) || b.req - a.req; });
    var rl = Object.keys(R).map(function (k) { return R[k]; }).sort(function (a, b) { return b.req - a.req; });
    var h = '<div class="pr-grp"><div><div class="rq-sub" style="color:#7dd3fc">By category</div><div class="tw"><table id="ss-pr-cat"><thead><tr><th>Category</th><th class="r">Asked</th><th class="r">Approved</th><th class="r">Allowed</th><th class="r">Allowed %</th><th class="r">Not allowed</th><th class="r">Added</th></tr></thead><tbody>'
      + cl.map(function (k) { return '<tr><td class="bn" style="color:' + (CORE.indexOf(k.c) >= 0 ? '#7dd3fc' : '#94a3b8') + '">' + esc(cap(k.c)) + (CORE.indexOf(k.c) >= 0 ? ' <span class="muted" style="font-weight:600">· core</span>' : '') + '</td><td class="r">' + n(k.req) + '</td><td class="r">' + n(k.approved) + '</td><td class="r">' + n(k.allowed) + '</td><td class="r">' + sc(pct(k.allowed, k.req)) + '</td><td class="r" style="color:#fca5a5">' + n(k.req - k.allowed) + '</td><td class="r" style="color:#c4b5fd">' + n(k.approved - k.allowed) + '</td></tr>'; }).join('')
      + '</tbody></table></div></div>'
      + '<div><div class="rq-sub" style="color:#7dd3fc">By region <span>allowed shared by each shop part of the asks</span></div><div class="tw"><table id="ss-pr-reg"><thead><tr><th>Region</th><th class="r">Shops</th><th class="r">Asked</th><th class="r">Allowed</th><th class="r">Allowed %</th><th class="r">Share of asks</th></tr></thead><tbody>'
      + rl.map(function (x) { return '<tr><td class="bn">' + esc(x.g) + '</td><td class="r muted">' + Object.keys(x.shops).length + '</td><td class="r">' + n(x.req) + '</td><td class="r">' + n(Math.round(x.allowed)) + '</td><td class="r">' + sc(pct(x.allowed, x.req)) + '</td><td class="r muted">' + (pct(x.req, cur.req) == null ? '—' : pct(x.req, cur.req) + '%') + '</td></tr>'; }).join('')
      + '</tbody></table></div></div></div>';
    return h;
  }

  function draw() {
    popOf = {}; close(); applyPace();
    document.getElementById('ss-sub').innerHTML = '<b>' + esc(D.month) + '</b> · ' + D.daysLeft + ' of ' + D.daysIn + ' days left · month-end at the <b>' + PACE[curPace()].toLowerCase() + '</b>. Each shop\'s need per bag = the month\'s bag targets fitted to the shops\' Odoo targets, from where each bag sold in ' + esc(D.base || '') + '. Stock = the shops (combo products left out). Built ' + esc(D.generated || '') + '.';
    var rs = rows();
    drawKpis(rs); drawMonitor(rs); drawReport(rs); drawNext(rs); drawWaiting(); drawRequests(); drawProduction();
    if (window.PageSidebar && PageSidebar.refresh) setTimeout(PageSidebar.refresh, 0);
  }

  // ── Controls ──
  var ls = document.getElementById('ss-leads'); ls.value = state.leads;
  ls.addEventListener('change', function () { state.leads = ls.value; save(); draw(); });
  var seg = document.getElementById('ss-show');
  seg.querySelectorAll('button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-v') === state.show);
    b.addEventListener('click', function () { state.show = b.getAttribute('data-v'); state.lim = LIMIT; save(); seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); draw(); });
  });
  var qt = null, qi = document.getElementById('ss-q');
  qi.addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(function () { state.q = qi.value; state.lim = LIMIT; draw(); }, 200); });
  draw();
})();
</script>

<!-- Page sidebar (page_sidebar.js): "In this report" with scroll-spy -->

<script>
  PageSidebar.init({
    content: 'body > .wrap',
    label: 'Shop Stock Levels navigation',
    sections: function () {
      var main = document.querySelector('.psb-main');
      return Array.prototype.map.call(main ? main.querySelectorAll('.panel > h2') : [], function (h) {
        return { el: h.closest('.panel'), name: h.textContent.split(' — ')[0].trim() };
      });
    }
  });
</script>

  var isOut = function (s) { return (D.outside || []).indexOf(s) >= 0; };

  // ── Popover (hover with a grace period, tap to pin, Esc / tap outside closes) ──
  var pop = document.createElement('div'); pop.className = 'pp-pop'; pop.setAttribute('role', 'tooltip'); document.body.appendChild(pop);
  var open = null, hideT = null, popOf = {};
  function close() { pop.style.display = 'none'; if (open) { open.classList.remove('on'); open.__tapped = false; } open = null; }
  function show(el) {
    var f = popOf[el.getAttribute('data-pop')]; if (!f || open === el) return;
    close(); pop.innerHTML = f(); pop.style.display = 'block'; pop.style.left = '0px'; pop.style.top = '0px';
    var r = el.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
    var vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    pop.style.left = Math.max(12, Math.min(r.left + 60, vw - pw - 12)) + 'px';
    pop.style.top = ((r.bottom + 6 + ph > vh && r.top - 6 - ph > 0) ? r.top - 6 - ph : Math.min(r.bottom + 6, Math.max(12, vh - ph - 12))) + 'px';
    el.classList.add('on'); open = el;
  }
  function target(t) { return t && t.closest ? t.closest('[data-pop]') : null; }
  document.addEventListener('mouseover', function (ev) { var t = target(ev.target); if (t) { clearTimeout(hideT); if (!(open && open.__tapped)) show(t); } });
  document.addEventListener('mouseout', function (ev) {
    var t = target(ev.target);
    if (t && t === open && !t.__tapped && !(ev.relatedTarget && (t.contains(ev.relatedTarget) || pop.contains(ev.relatedTarget))))
      hideT = setTimeout(function () { if (open && !open.__tapped) close(); }, 220);
  });
  pop.addEventListener('mouseenter', function () { clearTimeout(hideT); });
  pop.addEventListener('mouseleave', function () { if (open && !open.__tapped) hideT = setTimeout(close, 220); });
  document.addEventListener('click', function (ev) {
    var t = target(ev.target);
    if (t) { if (open === t && t.__tapped) { close(); return; } show(t); t.__tapped = true; return; }
    if (open && !pop.contains(ev.target)) close();
  });
  document.addEventListener('keydown', function (ev) {
    var t = target(ev.target);
    if (ev.key === 'Escape') close();
    else if (t && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); open === t ? close() : show(t); }
  });
  window.addEventListener('scroll', function (ev) { if (!pop.contains(ev.target)) close(); }, true);
  window.addEventListener('resize', close);

  // ── Helpers ──
  function waitOf(shop, bag) { return (((D.leads || {})[state.leads] || {})[shop] || {})[bag] || null; }
  function rows() {
    var q = state.q.trim().toUpperCase();
    return (D.rows || []).filter(function (r) {
      return (!q || r.bag.indexOf(q) >= 0) && r.status !== 'none';
    });
  }
  function colourList(obj, colr) {
    var ks = Object.keys(obj || {}).sort(function (a, b) { return obj[b] - obj[a]; });
    return ks.length ? ks.map(function (c) { return row(esc(c), n(obj[c]), colr); }).join('') : '<div class="muted">none</div>';
  }

  // ── KPIs ──
  function drawKpis(rs) {
    var c = { oos: 0, low: 0 }, send = 0, cover = 0, miss = 0, short = 0, people = 0, perBag = {};
    rs.forEach(function (r) {
      if (r.status === 'oos') c.oos++; if (r.status === 'low') c.low++;
      send += r.send;
      if (!isOut(r.shop)) perBag[r.bag] = (perBag[r.bag] || 0) + r.send;
      miss += Math.max(Math.max(r.need - r.sold, 0) - r.have, 0);
      short += r.nmShort;
    });
    Object.keys(perBag).forEach(function (b) { cover += Math.min(perBag[b], (D.wh || {})[b] || 0); });
    var L = (D.leads || {})[state.leads] || {};
    Object.keys(L).forEach(function (s) { Object.keys(L[s]).forEach(function (b) { people += L[s][b].n; }); });
    var nm = D.nextMonth || {};
    var k = function (l, v, s, col) { return '<div class="kpi" style="border-top-color:' + col + '"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + s + '</div></div>'; };
    document.getElementById('ss-kpis').innerHTML =
        k('Out of stock', n(c.oos), 'shop × bag with a need and 0 on the shelf', '#ef4444')
      + k('Below min', n(c.low), 'at or under ' + D.minDays + ' days of need — refill', '#f59e0b')
      + k('Send now', n(send), 'units to refill to max · ' + esc(D.warehouse) + ' can cover <b style="color:#e2e8f0">' + n(cover) + '</b> (Kenya)', '#0ea5e9')
      + k('Customers waiting', n(people), 'still waiting · asked ' + LP[state.leads], '#fcd34d')
      + k('Missing this month', n(miss), 'still to sell beyond what the shelves hold', '#f87171')
      + k('Short for ' + esc((nm.label || '').split(' ')[0]), nm.open ? n(short) : '—', nm.open ? ('need − expected month-end balance' + (nm.estimated ? ' · estimated' : '')) : 'opens ' + dt(nm.opensOn), '#8b5cf6');
  }

  // ── Stock monitor ──
  function monPop(r) {
    var w = waitOf(r.shop, r.bag), wh = (D.whColours || {})[r.bag] || {};
    return '<div class="h">' + esc(r.bag) + ' <span style="color:#94a3b8;text-transform:none;letter-spacing:0">· ' + esc(r.shop) + '</span></div>'
      + row('Status', ST[r.status], '#e2e8f0') + row('Need this month', n(r.need) + ' (' + r.daily.toFixed(2) + ' a day)', '#e2e8f0')
      + row('Min · Max', n(r.min) + ' · ' + n(r.max), '#7dd3fc') + row('Have now', n(r.have), '#a78bfa') + row('Sold this month', n(r.sold), '#34d399')
      + row('Expected at month end', n(r.bal), r.bal < 0 ? '#f87171' : '#34d399')
      + (r.runsOut ? row('Runs out around', dt(r.runsOut), '#f87171') : '')
      + (r.send ? row('Send now', n(r.send) + (isOut(r.shop) ? '' : ' · ' + D.warehouse + ' has ' + n((D.wh || {})[r.bag] || 0)), '#0ea5e9') : '')
      + '<div class="sec" style="color:#a78bfa">Colours on the shelf</div>' + colourList(r.colours, '#e2e8f0')
      + (r.send && !isOut(r.shop) ? '<div class="sec" style="color:#0ea5e9">Colours in ' + esc(D.warehouse) + '</div>' + colourList(wh, '#e2e8f0') : '')
      + (w ? '<div class="sec" style="color:#fcd34d">Customers waiting (' + LP[state.leads] + ')</div>'
             + row('People', n(w.n) + ' · ' + n(w.online) + ' online · ' + n(w.walkin) + ' walk-in', '#fcd34d') + colourList(w.colours, '#fcd34d') : '');
  }
  function drawMonitor(rs) {
    var list = rs.map(function (r) { return { r: r, w: (waitOf(r.shop, r.bag) || {}).n || 0 }; });
    if (state.show === 'action') list = list.filter(function (x) { return x.r.status === 'oos' || x.r.status === 'low' || x.w > 0; });
    list.sort(function (a, b) { return RANK[a.r.status] - RANK[b.r.status] || b.w - a.w || b.r.need - a.r.need; });
    document.getElementById('ss-mon-hint').innerHTML = '<b>Min</b> = ' + D.minDays + ' days of need, <b>Max</b> = ' + D.maxDays + ' days (need = the shop\'s share of the month\'s bag targets). At or below Min → <b>send now</b> up to Max. '
      + (state.show === 'action' ? 'Showing what <b>needs action</b> — out of stock, below min, or someone waiting (' + LP[state.leads] + '). ' : 'Showing every bag each shop has or needs. ')
      + 'One block per shop — open it for its bags; hover / tap a bag for colours and who is waiting. <b>Website</b> is an online shop with no shelf, so it shows only the customers waiting.';
    // One block per shop: shops with the most out-of-stock / below-min first.
    var by = {};
    list.forEach(function (x) { (by[x.r.shop] = by[x.r.shop] || []).push(x); });
    var all = {};
    rs.forEach(function (r) { var a = all[r.shop] || (all[r.shop] = { oos: 0, low: 0, send: 0 }); if (r.status === 'oos') a.oos++; if (r.status === 'low') a.low++; a.send += r.send; });
    var shops = Object.keys(all).sort(function (a, b) { return (all[b].oos + all[b].low) - (all[a].oos + all[a].low) || (a < b ? -1 : 1); });
    var L = (D.leads || {})[state.leads] || {}, q = state.q.trim().toUpperCase();
    var waitN = function (s) { return Object.keys(L[s] || {}).filter(function (b) { return !q || b.indexOf(q) >= 0; }).reduce(function (t, b) { return t + L[s][b].n; }, 0); };
    var head = '<tr><th>Bag</th><th>Status</th><th class="r">Have</th><th class="r">Min</th><th class="r">Max</th><th class="r">Sold / need</th><th class="r">Month-end</th><th class="r">Waiting</th><th class="r">Send now</th></tr>';
    var h = '<button type="button" class="xall" id="ss-xall">' + (state.allOpen ? 'Collapse all shops' : 'Expand all shops') + '</button>';
    shops.forEach(function (s, si) {
      var a = all[s], items = by[s] || [], wn = waitN(s);
      var open = state.allOpen || (state.open || {})[s];
      h += '<details class="sb" data-shop="' + esc(s) + '"' + (open ? ' open' : '') + '><summary><span class="nm">' + esc(s) + (isOut(s) ? ' <span class="muted" style="font-size:0.66rem;font-weight:600">· own store</span>' : '') + '</span>'
        + '<span class="st oos">' + n(a.oos) + ' out</span><span class="st low">' + n(a.low) + ' below min</span>'
        + '<span class="cnt">send now <b style="color:#7dd3fc">' + n(a.send) + '</b></span>'
        + '<span class="cnt">waiting <b class="wait">' + n(wn) + '</b></span></summary><div class="body">';
      if (!items.length) h += '<div class="empty">Nothing needs action here.</div>';
      else {
        h += '<div class="tw"><table><thead>' + head + '</thead><tbody>';
        items.forEach(function (x, i) {
          var r = x.r, id = 'm' + si + '_' + i;
          popOf[id] = function () { return monPop(r); };
          h += '<tr tabindex="0" data-pop="' + id + '"><td class="bn">' + esc(r.bag) + '</td><td><span class="st ' + r.status + '">' + ST[r.status] + '</span></td>'
            + '<td class="r">' + n(r.have) + '</td><td class="r muted">' + n(r.min) + '</td><td class="r muted">' + n(r.max) + '</td>'
            + '<td class="r">' + n(r.sold) + ' <span class="muted">/ ' + n(r.need) + '</span></td>'
            + '<td class="r ' + (r.bal < 0 ? 'neg' : 'pos') + '">' + n(r.bal) + '</td>'
            + '<td class="r">' + (x.w ? '<span class="wait">' + n(x.w) + '</span>' : '<span class="muted">—</span>') + '</td>'
            + '<td class="r">' + (r.send ? '<b>' + n(r.send) + '</b>' : '<span class="muted">—</span>') + '</td></tr>';
        });
        h += '</tbody></table></div>';
      }
      h += '</div></details>';
    });
    // Online shops: no shelf, only who is waiting.
    (D.online || []).forEach(function (s) {
      var bags = Object.keys(L[s] || {}).filter(function (b) { return !q || b.indexOf(q) >= 0; }).sort(function (a, b) { return L[s][b].n - L[s][a].n; });
      var open = state.allOpen || (state.open || {})[s];
      h += '<details class="sb" data-shop="' + esc(s) + '"' + (open ? ' open' : '') + '><summary><span class="nm">' + esc(s) + ' <span class="muted" style="font-size:0.66rem;font-weight:600">· online — no shelf stock</span></span>'
        + '<span class="cnt">waiting <b class="wait">' + n(waitN(s)) + '</b></span></summary><div class="body">'
        + (bags.length ? bags.map(function (b) { var x = L[s][b]; return '<span class="chip" title="' + n(x.online) + ' online · ' + n(x.walkin) + ' walk-in">' + esc(b) + ' <b>' + n(x.n) + '</b></span>'; }).join('')
                       : '<div class="empty">Nobody waiting ' + LP[state.leads] + '.</div>')
        + '</div></details>';
    });
    document.getElementById('ss-mon').innerHTML = h;
    document.querySelectorAll('#ss-mon details.sb').forEach(function (d) {
      d.addEventListener('toggle', function () { state.open = state.open || {}; state.open[d.getAttribute('data-shop')] = d.open; });
    });
    document.getElementById('ss-xall').addEventListener('click', function (ev) { ev.stopPropagation(); state.allOpen = !state.allOpen; state.open = {}; draw(); });
  }

  // ── Stocks report by bag ──
  function byBag(rs) {
    var g = {};
    rs.forEach(function (r) {
      var x = g[r.bag] || (g[r.bag] = { bag: r.bag, have: 0, need: 0, sold: 0, still: 0, miss: 0, bal: 0, oos: 0, nm: 0, nmShort: 0, shops: [] });
      var still = Math.max(r.need - r.sold, 0);
      x.have += r.have; x.need += r.need; x.sold += r.sold; x.still += still; x.miss += Math.max(still - r.have, 0);
      x.bal += r.bal; x.nm += r.nm; x.nmShort += r.nmShort; if (r.status === 'oos') x.oos++; x.shops.push(r);
    });
    return Object.keys(g).map(function (k) { return g[k]; });
  }
  function bagPop(x, nmMode) {
    var shops = x.shops.slice().sort(function (a, b) { return nmMode ? b.nmShort - a.nmShort : (Math.max(b.need - b.sold, 0) - b.have) - (Math.max(a.need - a.sold, 0) - a.have); }).slice(0, 12);
    return '<div class="h">' + esc(x.bag) + '</div>'
      + row('Have (shops)', n(x.have), '#a78bfa') + row('Need this month', n(x.need), '#e2e8f0') + row('Sold so far', n(x.sold), '#34d399')
      + row('Missing this month', n(x.miss), x.miss ? '#f87171' : '#34d399') + row('Expected at month end', n(x.bal), x.bal < 0 ? '#f87171' : '#34d399')
      + row(esc(D.warehouse) + ' (to refill)', n((D.wh || {})[x.bag] || 0), '#0ea5e9')
      + '<div class="sec" style="color:#7dd3fc">' + (nmMode ? 'Short for next month — by shop' : 'By shop — have · still to sell · month-end') + '</div>'
      + shops.map(function (r) {
          return nmMode ? row(esc(r.shop), n(r.nmShort) + ' short of ' + n(r.nm), r.nmShort ? '#c4b5fd' : '#64748b')
                        : row(esc(r.shop) + ' <span class="st ' + r.status + '" style="font-size:0.5rem">' + ST[r.status] + '</span>', n(r.have) + ' · ' + n(Math.max(r.need - r.sold, 0)) + ' · ' + n(r.bal), r.bal < 0 ? '#f87171' : '#e2e8f0');
        }).join('');
  }
  function drawReport(rs) {
    var g = byBag(rs).filter(function (x) { return state.show === 'all' || x.miss > 0 || x.oos > 0 || x.bal < 0; });
    g.sort(function (a, b) { return b.miss - a.miss || a.bal - b.bal || b.need - a.need; });
    document.getElementById('ss-rep-hint').innerHTML = 'All shops (Website is online — no shelf stock) · ' + esc(D.month) + ', ' + D.daysLeft + ' days left. <b>Have</b> = shop stock only. <b>Missing</b> = still to sell beyond what the shelves hold; <b>month-end</b> = have − daily need × days left (negative = runs out first). '
      + (state.show === 'action' ? 'Showing bags that are missing, out of stock somewhere or running out. ' : '') + n(g.length) + ' bags.';
    if (!g.length) { document.getElementById('ss-rep').innerHTML = '<div class="empty">Every bag is covered to month end.</div>'; return; }
    var h = '<table><thead><tr><th>Bag</th><th class="r">Have</th><th class="r">Need (month)</th><th class="r">Sold</th><th class="r">Still to sell</th><th class="r">Missing</th><th class="r">Month-end</th><th class="r">Shops out</th><th class="r">' + esc(D.warehouse) + '</th></tr></thead><tbody>';
    g.slice(0, state.lim).forEach(function (x, i) {
      var id = 'b' + i; popOf[id] = function () { return bagPop(x, false); };
      h += '<tr tabindex="0" data-pop="' + id + '"><td class="bn">' + esc(x.bag) + '</td><td class="r">' + n(x.have) + '</td><td class="r">' + n(x.need) + '</td><td class="r">' + n(x.sold) + '</td>'
        + '<td class="r">' + n(x.still) + '</td><td class="r ' + (x.miss ? 'neg' : 'muted') + '">' + n(x.miss) + '</td>'
        + '<td class="r ' + (x.bal < 0 ? 'neg' : 'pos') + '">' + n(x.bal) + '</td><td class="r">' + (x.oos ? '<span class="neg">' + x.oos + '</span>' : '<span class="muted">0</span>') + '</td>'
        + '<td class="r muted">' + n((D.wh || {})[x.bag] || 0) + '</td></tr>';
    });
    document.getElementById('ss-rep').innerHTML = h + '</tbody></table>';
  }

  // ── Next month ──
  function drawNext(rs) {
    var nm = D.nextMonth || {}, box = document.getElementById('ss-nm');
    document.getElementById('ss-nm-title').textContent = 'Next month — ' + (nm.label || '') + ' preparedness';
    if (!nm.open) {
      document.getElementById('ss-nm-hint').innerHTML = '';
      box.innerHTML = '<div class="empty">Opens on ' + dt(nm.opensOn) + ' — mid-month, once this month\'s pace is clear.</div>'; return;
    }
    var g = byBag(rs).filter(function (x) { return x.nmShort > 0; }).sort(function (a, b) { return b.nmShort - a.nmShort; });
    var tot = g.reduce(function (a, x) { return a + x.nmShort; }, 0);
    document.getElementById('ss-nm-hint').innerHTML = '<b>Short</b> = next month\'s need − what the shelves are expected to hold at month end. This is the list to produce / buy before ' + esc(nm.label) + ' starts. '
      + n(g.length) + ' bags, <b style="color:#c4b5fd">' + n(tot) + '</b> units short.';
    var h = nm.estimated ? '<div class="note">' + esc(nm.label) + '\'s targets aren\'t in Odoo yet — next month\'s need is <b>estimated from this month\'s</b> (scaled to the days in the month). It updates by itself once the targets are entered.</div>' : '';
    if (!g.length) { box.innerHTML = h + '<div class="empty">Nothing short for next month.</div>'; return; }
    h += '<table><thead><tr><th>Bag</th><th class="r">Need next month</th><th class="r">Expected at month end</th><th class="r">Short</th><th class="r">Shops short</th><th class="r">' + esc(D.warehouse) + ' now</th></tr></thead><tbody>';
    g.slice(0, state.lim).forEach(function (x, i) {
      var id = 'n' + i; popOf[id] = function () { return bagPop(x, true); };
      h += '<tr tabindex="0" data-pop="' + id + '"><td class="bn">' + esc(x.bag) + '</td><td class="r">' + n(x.nm) + '</td><td class="r ' + (x.bal < 0 ? 'neg' : '') + '">' + n(x.bal) + '</td>'
        + '<td class="r" style="color:#c4b5fd;font-weight:800">' + n(x.nmShort) + '</td><td class="r">' + x.shops.filter(function (r) { return r.nmShort > 0; }).length + '</td>'
        + '<td class="r muted">' + n((D.wh || {})[x.bag] || 0) + '</td></tr>';
    });
    box.innerHTML = h + '</tbody></table>';
  }

  // ── Customers waiting ──
  function drawWaiting() {
    var L = (D.leads || {})[state.leads] || {}, q = state.q.trim().toUpperCase();
    var win = (D.leadWindows || {})[state.leads];
    document.getElementById('ss-wait-hint').innerHTML = 'People who asked for a bag the shop didn\'t have (WhatsApp = online, leads "Awaiting stock" = walk-in), asked <b>' + LP[state.leads] + '</b>'
      + (win ? ' (' + dt(win[0]) + ' – ' + dt(win[1]) + ')' : '') + ' and <b>still waiting</b>. Each person counts once per bag.';
    var shops = Object.keys(L).map(function (s) {
      var bags = Object.keys(L[s]).filter(function (b) { return !q || b.indexOf(q) >= 0; }).map(function (b) { return { b: b, x: L[s][b] }; })
        .sort(function (a, b) { return b.x.n - a.x.n; });
      return { s: s, bags: bags, tot: bags.reduce(function (a, y) { return a + y.x.n; }, 0) };
    }).filter(function (x) { return x.tot; }).sort(function (a, b) { return b.tot - a.tot; });
    if (!shops.length) { document.getElementById('ss-wait').innerHTML = '<div class="empty">Nobody is waiting in this period.</div>'; return; }
    document.getElementById('ss-wait').innerHTML = '<div class="shops">' + shops.map(function (x) {
      return '<div class="shopc"><h3><span>' + esc(x.s) + '</span><span class="wait">' + n(x.tot) + '</span></h3>'
        + x.bags.slice(0, 14).map(function (y) {
            var r = (D.rows || []).filter(function (z) { return z.shop === x.s && z.bag === y.b; })[0];
            var have = r ? r.have : 0;
            return '<span class="chip" title="' + n(y.x.online) + ' online · ' + n(y.x.walkin) + ' walk-in · ' + n(have) + ' on the shelf now">' + esc(y.b) + ' <b>' + n(y.x.n) + '</b>'
              + (have ? ' <span style="color:#34d399;font-size:0.64rem">· ' + n(have) + ' in now</span>' : ' <span style="color:#f87171;font-size:0.64rem">· 0 in</span>') + '</span>';
          }).join('') + (x.bags.length > 14 ? '<span class="chip">+' + (x.bags.length - 14) + ' more</span>' : '') + '</div>';
    }).join('') + '</div>';
  }

  function draw() {
    popOf = {}; close();
    document.getElementById('ss-sub').innerHTML = '<b>' + esc(D.month) + '</b> · ' + D.daysLeft + ' of ' + D.daysIn + ' days left. Each shop\'s need per bag = the month\'s bag targets fitted to the shops\' Odoo targets, from where each bag sold in ' + esc(D.base || '') + '. Stock = the shops (combo products left out). Built ' + esc(D.generated || '') + '.';
    var rs = rows();
    drawKpis(rs); drawMonitor(rs); drawReport(rs); drawNext(rs); drawWaiting();
    if (window.PageSidebar && PageSidebar.refresh) setTimeout(PageSidebar.refresh, 0);
  }

  // ── Controls ──
  var ls = document.getElementById('ss-leads'); ls.value = state.leads;
  ls.addEventListener('change', function () { state.leads = ls.value; save(); draw(); });
  var seg = document.getElementById('ss-show');
  seg.querySelectorAll('button').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-v') === state.show);
    b.addEventListener('click', function () { state.show = b.getAttribute('data-v'); state.lim = LIMIT; save(); seg.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); }); draw(); });
  });
  var qt = null, qi = document.getElementById('ss-q');
  qi.addEventListener('input', function () { clearTimeout(qt); qt = setTimeout(function () { state.q = qi.value; state.lim = LIMIT; draw(); }, 200); });
  draw();
})();
</script>

<!-- Page sidebar (page_sidebar.js): "In this report" with scroll-spy -->
<script src="../assets/page_sidebar.js"></script>
<script>
  PageSidebar.init({
    content: 'body > .wrap',
    label: 'Shop Stock Levels navigation',
    sections: function () {
      var main = document.querySelector('.psb-main');
      return Array.prototype.map.call(main ? main.querySelectorAll('.panel > h2') : [], function (h) {
        return { el: h.closest('.panel'), name: h.textContent.split(' — ')[0].trim() };
      });
    }
  });
</script>
</body>
</html>

<script>
/* ── Palette (matches theme.py) ──────────────────────────── */
var C = {
  emerald:'#34d399', cyan:'#22d3ee', violet:'#a78bfa', indigo:'#818cf8',
  amber:'#f59e0b', orange:'#fb923c', pink:'#f472b6', red:'#f87171',
  ink:'#e2e8f0', muted:'#94a3b8', dim:'#64748b',
  grid:'rgba(45,49,72,0.55)', track:'rgba(148,163,184,0.35)'
};
var GRID = C.grid;
function nf(n){ return (n==null||isNaN(n)) ? '—' : Math.round(Number(n)).toLocaleString('en-US'); }
function money(n){ return Math.round(Number(n)||0).toLocaleString('en-US'); }
function pf(n){ return (n==null||isNaN(n)) ? '—' : Number(n).toFixed(1)+'%'; }
function hesc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(s){ if(!s) return '—'; var p=String(s).split('-'); if(p.length<3) return s;
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return Number(p[2])+' '+(mo[Number(p[1])-1]||p[1])+' '+p[0]; }

/* ── Plugins ported from the live report ─────────────────── */
Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";
Chart.defaults.color = C.muted;

// Draws each bar's value on the bar (stacked segments + grouped bars).
var VAL = { id:'valLabels', afterDatasetsDraw:function(ch){
  var c = ch.ctx; c.save();
  c.font='700 0.64rem "Segoe UI", system-ui, sans-serif';
  c.textAlign='center'; c.textBaseline='middle';
  c.shadowColor='rgba(0,0,0,0.85)'; c.shadowBlur=3; c.fillStyle='#f8fafc';
  ch.data.datasets.forEach(function(ds, di){
    var meta = ch.getDatasetMeta(di); if (meta.hidden) return;
    meta.data.forEach(function(bar, i){
      var v = ds.data[i]; if (v == null || v < 1) return;
      c.fillText(money(v), (bar.x + bar.base) / 2, bar.y);
    });
  });
  c.restore();
}};

function donutCentre(txt){
  return { id:'donutCentre', afterDraw:function(ch){
    var a = ch.chartArea, c = ch.ctx;
    c.save(); c.textAlign='center'; c.textBaseline='middle';
    c.fillStyle='#f8fafc'; c.font='800 1.4rem "Segoe UI", system-ui, sans-serif';
    c.fillText(txt, (a.left+a.right)/2, (a.top+a.bottom)/2);
    c.restore();
  }};
}

var charts = [];
function clearCharts(){ charts.forEach(function(c){ try{c.destroy();}catch(e){} }); charts = []; }
function mk(id, cfg){ var el=document.getElementById(id); if(!el) return null; var c=new Chart(el.getContext('2d'), cfg); charts.push(c); return c; }

/* ── Data ────────────────────────────────────────────────── */
var DATA = JSON.parse(document.getElementById('history-data').textContent);
var MONTHS = DATA.months || [];

/* ── Render one month ────────────────────────────────────── */
function render(idx){
  clearCharts();
  var m = MONTHS[idx];
  var d = m.monthly;
  var achieved = d.achieved_pct;

  /* Weekly performance table rows (mirrors the live Current Performance card) */
  var wk = m.weekly.slice().sort(function(a,b){ return a.seq-b.seq; });
  var prevM = MONTHS[idx+1] || null;   // previous (older) month in history — compared on the chart
  var rows = wk.map(function(w){
    var bagsV = Number(w.bags)||0;
    var dv = Number(w.declined_by)||0;
    var targetV = (w.target_to_beat!=null) ? Number(w.target_to_beat) : (bagsV - dv);
    var beat = bagsV >= targetV;
    var dCol = dv < 0 ? '#f87171' : '#34d399';
    var bCol = beat ? '#34d399' : '#f87171';
    return '<tr>'
      + '<td><strong style="color:#e2e8f0">'+w.label+'</strong> <span style="color:#64748b">'+(w.week_month||'')+'</span></td>'
      + '<td style="color:#facc15">'+Number(w.pct).toFixed(2)+'%</td>'
      + '<td style="color:'+bCol+'">'+(beat?'▲ ':'')+nf(bagsV)+' bags</td>'
      + '<td style="color:#94a3b8">'+nf(targetV)+' bags</td>'
      + '<td style="color:'+dCol+'">'+(dv>0?'+':'')+nf(dv)+'</td>'
      + '</tr>';
  }).join('');

  // Kenya offer mix — by count and by units moved (mirrors the live report footer).
  var _cC = Number(d.combos)||0, _pC = Number(d.power_deals)||0, _tC = _cC+_pC;
  var _cU = Number(d.kenya_combo_units)||0, _pU = Number(d.kenya_deal_units)||0, _tU = _cU+_pU;
  var keMix = 'Offer mix — by count: <b class="c">Combos '+(_tC?Math.round(_cC/_tC*100):0)+'% ('+_cC+')</b> vs '
    + '<b class="p">Power Deals '+(_tC?Math.round(_pC/_tC*100):0)+'% ('+_pC+')</b> · by units moved: '
    + '<b class="c">Combos '+(_tU?Math.round(_cU/_tU*100):0)+'%</b> vs <b class="p">Power Deals '+(_tU?Math.round(_pU/_tU*100):0)+'%</b>';

  // Sinza offer mix — by count and by units, split combo/single/special (mirrors the live report).
  var _szO = m.offers.filter(function(o){ return o.region==='Sinza'; });
  var _szg = { combo:{n:0,u:0}, single:{n:0,u:0}, special:{n:0,u:0} };
  _szO.forEach(function(o){ var t=(_szg[o.offer_type]?o.offer_type:'combo'); _szg[t].n++; _szg[t].u+=Number(o.units)||0; });
  var _szN = _szO.length, _szU = _szg.combo.u+_szg.single.u+_szg.special.u;
  function _pc(x,t){ return t?Math.round(x/t*100):0; }
  var szMix = '<b>Offer mix</b> — by count: '
    + '<b style="color:#818cf8">Combos '+_pc(_szg.combo.n,_szN)+'% ('+_szg.combo.n+')</b> · '
    + '<b style="color:#22d3ee">Singles '+_pc(_szg.single.n,_szN)+'% ('+_szg.single.n+')</b> · '
    + '<b style="color:#f472b6">Specials '+_pc(_szg.special.n,_szN)+'% ('+_szg.special.n+')</b>'
    + ' &nbsp;·&nbsp; by units: '
    + '<b style="color:#818cf8">Combos '+_pc(_szg.combo.u,_szU)+'%</b> · '
    + '<b style="color:#22d3ee">Singles '+_pc(_szg.single.u,_szU)+'%</b> · '
    + '<b style="color:#f472b6">Specials '+_pc(_szg.special.u,_szU)+'%</b>';

  // Report comments (from Supabase) — grouped so each section's notes sit
  // directly UNDER the charts they describe, like the monthly report itself.
  var _cmts = m.comments || [];
  function secCmt(kw){
    var k = kw.toLowerCase();
    var list = _cmts.filter(function(c){ return String(c.section||'').toLowerCase().indexOf(k) >= 0; });
    if (!list.length) return '';
    var tc = { bottom:'#34d399', insight:'#fbbf24', rec:'#22d3ee', impact:'#a78bfa', bullet:'#94a3b8' };
    return '<div style="margin:0.5rem 1.4rem 0.2rem;padding-top:0.5rem;border-top:1px dashed #2d3148">'
      + '<div style="font-size:0.62rem;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;margin-bottom:0.15rem">From the monthly report</div>'
      + list.map(function(c){ var col = tc[c.type] || '#94a3b8';
          return '<div style="display:flex;gap:0.7rem;padding:0.35rem 0">'
            + '<span style="flex-shrink:0;width:104px;font-size:0.6rem;font-weight:800;text-transform:uppercase;letter-spacing:0.04em;color:'+col+';line-height:1.5">'+hesc(c.label||'')+'</span>'
            + '<span style="font-size:0.83rem;color:#cbd5e1;line-height:1.55">'+hesc(c.text||'')+'</span></div>';
        }).join('')
      + '</div>';
  }

  var html = ''
    + '<div class="exec"><div class="lbl">'+m.month+' '+m.year+' — the bottom line</div>'
    + '<div class="headline">Closed at <b>'+pf(achieved)+' of target</b> — '+nf(d.total_sales)+' of '+nf(d.total_target)+' bags'
    + (d.gap!=null ? ', missing by <b>'+nf(d.gap)+' bags</b>.' : '.') + '</div>'
    + '<div class="as-of">Data as of <b>'+fmtDate(m.generatedOn)+'</b> · last synced from Supabase '+fmtDate(DATA.generatedOn)+'</div></div>'

    /* KPIs */
    + '<div class="kpis">'
    +   '<div class="kpi"><div class="k-lbl">Sales vs Target</div><div style="position:relative;height:120px;margin-top:0.3rem"><canvas id="kpiDonut"></canvas></div><div class="k-sub" style="text-align:center">'+nf(d.total_sales)+' / '+nf(d.total_target)+' bags</div></div>'
    +   '<div class="kpi"><div class="k-lbl">Missed By</div><div class="k-val red">'+nf(d.gap)+'</div><div class="k-sub">bags short of target</div></div>'
    +   '<div class="kpi"><div class="k-lbl">Avg Weekly Sales</div><div class="k-val cyan">'+nf(d.avg_weekly)+'</div><div class="k-sub">'+(wk.length)+' weeks recorded</div></div>'
    +   '<div class="kpi"><div class="k-lbl">Posting Sales-Achieved</div><div class="k-val green">'+pf(d.posting_kenya_pct)+'</div><div class="k-sub">Kenya '+pf(d.posting_kenya_pct)+' · Sinza '+pf(d.posting_sinza_pct)+' · Uganda '+pf(d.posting_uganda_pct)+'</div></div>'
    + '</div>'
    + secCmt('Executive')

    /* 1 · Current Performance — live Weekly Performance card */
    + '<div class="sec flush"><div class="sec-head"><div class="sec-num" style="background:#facc15">1</div><h2>Current Performance</h2></div>'

    +   '<div class="mini"><div class="bar" style="background:#818cf8"></div><div class="m-lbl">Sinza · Cleared</div><div class="m-val">'+pf(d.sinza_cleared)+'</div><div class="m-sub">'+nf(d.sinza_units)+' units · KES '+nf(d.sinza_value)+'</div></div>'

  document.getElementById('report').innerHTML = html;
  buildCharts(m, wk, prevM);

/* Section 6 · Self-Made Combos. Self-made (CBR) combos (the CBR/2026 requests) vs
   the official running combos, with the full request log. Rendered only for
   months that have the data (September onward). */
function selfMadeHtml(m){
  var sm = m.selfMade || {};
  var s = sm.summary, reqs = sm.requests || [], sales = sm.sales || [];
  if (!s && !reqs.length && !sales.length) return '';
  s = s || {};
  var smU = Number(s.sm_units)||0, runU = Number(s.run_units)||0, totU = smU + runU;
  var share = totU ? Math.round(smU/totU*100) : 0;
  var smAvg = smU ? Math.round((Number(s.sm_value)||0)/smU) : 0;
  var runAvg = runU ? Math.round((Number(s.run_value)||0)/runU) : 0;

  function stB(st){ st=(st||'').toLowerCase(); var col,bg;
    if(st==='approved'){col='#34d399';bg='rgba(16,185,129,0.12)';}
    else if(st==='rejected'||st==='reject'){col='#f87171';bg='rgba(239,68,68,0.12)';}
    else {col='#fbbf24';bg='rgba(245,158,11,0.12)';}
    return '<span style="font-size:0.6rem;font-weight:800;text-transform:uppercase;padding:0.1rem 0.42rem;border-radius:6px;color:'+col+';background:'+bg+';border:1px solid '+col+'55">'+hesc(st||'—')+'</span>';
  }
  var td = 'padding:0.4rem 0.7rem;border-top:1px solid #262a3d';
  var th = 'text-align:left;padding:0.45rem 0.7rem;font-size:0.64rem;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;border-bottom:1px solid #2d3148';
  var thr = th.replace('text-align:left','text-align:right');

  var reqRows = reqs.map(function(r, i){
    var sold = Number(r.sold_units)||0;
    var soldCell = sold ? '<td style="'+td+';text-align:right;color:#34d399;font-weight:700">'+nf(sold)+'</td>'
                        : '<td style="'+td+';text-align:right;color:#475569">&mdash;</td>';
    var lloyd = r.lloyd ? ' <span style="color:#34d399;font-weight:700" title="Approved by Lloyd">&#10003;L</span>' : '';
    var rr = String(r.reject_reason == null ? '' : r.reject_reason).trim();
    var rej = rr && !/^(nan|none|null)$/i.test(rr) ? '<div style="font-size:0.66rem;color:#f87171;margin-top:0.15rem">'+hesc(rr)+'</div>' : '';
    return '<tr'+(i >= 10 ? ' class="sm-more" style="display:none"' : '')+'><td style="'+td+';color:#fbbf24;font-weight:700;white-space:nowrap">'+hesc(r.cbr||'')+'</td>'
      +'<td style="'+td+';color:#f1f5f9;font-weight:600">'+hesc(r.combo||'')+'</td>'
      +'<td style="'+td+';color:#cbd5e1">'+hesc(r.shop||'')+'</td>'
      +'<td style="'+td+';color:#cbd5e1">'+hesc(r.requested_by||'')+'</td>'
      +'<td style="'+td+'">'+stB(r.state)+lloyd+rej+'</td>'
      +'<td style="'+td+';text-align:right;color:#e2e8f0">'+nf(r.price)+'</td>'
      +'<td style="'+td+';color:#94a3b8;white-space:nowrap">'+hesc(r.requested_on||'')+'</td>'
      +soldCell+'</tr>';
  }).join('');
  var reqTable = reqs.length ? (
      '<div class="chart-cap" style="margin-top:1.1rem">Combo request log — CBR/2026 refs (includes rejected &amp; pending)</div>'
    + '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.8rem">'
    + '<thead><tr><th style="'+th+'">CBR</th><th style="'+th+'">Combo</th><th style="'+th+'">Shop</th>'
    +   '<th style="'+th+'">Requested by</th><th style="'+th+'">State</th><th style="'+thr+'">Price</th>'
    +   '<th style="'+th+'">Requested</th><th style="'+thr+'">Sold</th></tr></thead>'
    + '<tbody>'+reqRows+'</tbody></table></div>' + smMoreBtn(reqs.length)) : '';

  var regs = (m.extras||{}).selfMadeRegions || {};
  var bar = '<div style="display:flex;justify-content:flex-end;gap:0.3rem;margin:-0.2rem 0 0.6rem">'
    + [['kenya','Kenya'],['sinza','Sinza'],['uganda','Uganda']].map(function(k, i){
        var off = k[0] !== 'kenya' && !regs[k[0]];
        return '<button type="button" onclick="smPick(this,\''+k[0]+'\')" '+(off ? 'disabled title="Not stored for this month" ' : '')
          + 'style="font:inherit;font-size:0.7rem;font-weight:700;padding:0.25rem 0.7rem;border-radius:7px;cursor:'+(off?'not-allowed':'pointer')+';opacity:'+(off?0.4:1)+';'
          + (i === 0 ? 'border:1px solid #f59e0b;background:rgba(245,158,11,0.18);color:#fde68a' : 'border:1px solid #2d3148;background:transparent;color:#94a3b8')+'">'+k[1]+'</button>';
      }).join('') + '</div>';

  return '<div class="sec sm-sec"><div class="sec-head"><div class="sec-num" style="background:#fbbf24">6</div><h2>Self-Made Combos</h2></div>'
    + bar + '<div data-sm="kenya">'
    + '<div class="sec-sub">Self-made combos (CBR: pairings staff build at the till, logged as CBR/2026 requests) vs the official running combos &mdash; Kenya tills. '
    +   'Running combos offer a <b>wide colour range</b> at the till (avg '+nf(s.run_avg_colours)+' options); self-made ones are locked to one pairing (avg '+nf(s.sm_avg_colours)+').</div>'
    + '<div class="minis">'
    +   '<div class="mini"><div class="bar" style="background:#f59e0b"></div><div class="m-lbl">Self-made (CBR)</div><div class="m-val">'+nf(smU)+'</div><div class="m-sub">'+nf(s.sm_count)+' combos · KES '+nf(s.sm_value)+' · avg KES '+nf(smAvg)+' · '+nf(s.sm_avg_colours)+' colours</div></div>'
    +   '<div class="mini"><div class="bar" style="background:#06b6d4"></div><div class="m-lbl">Running (official)</div><div class="m-val">'+nf(runU)+'</div><div class="m-sub">'+nf(s.run_count)+' combos · KES '+nf(s.run_value)+' · avg KES '+nf(runAvg)+' · '+nf(s.run_avg_colours)+' colours</div></div>'
    +   '<div class="mini"><div class="bar" style="background:#8b5cf6"></div><div class="m-lbl">Self-made share</div><div class="m-val">'+share+'%</div><div class="m-sub">of all combo units</div></div>'
    +   '<div class="mini"><div class="bar" style="background:#94a3b8"></div><div class="m-lbl">Combo requests</div><div class="m-val">'+nf(s.req_total)+'</div><div class="m-sub">'+nf(s.req_approved)+' approved · '+nf(s.req_rejected)+' rejected'+(Number(s.req_pending)?' · '+nf(s.req_pending)+' pending':'')+'</div></div>'
    + '</div>'
    + reqTable
    + selfMadeMoreHtml(m)
    + '</div>'
    + smRegionHtml(regs.sinza, 'sinza', 'Sinza') + smRegionHtml(regs.uganda, 'uganda', 'Uganda')
    + '</div>';
}

/* 6 · Sinza / Uganda pane: running (listed) vs self-made combos from the till receipts (extras.selfMadeRegions) */
function smRegionHtml(r, key, name){
  if (!r) return '';
  var sum = function(rows, i){ return (rows||[]).reduce(function(t, x){ return t + (Number(x[i])||0); }, 0); };
  var runN = sum(r.running, 1), runV = sum(r.running, 2), smN = sum(r.selfMade, 1), smV = sum(r.selfMade, 2), tot = runN + smN;
  var cur = r.currency || '';
  var tbl = function(rows, first){
    return xtTable([{h:first},{h:'Combos',r:1},{h:'Money ('+cur+')',r:1}], (rows||[]).map(function(x){ return [hesc(x[0]), nf(x[1]), nf(x[2])]; }))
      .replace(/<tr>(?=<td)/g, function(){ return '<tr>'; });
  };
  var cut = function(html, n){                            // first 10 rows, the rest behind "Show all"
    var i = 0;
    return html.replace(/<tr>(?=<td)/g, function(){ i++; return i > 10 ? '<tr class="sm-more" style="display:none">' : '<tr>'; }) + smMoreBtn(n);
  };
  return '<div data-sm="'+key+'" style="display:none">'
    + '<div class="sec-sub">'+name+' combos from the till receipts: bags on one receipt at a shared price = a combo. One that fits a listed '
    +   name+' offer = <b>running</b>, any other pairing = <b>self-made</b>. Money in '+cur+'.</div>'
    + '<div class="minis">'
    +   xtMini('#f59e0b', 'Self-made', nf(smN), nf((r.selfMade||[]).length)+' pairings, '+cur+' '+nf(smV))
    +   xtMini('#06b6d4', 'Running (listed)', nf(runN), nf((r.running||[]).length)+' offers, '+cur+' '+nf(runV))
    +   xtMini('#8b5cf6', 'Self-made share', (tot ? Math.round(smN / tot * 100) : 0)+'%', 'of all combos')
    +   xtMini('#94a3b8', 'Bulk receipts', nf((r.bulk||{}).receipts), nf((r.bulk||{}).bags)+' bags, not counted as combos')
    + '</div>'
    + ((r.running||[]).length ? '<div class="chart-cap">Running offers</div>' + cut(tbl(r.running, 'Offer'), r.running.length) : '')
    + ((r.selfMade||[]).length ? '<div class="chart-cap" style="margin-top:1rem">Self-made combos</div>' + cut(tbl(r.selfMade, 'Combo'), r.selfMade.length) : '')
    + '</div>';
}

/* "Show all N" / "Show fewer" under a list cut to 10 rows */
function smMoreBtn(n){
  if (n <= 10) return '';
  return '<button type="button" onclick="smMore(this)" data-n="'+n+'" style="margin-top:0.5rem;font:inherit;font-size:0.72rem;font-weight:700;color:#93c5fd;background:transparent;border:1px solid #2d3148;border-radius:7px;padding:0.3rem 0.8rem;cursor:pointer">Show all '+n+' ▾</button>';
}
function smMore(btn){
  var box = btn.previousElementSibling, open = btn.getAttribute('data-open') === '1';
  [].forEach.call(box.querySelectorAll('tr.sm-more'), function(tr){ tr.style.display = open ? 'none' : ''; });
  btn.setAttribute('data-open', open ? '0' : '1');
  btn.innerHTML = open ? 'Show all ' + btn.getAttribute('data-n') + ' ▾' : 'Show fewer ▴';
}
function smPick(btn, key){
  var sec = btn.closest('.sm-sec');
  [].forEach.call(sec.querySelectorAll('[data-sm]'), function(p){ p.style.display = p.getAttribute('data-sm') === key ? '' : 'none'; });
  [].forEach.call(btn.parentNode.querySelectorAll('button'), function(b){ var on = b === btn;
    b.style.borderColor = on ? '#f59e0b' : '#2d3148'; b.style.background = on ? 'rgba(245,158,11,0.18)' : 'transparent'; b.style.color = on ? '#fde68a' : '#94a3b8'; });
}

/* Section 5 · Timed Offers. Rendered only for months that actually ran one, so
   a quiet month shows four sections rather than an empty fifth. */
function timedOffersHtml(m){
  var camps = m.timedOffers || [];
  if (!camps.length) return '';

  var blocks = camps.map(function(c, i){
    var up = (c.lift_pct == null) ? null : (Number(c.lift_pct) >= 0);
    var liftKpi = (up == null) ? ''
      : '<span><b style="color:'+(up?'#34d399':'#f87171')+'">'+(up?'+':'')+nf(c.lift_pct)+'%</b> sales lift</span>';
    // Per-day paces keep their decimal — rounding 77.5 to 78 loses the very
    // precision the before/after comparison is making.
    var pace = (c.base_per_day != null && c.offer_per_day != null)
      ? '<div class="chart-cap">Daily bags — pre-offer (grey) vs offer window (green), '
        + Number(c.base_per_day).toFixed(1)+'/day → '+Number(c.offer_per_day).toFixed(1)+'/day</div>'
        + '<div class="chart-wrap" style="height:220px"><canvas id="toLift'+i+'"></canvas></div>'
      : '';
    var week = (c.weekly && c.weekly.length)
      ? '<div class="chart-cap" style="margin-top:0.9rem">Week by week — bags/day for the 6 bags (offer week in green)</div>'
        + '<div class="chart-wrap" style="height:200px"><canvas id="toWeek'+i+'"></canvas></div>'
      : '';

    var rows = (c.bags || []).map(function(b){
      var noPosts = !Number(b.posts);
      var bl = b.bag_lift;
      var liftCell = (bl == null) ? '<span style="color:#64748b">—</span>'
        : '<span style="color:'+(Number(bl)>=0?'#34d399':'#f87171')+';font-weight:700">'
          + (Number(bl)>=0?'+':'')+nf(bl)+'%</span>';
      return '<tr>'
        + '<td>'+(b.name||'')+' <span style="color:#64748b;font-weight:400">'+(b.category||'')+'</span></td>'
        + '<td style="color:#e2e8f0">'+nf(b.sold)+'</td>'
        + '<td style="color:'+(noPosts?'#f87171':'#e2e8f0')+';font-weight:'+(noPosts?'700':'400')+'">'+nf(b.posts)+'</td>'
        + '<td style="color:#94a3b8">'+(b.per_post==null?'—':Number(b.per_post).toFixed(1))+'</td>'
        + '<td style="color:#94a3b8">'+nf(b.stock)+'</td>'
        + '<td>'+liftCell+'</td>'
        + '</tr>';
    }).join('');

    return '<div class="to-camp">'
      + '<div class="to-name">'+(c.name||'Timed Offer')+'</div>'
      + '<div class="to-win">'+(c.window_label||'')+' · '+(c.market||'')
      +   (c.total_stock!=null ? ' · '+nf(c.total_stock)+' bags in stock' : '')+'</div>'
      + '<div class="to-kpis">'
      +   '<span><b style="color:#34d399">'+nf(c.total_sold)+'</b> bags sold</span>'
      +   '<span><b style="color:#22d3ee">'+nf(c.total_posts)+'</b> posts</span>'
      +   '<span><b style="color:#a78bfa">'+(c.per_post==null?'—':Number(c.per_post).toFixed(1))+'</b> bags/post</span>'
      +   liftKpi
      +   (c.best_name ? '<span>Top seller: <b style="color:#e2e8f0;font-size:0.86rem">'+c.best_name+'</b> ('+nf(c.best_sold)+')</span>' : '')
      + '</div>'
      + pace
      + week
      + (rows ? '<div style="overflow-x:auto"><table class="to-table"><thead><tr>'
        + '<th>Bag</th><th>Sold</th><th>Posts</th><th>Sold/post</th><th>Stock</th><th>Bag lift</th>'
        + '</tr></thead><tbody>'+rows+'</tbody></table></div>' : '')
      + (c.verdict ? '<div class="to-verdict">'+c.verdict+'</div>' : '')
      + '</div>';
  }).join('');

  var totalSold = camps.reduce(function(s, c){ return s + (Number(c.total_sold)||0); }, 0);
  return '<div class="sec"><div class="sec-head"><div class="sec-num" style="background:#f59e0b">5</div><h2>Timed Offers</h2></div>'
    + '<div class="sec-sub"><b>'+camps.length+'</b> campaign'+(camps.length===1?'':'s')+' ran this month · '
    +   nf(totalSold)+' bags sold in their windows.</div>'
    + blocks + '</div>';
}

/* ── The newer pages' figures, inside the month's own sections (m.extras — lib/month_extras.py) ──
   3 · Offer Type        → Power Deals vs Deal of the Week (Kenya)      dealsHtml
   4 · Posting Yields    → posting yield + dead stock clearance         postingMoreHtml
   6 · Self-Made Combos  → monetary implication, goal, button usage     selfMadeMoreHtml
   7 · Bags On vs Off Offer (new section)                               bagsOnOfferHtml
   Months archived before these pages existed have no extras, so nothing extra shows for them. */
var XT = {
  td:  'padding:0.4rem 0.7rem;border-top:1px solid #262a3d;font-variant-numeric:tabular-nums',
  th:  'text-align:left;padding:0.45rem 0.7rem;font-size:0.64rem;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;border-bottom:1px solid #2d3148'
};
function xtTable(cols, rows){
  // cols: [{h, r (right-align)}]; rows: arrays of cell html
  return '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:0.8rem"><thead><tr>'
    + cols.map(function(c){ return '<th style="'+XT.th+(c.r?';text-align:right':'')+'">'+c.h+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(r){ return '<tr>' + r.map(function(v, i){
        return '<td style="'+XT.td+(cols[i].r?';text-align:right':'')+(i===0?';color:#f1f5f9;font-weight:600':';color:#cbd5e1')+'">'+v+'</td>'; }).join('') + '</tr>'; }).join('')
    + '</tbody></table></div>';
}
function xtMini(color, lbl, val, sub){
  return '<div class="mini"><div class="bar" style="background:'+color+'"></div><div class="m-lbl">'+lbl+'</div>'
    + '<div class="m-val">'+val+'</div><div class="m-sub">'+sub+'</div></div>';
}
function xtSub(title){ return '<div class="chart-cap" style="margin-top:1.4rem;font-size:0.72rem;color:#94a3b8">'+title+'</div>'; }
function kes(n){ return 'KES '+nf(n); }

/* 4 · Posting yield + dead stock clearance, per region */
function postingMoreHtml(m){

  var regs = [['Kenya','kenya'],['Sinza','sinza'],['Uganda','uganda']].filter(function(r){ return p[r[1]]; });
  function ach(x){ return x && x.achievedPct!=null ? '<b style="color:'+(x.achievedPct>=50?'#34d399':'#fbbf24')+'">'+pf(x.achievedPct)+'</b>' : '—'; }
  var yRows = regs.map(function(r){ var y = p[r[1]].yield||{};
    return [r[0], nf(y.posts), nf(y.expected), nf(y.soldPosted), ach(y), ach(y.on), ach(y.off), nf(y.bagsHit)+' / '+nf(y.bagsZero)]; });
  function seg(s){ return s ? '<b style="color:'+(s.clearPct>=50?'#34d399':'#f87171')+'">'+pf(s.clearPct)+'</b> <span style="color:#64748b">'+nf(s.sold)+' / '+nf(s.available)+'</span>' : '—'; }
  var dRows = regs.map(function(r){ var g = p[r[1]].dead||{};
    return [r[0], seg(g.posted_on), seg(g.posted_off), seg(g.notposted_on), seg(g.notposted_off), seg(g.all)]; });
  var spp = regs.map(function(r){ var y = p[r[1]].yield||{}; return r[0]+' '+(y.spp!=null?+Number(y.spp).toFixed(4):'—'); }).join(' · ');
  return '<div style="padding:0 0 0.4rem">'

    +   'Achieved = sales credited up to what was expected, per bag, ÷ expected.</div>'
    + '<div class="chart-wrap" style="height:200px"><canvas id="xtYield"></canvas></div>'
    + xtTable([{h:'Region'},{h:'Posts',r:1},{h:'Expected',r:1},{h:'Sold (posted bags)',r:1},{h:'Achieved',r:1},{h:'On offer',r:1},{h:'Not on offer',r:1},{h:'Bags hit / zero',r:1}], yRows)

    + '</div>';
}

/* 9 · Product Performance — Last-month view: bag of the month, top bags, shops (extras.productPerformance) */
function ppHtml(m){
  var p = (m.extras||{}).productPerformance; if (!p || !(p.rows||[]).length) return '';
  var MK = { ALL: 'All markets', KE: 'Kenya', TZ: 'Sinza', UG: 'Uganda' };
  var chg = function(a, b){ var d = a - b, pc = b ? Math.round(d / b * 100) : null;
    return '<span style="color:'+(d>=0?'#34d399':'#f87171')+'">'+(d>=0?'+':'')+nf(d)+(pc!=null?' ('+(pc>=0?'+':'')+pc+'%)':'')+'</span>'; };
  var title = function(t){ return String(t).toLowerCase().replace(/\b\w/g, function(c){ return c.toUpperCase(); }); };
  var botw = p.botw||{}, why = p.why||{};
  var whyBox = function(mk, bag, lbl){
    var e = ((why[mk]||{})[bag]); if (!e) return '';
    var sc = e.score||{};
    return '<div style="background:#171a27;border:1px solid #2d3148;border-radius:10px;padding:0.75rem 0.9rem;font-size:0.76rem;color:#cbd5e1;line-height:1.5">'
      + '<div style="font-size:0.64rem;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8">'+lbl+'</div>'
      + '<b style="color:#f8fafc;font-size:0.95rem">'+hesc(title(bag))+'</b> '+nf(e.lw)+' bags vs '+nf(e.pw)+' '+chg(e.lw, e.pw)
      + '<div style="margin:0.25rem 0;color:#e2e8f0">'+hesc(e.head||'')+'</div>'
      + (e.lines||[]).slice(0, 6).map(function(l){ return '<div style="color:'+(l[1]==='up'?'#34d399':l[1]==='down'?'#f87171':l[1]==='warn'?'#fbbf24':'#94a3b8')+'">'+hesc(l[0])+': '+hesc(l[2])+'</div>'; }).join('')
      + (sc.verdict ? '<div style="margin-top:0.3rem">Support '+(sc.total!=null?nf(sc.total)+'/100':'—')+': <b>'+hesc(sc.verdict)+'</b></div>' : '')
      + '</div>';
  };
  var all = botw.ALL || {};
  // top bags, all markets: rows = [bag, colour, mkt, units, rev, prevUnits, prevRev, shade]
  var agg = {};
  p.rows.forEach(function(r){ var a = agg[r[0]] = agg[r[0]] || [0, 0, 0, 0]; a[0] += r[3]; a[1] += r[4]; a[2] += r[5]; a[3] += r[6]; });
  var tot = Object.keys(agg).reduce(function(t, b){ return t + agg[b][0]; }, 0);
  var top = Object.keys(agg).sort(function(a, b){ return agg[b][0] - agg[a][0]; }).slice(0, p.topN || 15)
    .map(function(b, i){ var a = agg[b]; return [(i+1)+'. '+hesc(title(b)), nf(a[0]), nf(a[2]), chg(a[0], a[2]), kes(a[1]), tot ? pf(a[0] / tot * 100) : '—']; });
  var mkts = ['KE','TZ','UG'].filter(function(k){ return botw[k]; }).map(function(k){ var b = botw[k];
    return [MK[k], nf(b.total), kes(b.rev), hesc(title(b.top||'—')), b.mover ? hesc(title(b.mover)) : '—']; });
  var sh = ((p.shops||{}).ALL||{}).shops || [];
  var shops = sh.slice().sort(function(a, b){ return b.units - a.units; }).map(function(s){
    return [hesc(s.shop), nf(s.units), nf(s.pUnits), chg(s.units, s.pUnits), kes(s.rev), s.share!=null ? pf(s.share) : '—']; });
  return '<div class="sec"><div class="sec-head"><div class="sec-num" style="background:#f472b6">9</div><h2>Product Performance</h2></div>'

    +   '. Bag of the month and why it moved, the top bags and every shop.</div>'
    + '<div class="grid2">' + whyBox('ALL', all.top, 'Top seller') + (all.mover ? whyBox('ALL', all.mover, 'Biggest mover') : '') + '</div>'
    + (mkts.length ? '<div class="chart-cap" style="margin-top:1.1rem">Per market</div>'
        + xtTable([{h:'Market'},{h:'Bags',r:1},{h:'Money',r:1},{h:'Top seller'},{h:'Biggest mover'}], mkts) : '')

    + '<div class="chart-wrap" style="height:320px"><canvas id="xtPpBags"></canvas></div>'

    + xtTable([{h:'Bag'},{h:hesc((p.curLabel||'This month')),r:1},{h:'Month before',r:1},{h:'Change',r:1},{h:'Money',r:1},{h:'Share',r:1}], top)
    + '</details>'

/* 10 · Growth rate — 2024 / 2025 / 2026 per month, monthly + annual growth (GT.growth) */
var GT_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function gtGrowth(){
  var g = (typeof GT !== 'undefined' && GT && GT.growth) || null; if (!g) return null;
  var years = Object.keys(g).sort(), ly = years[years.length - 1], py = years[years.length - 2];
  var mom = [], yoy = [];
  for (var i = 0; i < 12; i++) {
    var v = g[ly][i], before = i ? g[ly][i - 1] : (py ? g[py][11] : null), last = py ? g[py][i] : null;
    mom.push(v != null && before ? (v - before) / before * 100 : null);
    yoy.push(v != null && last ? (v - last) / last * 100 : null);
  }
  return { g: g, years: years, ly: ly, py: py, mom: mom, yoy: yoy };
}
function growthHtml(m){
  var G = gtGrowth(); if (!G) return '';
  var mi = GT_MONTHS.indexOf(m.month), sel = String(m.year) === G.ly ? mi : -1;
  var sg = function(v){ return v == null ? '<span style="color:#475569">—</span>' : '<b style="color:'+(v>=0?'#34d399':'#f87171')+'">'+(v>=0?'+':'')+v.toFixed(2)+'%</b>'; };
  var tot = function(y){ return G.g[y].reduce(function(t, v){ return t + (v || 0); }, 0); };
  var rows = GT_MONTHS.map(function(nm, i){
    var r = [ (i === sel ? '<b style="color:#fbbf24">▶ ' : '') + nm.slice(0, 3).toUpperCase() + (i === sel ? '</b>' : '') ]
      .concat(G.years.map(function(y){ return G.g[y][i] == null ? '<span style="color:#475569">—</span>' : nf(G.g[y][i]); }), [sg(G.mom[i]), sg(G.yoy[i])]);
    return r;
  });
  rows.push(['<b>TOTALS</b>'].concat(G.years.map(function(y){ return '<b>'+nf(tot(y))+'</b>'; }), ['', '']));
  var note = '';
  if (sel >= 0 && G.g[G.ly][sel] != null) {
    var v = G.g[G.ly][sel], b = sel ? G.g[G.ly][sel - 1] : (G.py ? G.g[G.py][11] : null), l = G.py ? G.g[G.py][sel] : null;
    var line = function(lbl, p, d){ return p == null ? '' : '<div>'+lbl+': '+sg(p)+' <span style="color:#94a3b8">('+(d>=0?'up':'down')+' by <b style="color:#e2e8f0">'+nf(Math.abs(d))+' bags</b>)</span></div>'; };
    note = '<div style="display:flex;gap:2rem;flex-wrap:wrap;justify-content:center;font-size:0.86rem;margin:0.4rem 0 0.8rem">'
      + line('Monthly improvement (' + m.month + ' vs ' + (sel ? GT_MONTHS[sel - 1] : 'December ' + G.py) + ')', G.mom[sel], b != null ? v - b : 0)
      + line('Annual improvement (' + m.month + ' ' + G.ly + ' vs ' + G.py + ')', G.yoy[sel], l != null ? v - l : 0) + '</div>';
  }
  return '<div class="sec"><div class="sec-head"><div class="sec-num" style="background:#22c55e">10</div><h2>Growth Rate — Monthly &amp; Annual</h2></div>'
    + '<div class="sec-sub">Bags sold each month, '+G.years.join(' / ')+'. <b>Monthly growth</b> = the month vs the month before; <b>annual growth</b> = the month vs the same month last year ('+G.ly+' vs '+G.py+').</div>'
    + note
    + '<div id="xtGrowthMode" style="display:flex;justify-content:flex-end;gap:0.3rem;margin-bottom:0.3rem">'
    +   ['annual', 'monthly'].map(function(k){ return '<button type="button" data-g="'+k+'" onclick="gtMode(\''+k+'\')" style="font:inherit;font-size:0.7rem;font-weight:700;padding:0.25rem 0.7rem;border-radius:7px;cursor:pointer;border:1px solid #2d3148;background:transparent;color:#94a3b8">'+(k === 'annual' ? 'Annual' : 'Monthly')+'</button>'; }).join('')
    + '</div>'
    + '<div id="xtGrowthHead" style="text-align:center;font-size:0.92rem;font-weight:800;color:#f8fafc"></div>'
    + '<div class="chart-wrap" style="height:300px"><canvas id="xtGrowth"></canvas></div>'
    + xtTable([{h:'Month'}].concat(G.years.map(function(y){ return {h:y, r:1}; }), [{h:'Monthly growth', r:1}, {h:'Annual growth', r:1}]), rows)
    + '</div>';
}
/* Generic waterfall like "Why did we move?": start → each step → end. cfg: {startLabel, start, items:[{label, delta, tip}],
   endLabel, unit, head (html), mark (item index to box, or -1 = biggest step in the direction of the total), markLabel} */
function wfChart(id, headId, cfg){
  var el = document.getElementById(id); if (!el || !cfg.items.length) return null;
  var items = cfg.items, run = cfg.start, bars = [[0, cfg.start]], levels = [cfg.start];
  items.forEach(function(x){ bars.push([run, run + x.delta]); run += x.delta; levels.push(run); });
  var end = run; bars.push([0, end]); levels.push(end);
  var up = end >= cfg.start, mark = cfg.mark;
  if (mark == null || mark < 0) { mark = -1;

    b.style.borderColor = on ? '#6366f1' : '#2d3148'; b.style.background = on ? 'rgba(99,102,241,0.2)' : 'transparent'; b.style.color = on ? '#e2e8f0' : '#94a3b8'; });
  if (window._gtChart) { try { window._gtChart.destroy(); } catch (e) {} window._gtChart = null; }

    var ys = G.g[G.ly], months = []; for (var q = 0; q < 12; q++) if (ys[q] != null) months.push(q);

      prevV = v; prevL = GT_MONTHS[j].slice(0, 3); return st; });

  var labels = [w.then.label, 'Selling days'].concat(regs.map(function(g){ return g.region; }), [w.now.label]);
  var deltas = [w.daysEffect].concat(regs.map(function(g){ return g.delta; }));
  var bars = [[0, w.then.bags]], run = w.then.bags, levels = [run];
  deltas.forEach(function(d){ bars.push([run, run + d]); run += d; levels.push(run); });
  bars.push([0, w.now.bags]); levels.push(w.now.bags);
  var up = w.now.bags >= w.then.bags;

  regs.forEach(function(g, i){ if ((up ? g.delta > 0 : g.delta < 0) && (reason < 0 || Math.abs(g.delta) > Math.abs(regs[reason].delta))) reason = i; });
  var reasonIdx = reason >= 0 ? reason + 2 : -1;

  var stepR = Math.pow(10, Math.floor(Math.log10(span))), yMin = lo > 0.5 * hi ? Math.max(0, Math.floor((lo - span * 0.6) / stepR) * stepR) : 0;

  if (sub) sub.innerHTML = hesc(w.then.range)+' ('+w.then.days+' days, '+nf(w.then.bags)+' bags) vs '+hesc(w.now.range)+' ('+w.now.days+' days, '+nf(w.now.bags)+' bags)'
    + (mode === 'without' ? ', bulk till orders taken out' : '') + (yMin ? '. Axis starts at '+nf(yMin) : '');
  var lbl = { id:'xtWmLabels', afterDatasetsDraw:function(ch){
    var ctx = ch.ctx, meta = ch.getDatasetMeta(0);
    ctx.save(); ctx.textAlign = 'center';
    meta.data.forEach(function(e, i){

      ctx.fillText(end ? nf(v) : (v >= 0 ? '+' : '') + nf(v), e.x, top - 4);
      if (i === reasonIdx) {

/* Money as "36.2M" / "950K" */
function mShort(v){ v = Number(v)||0; var a = Math.abs(v);
  return a >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : a >= 1e3 ? Math.round(v / 1e3) + 'K' : nf(v); }

/* A stack-up waterfall like "Why did we move?": each item rises from the running total, then a total bar;
   numbers on every bar, the biggest item boxed amber with opts.mark as its label. */
function stackWf(id, items, opts){
  var el = document.getElementById(id); if (!el || !items.length) return null;
  var run = 0, bars = items.map(function(it){ var b = [run, run + it.value]; run += it.value; return b; });
  bars.push([0, run]);
  var big = items.reduce(function(bi, it, i){ return it.value > items[bi].value ? i : bi; }, 0);
  var lbl = { id:'stackWfLabels', afterDatasetsDraw:function(ch){
    var ctx = ch.ctx, meta = ch.getDatasetMeta(0);
    ctx.save(); ctx.textAlign = 'center';
    meta.data.forEach(function(e, i){
      var top = Math.min(e.y, e.base), bottom = Math.max(e.y, e.base), isTot = i === items.length;
      var v = isTot ? run : items[i].value;
      ctx.font = '700 11px Segoe UI, system-ui, sans-serif'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = isTot ? '#f8fafc' : items[i].color === '#ef4444' ? '#f87171' : items[i].color === '#64748b' ? '#cbd5e1' : '#34d399';
      ctx.fillText((isTot ? '' : '+') + mShort(v), e.x, top - 4);
      if (!isTot && i === big && opts.mark) {
        var bw = e.width + 10; ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
        ctx.strokeRect(e.x - bw / 2, top - 20, bw, bottom - top + 24);
        ctx.fillStyle = '#f59e0b'; ctx.font = '700 10px Segoe UI, system-ui, sans-serif'; ctx.fillText(opts.mark, e.x, top - 23);
      }
    });
    ctx.restore();
  } };
  return mk(id, {
    type:'bar',
    data:{ labels: items.map(function(it){ return it.label; }).concat([opts.total || 'Total']),
           datasets:[{ data: bars, backgroundColor: items.map(function(it){ return it.color; }).concat(['#3b82f6']),
                       borderRadius:3, barPercentage:0.75, categoryPercentage:0.9 }] },
    options:{ responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:34 } },
      plugins:{ weekChange:false, legend:{ display:false },
        tooltip:{ callbacks:{ label:function(c){ var i = c.dataIndex;
          return i === items.length ? 'KES ' + nf(run) : (items[i].tip || ['KES ' + nf(items[i].value)]); } } } },
      scales:{ x:{ grid:{ display:false }, ticks:{ color:'#94a3b8', maxRotation:30, minRotation:0, autoSkip:false, font:{ size:10 } } },
               y:{ beginAtZero:true, suggestedMax: run * 1.1, grid:{ color:GRID }, ticks:{ color:'#64748b', callback:function(v){ return mShort(v); } } } } },
    plugins:[lbl]
  });
}

/* A change waterfall like "Why did we move?": then → each item's change (biggest rise first) → now */
function changeWf(id, headId, thenLbl, nowLbl, items, unit){
  var el = document.getElementById(id); if (!el || !items.length) return null;
  items = items.slice().sort(function(a, b){ return (b.now - b.then) - (a.now - a.then); });
  var t0 = items.reduce(function(s, x){ return s + x.then; }, 0), t1 = items.reduce(function(s, x){ return s + x.now; }, 0);
  var run = t0, bars = [[0, t0]], levels = [t0];
  items.forEach(function(x){ var d = x.now - x.then; bars.push([run, run + d]); run += d; levels.push(run); });
  bars.push([0, t1]); levels.push(t1);
  var up = t1 >= t0, reason = -1;
  items.forEach(function(x, i){ var d = x.now - x.then; if ((up ? d > 0 : d < 0) && (reason < 0 || Math.abs(d) > Math.abs(items[reason].now - items[reason].then))) reason = i; });
  var lo = Math.min.apply(null, levels), hi = Math.max.apply(null, levels), span = Math.max(hi - lo, 1);
  var stepR = Math.pow(10, Math.floor(Math.log10(span))), yMin = lo > 0.5 * hi ? Math.max(0, Math.floor((lo - span * 0.6) / stepR) * stepR) : 0;
  var diff = t1 - t0, pc = t0 ? diff / t0 * 100 : null;
  var hd = document.getElementById(headId);
  if (hd) hd.innerHTML = hesc(thenLbl)+' → '+hesc(nowLbl)+': <span style="color:'+(diff>=0?'#34d399':'#f87171')+'">'+(diff>=0?'+':'')+nf(diff)+' '+unit
    + (pc!=null?' ('+(pc>=0?'+':'')+pc.toFixed(1)+'%)':'')+'</span>'
    + '<div style="font-size:0.72rem;font-weight:400;color:#94a3b8;margin-top:0.1rem">'+nf(t0)+' → '+nf(t1)+' '+unit+(yMin ? '. Axis starts at '+nf(yMin) : '')+'</div>';
  var lbl = { id:'changeWfLabels', afterDatasetsDraw:function(ch){
    var ctx = ch.ctx, meta = ch.getDatasetMeta(0);
    ctx.save(); ctx.textAlign = 'center';
    meta.data.forEach(function(e, i){
      var top = Math.min(e.y, e.base), bottom = Math.max(e.y, e.base), end = i === 0 || i === bars.length - 1;
      var v = end ? bars[i][1] : items[i - 1].now - items[i - 1].then;
      ctx.font = '700 10px Segoe UI, system-ui, sans-serif'; ctx.textBaseline = 'bottom';
      ctx.fillStyle = end ? '#f8fafc' : (v >= 0 ? '#34d399' : '#f87171');
      ctx.fillText(end ? nf(v) : (v >= 0 ? '+' : '') + nf(v), e.x, top - 4);
      if (i === reason + 1 && reason >= 0) {
        var bw = e.width + 8; ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 2;
        ctx.strokeRect(e.x - bw / 2, top - 18, bw, bottom - top + 22);
        ctx.fillStyle = '#f59e0b'; ctx.fillText('the reason', e.x, top - 21);
      }
    });
    ctx.restore();
  } };
  return mk(id, {
    type:'bar',
    data:{ labels:[thenLbl].concat(items.map(function(x){ return x.label; }), [nowLbl]),
           datasets:[{ data:bars, backgroundColor:bars.map(function(b, i){ return i === 0 ? '#3b5b8a' : i === bars.length - 1 ? '#3b82f6' : ((items[i - 1].now - items[i - 1].then) >= 0 ? '#10b981' : '#ef4444'); }),
                       borderRadius:3, barPercentage:0.75, categoryPercentage:0.9 }] },
    options:{ responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:30 } },
      plugins:{ weekChange:false, legend:{ display:false },
        tooltip:{ callbacks:{ label:function(c){ var i = c.dataIndex;
          if (i === 0 || i === bars.length - 1) return nf(bars[i][1]) + ' ' + unit;
          var x = items[i - 1], d = x.now - x.then;
          return [(d >= 0 ? '+' : '') + nf(d) + ' ' + unit + ' (' + nf(x.then) + ' → ' + nf(x.now) + ')'].concat(x.tip || []); } } } },
      scales:{ x:{ grid:{ display:false }, ticks:{ color:'#94a3b8', maxRotation:40, minRotation:30, autoSkip:false, font:{ size:10 } } },
               y:{ min:yMin, grid:{ color:GRID }, ticks:{ color:'#64748b', callback:function(v){ return nf(v); } } } } },
    plugins:[lbl]
  });
}

function buildCharts(m, wk, prevM){

      if (npT.target) {                                  // dashed target line
        var y = ch.scales.y.getPixelForValue(npT.target), a = ch.chartArea;
        ctx.setLineDash([6, 4]); ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(a.left, y); ctx.lineTo(a.right, y); ctx.stroke(); ctx.setLineDash([]);
        var txt = 'Target ' + nf(npT.target); ctx.font = '700 11px Segoe UI, system-ui, sans-serif';
        var w = ctx.measureText(txt).width + 12;
        ctx.fillStyle = 'rgba(15,17,23,0.9)'; ctx.fillRect(a.right - w - 4, y - 10, w, 20);
        ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1; ctx.strokeRect(a.right - w - 4, y - 10, w, 20);
        ctx.fillStyle = '#fbbf24'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, a.right - w / 2 - 4, y);
      }
      ctx.restore();
    } };
    var c1 = mk('npChart', {
      type:'bar',
      data:{ labels:[], datasets:[{ data:[], backgroundColor:[], borderRadius:3, barPercentage:0.75, categoryPercentage:0.9 }] },
      options:{ responsive:true, maintainAspectRatio:false, layout:{ padding:{ top:24 } },
        plugins:{ weekChange:false, legend:{ display:false },
          tooltip:{ callbacks:{ label:function(c){ var i = c.dataIndex, L = npT.list;
            if (i === L.length) return nf(npT.total) + ' bags sold' + (npT.target ? ' of ' + nf(npT.target) + ' target' : '');
            var x = L[i], tg = (x.sold||0) + (x.remaining||0);
            return nf(x.sold) + ' sold of ' + nf(tg) + ' target' + (x.remaining ? ', ' + nf(x.remaining) + ' to go' : ', target met'); } } } },
        scales:{ x:{ grid:{ display:false }, ticks:{ color:'#94a3b8', maxRotation:30, minRotation:0, autoSkip:false, font:{ size:10 } } },
                 y:{ beginAtZero:true, grid:{ color:GRID }, ticks:{ color:'#64748b', callback:function(v){ return nf(v); } } } } },
      plugins:[npLbl]
    });
    function drawNp(t){
      if (!c1) return;
      var run = 0, bars = t.map(function(x){ var s = x.sold||0, b = [run, run + s]; run += s; return b; });
      npT.list = t; npT.total = run; npT.target = t.reduce(function(s, x){ return s + (x.sold||0) + (x.remaining||0); }, 0);
      bars.push([0, run]);
      c1.data.labels = t.map(function(x){ return x.name; }).concat(['Total sold']);
      c1.data.datasets[0].data = bars;
      c1.data.datasets[0].backgroundColor = t.map(function(){ return '#10b981'; }).concat(['#3b82f6']);
      c1.options.scales.y.suggestedMax = Math.max(npT.total, npT.target) * 1.08;
      c1.update();
      var pc = npT.target ? npT.total / npT.target * 100 : null, short = Math.max(npT.target - npT.total, 0);
      var hd = document.getElementById('npHead'), sb = document.getElementById('npSub');
      if (hd) hd.innerHTML = hesc(m.month) + ' new products: <span style="color:#34d399">' + nf(npT.total) + ' bags sold</span>'
        + (npT.target ? ' of ' + nf(npT.target) + ' target <span style="color:' + (pc >= 100 ? '#34d399' : '#f87171') + '">(' + pc.toFixed(1) + '%)</span>'
          + (short ? ', <span style="color:#f87171">' + nf(short) + ' short</span>' : '') : '');
      if (sb) sb.innerHTML = nf(t.length) + ' new products. Each bar is one product’s bags sold, stacking up to the total; the dashed line is the month’s new-product target. Hover a bar for its own target.';
    }
    var c2 = mk('npStockChart', {
      type:'bar', plugins:[VAL],
      data:{ labels:[], datasets:[
        { label:'Stock available', data:[], backgroundColor:'#a78bfa', borderRadius:3 },
        { label:'Posts done', data:[], backgroundColor:'#22d3ee', borderRadius:3 } ] },
      options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12 } },
          tooltip:{ callbacks:{ label:function(c){ return c.dataset.label+': '+money(c.parsed.x); } } } },
        scales:{ x:{ grid:{color:GRID} }, y:{ grid:{display:false} } } }
    });
    function draw(){
      var t = sorted(), labels = t.map(function(x){return x.name;});
      drawNp(t);
      if (c2){ c2.data.labels=labels; c2.data.datasets[0].data=t.map(function(x){return x.stock;}); c2.data.datasets[1].data=t.map(function(x){return x.posts;}); c2.update(); }
    }
    if (sel) sel.addEventListener('change', draw);
    draw();
  }

  /* 3 · Offer Type — all locations */
  // Kenya: each individual offer, coloured by type (amber combo, violet deal)
  var ke = m.offers.filter(function(o){ return o.region==='Kenya'; }).sort(function(a,b){ return b.units-a.units; });
  mk('keChart', {
    type:'bar',
    data:{ labels:ke.map(function(o){return o.name;}), datasets:[{ label:'Units moved',
      data:ke.map(function(o){return o.units;}),
      backgroundColor:ke.map(function(o){ return o.offer_type==='combo' ? '#f59e0b' : '#a78bfa'; }), borderRadius:3 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:function(c){ return money(c.parsed.x)+' units ('+(ke[c.dataIndex].offer_type==='combo'?'combo':'power deal')+')'; } } } },
      scales:{ x:{ grid:{color:GRID} }, y:{ grid:{display:false}, ticks:{ autoSkip:false, font:{size:10}, color:'#cbd5e1' } } } }
  });
  // Sinza: every offer, coloured by type
  var sz = m.offers.filter(function(o){ return o.region==='Sinza'; }).sort(function(a,b){ return b.units-a.units; });
  var szCol = { combo:'#818cf8', single:'#22d3ee', special:'#f472b6' };
  mk('szChart', {
    type:'bar', plugins:[VAL],
    data:{ labels:sz.map(function(o){return o.name;}), datasets:[{ label:'Units moved',
      data:sz.map(function(o){return o.units;}),
      backgroundColor:sz.map(function(o){ return szCol[o.offer_type] || '#818cf8'; }), borderRadius:3 }] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:function(c){ return money(c.parsed.x)+' units ('+(sz[c.dataIndex].offer_type||'offer')+')'; } } } },
      scales:{ x:{ grid:{color:GRID} }, y:{ grid:{display:false}, ticks:{ autoSkip:false, font:{size:11}, color:'#cbd5e1' } } } }
  });
  // Uganda: top 5 + bottom 5 movers, units vs stock
  var ugAll = m.offers.filter(function(o){ return o.region==='Uganda'; }).sort(function(a,b){ return b.units-a.units; });
  var ug = (ugAll.length <= 10) ? ugAll : ugAll.slice(0,5).concat(ugAll.slice(-5));
  mk('ugChart', {
    type:'bar', plugins:[VAL],
    data:{ labels:ug.map(function(o){return o.name;}), datasets:[
      { label:'Units moved', data:ug.map(function(o){return o.units;}), backgroundColor:'#34d399', borderRadius:3 },
      { label:'Stock available', data:ug.map(function(o){return o.stock;}), backgroundColor:'#a78bfa', borderRadius:3 } ] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12 } },
        tooltip:{ callbacks:{ label:function(c){ return c.dataset.label+': '+money(c.parsed.x); },
          afterLabel:function(c){ return (ugAll.length>10 && c.dataIndex<5) ? 'Top mover' : (ugAll.length>10 ? 'Least mover' : ''); } } } },
      scales:{ x:{ grid:{color:GRID} }, y:{ grid:{display:false}, ticks:{ autoSkip:false, font:{size:11}, color:'#cbd5e1' } } } }
  });

  /* 4 · Posting */
  mk('pyChart', {
    type:'bar',
    data:{ labels:['Kenya','Sinza','Uganda'], datasets:[{ label:'Sales-achieved %',
      data:[d.posting_kenya_pct, d.posting_sinza_pct, d.posting_uganda_pct],
      backgroundColor:['#34d399','#818cf8','#fb923c'], borderRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:function(c){ return Number(c.parsed.y).toFixed(1)+'% of expected'; } } } },
      scales:{ y:{ beginAtZero:true, grid:{color:GRID}, ticks:{ callback:function(v){ return v+'%'; } } }, x:{ grid:{display:false} } } }
  });
  var posted = Number(d.posted_stock)||0, unposted = Number(d.unposted_stock)||0, tot = posted+unposted;
  mk('pyDonut', {
    type:'doughnut',
    data:{ labels:['Posted stock','Unposted (dead) stock'], datasets:[{ data:[posted, unposted], backgroundColor:['#34d399','#f87171'], borderWidth:0 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12 } },
        tooltip:{ callbacks:{ label:function(c){ return c.label+': '+money(c.parsed)+' bags'; } } } } },
    plugins:[ donutCentre(tot?Math.round(posted/tot*100)+'%':'—') ]
  });

  /* 5 · Timed offers — daily bags, offer window picked out in green so the
     lift reads off the bars rather than only off the headline percentage. */
  (m.timedOffers || []).forEach(function(c, i){
    var days = c.daily || [];
    if (!days.length) return;
    var base = Number(c.base_per_day), offer = Number(c.offer_per_day);
    mk('toLift'+i, {
      type:'bar',
      // Short axis labels ("1 Aug") — the full date lives in the tooltip title.
      data:{ labels:days.map(function(x){ return fmtDate(x.day).replace(/ \d{4}$/, ''); }), datasets:[{
        label:'Bags sold', data:days.map(function(x){ return x.bags; }),
        backgroundColor:days.map(function(x){ return x.in_offer ? '#34d399' : '#475569'; }),
        borderRadius:3 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false},
          tooltip:{ callbacks:{
            label:function(t){ return money(t.parsed.y)+' bags'; },
            afterLabel:function(t){
              var x = days[t.dataIndex];
              if (!x.in_offer) return isFinite(base) ? 'Pre-offer · baseline '+base.toFixed(1)+'/day' : 'Pre-offer';
              return isFinite(offer) ? 'Offer window · '+offer.toFixed(1)+'/day' : 'Offer window';
            } } } },
        scales:{ y:{ beginAtZero:true, grid:{color:GRID}, ticks:{ callback:function(v){ return money(v); } } },
                 x:{ grid:{display:false}, ticks:{ font:{size:10}, color:'#64748b', maxRotation:60, minRotation:60 } } } }
    });
  });

  /* 5b · Timed Offers — week-by-week bags/day (offer week green) */
  (m.timedOffers || []).forEach(function(c, i){
    var wks = c.weekly || [];
    if (!wks.length) return;
    mk('toWeek'+i, {
      type:'bar',
      data:{ labels:wks.map(function(w){ return w.label; }), datasets:[{
        label:'Bags/day', data:wks.map(function(w){ return w.per_day; }),
        backgroundColor:wks.map(function(w){ return w.in_offer ? '#34d399' : '#475569'; }),
        borderRadius:4 }] },
      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false},
          tooltip:{ callbacks:{
            title:function(t){ var w=wks[t[0].dataIndex]; return w.label+' ('+fmtDate(w.week_start).replace(/ \d{4}$/,'')+' → '+fmtDate(w.week_end).replace(/ \d{4}$/,'')+')'; },
            label:function(t){ var w=wks[t.dataIndex]; return [Number(w.per_day).toFixed(1)+' bags/day', money(w.total)+' over '+nf(w.days)+' days'+(w.in_offer?' · OFFER':'')]; } } } },
        scales:{ y:{ beginAtZero:true, grid:{color:GRID}, ticks:{ callback:function(v){ return money(v); } },
                     title:{display:true,text:'bags/day',color:'#64748b',font:{size:10}} },
                 x:{ grid:{display:false}, ticks:{ color:'#94a3b8' } } } }
    });
  });
}

function rgba(hex,a){ var h=hex.replace('#',''); return 'rgba('+parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16)+','+a+')'; }

/* ── Sidebar (page_sidebar.js): month picker + "In this report" ── */
// Sections follow what render() produced (Timed Offers / Self-Made only exist for some months).
function reportSections(){
  var out = [];
  var exec = document.querySelector('#report .exec');
  if (exec) out.push({ el: exec, num: '★', color: '#34d399', name: 'Bottom line' });
  document.querySelectorAll('#report .sec-head').forEach(function(h){
    var n = h.querySelector('.sec-num'), t = h.querySelector('h2');
    if (n && t) out.push({ el: h.parentElement, num: n.textContent, color: n.style.background, name: t.textContent.split(' — ')[0] });
  });
  return out;
}

function selectMonth(i){
  render(i);
  PageSidebar.setActive(String(i));
  PageSidebar.refresh();
  window.scrollTo({ top: 0 });
}

/* ── Boot ────────────────────────────────────────────────── */
(function(){
  var srcNote = document.getElementById('src-note');
  var foot = document.getElementById('foot');

  if(!MONTHS.length){
    document.getElementById('report').innerHTML =
      '<div class="empty"><h3>No months stored yet</h3>'
      + 'Run <b>python push_to_supabase.py</b> to back a month up, then <b>python history.py</b> to load it here.</div>';
    return;
  }

  srcNote.innerHTML = 'Source: <b>Supabase</b> · '+MONTHS.length+' month'+(MONTHS.length>1?'s':'')+' stored'
    + (DATA.generatedOn?' · last synced '+fmtDate(DATA.generatedOn):'');
  foot.textContent = 'Denri Africa · Marketing Dashboard — history read live from Supabase.';

  // Each month: a calendar tile, its name, and how close it closed to target.
  render(0);
  PageSidebar.init({
    content: '.wrap',
    label: 'Reporting history navigation',
    picker: {
      label: 'Months',
      active: '0',
      items: MONTHS.map(function(m,i){
        var pct = Number(m.monthly && m.monthly.achieved_pct) || 0;
        return { id: String(i), label: m.month+' '+m.year, tile: [String(m.month).slice(0,3).toUpperCase(), String(m.year)],
                 sub: pf(pct)+' of target', pct: pct, color: pct >= 100 ? '#34d399' : pct >= 80 ? '#fbbf24' : '#f87171' };
      }),
      onSelect: function(id){ selectMonth(Number(id)); }
    },
    sections: reportSections
  });
})();
</script>

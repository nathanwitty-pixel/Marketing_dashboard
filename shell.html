<!DOCTYPE html>
<html lang="en">
<head>
<meta name="darkreader-lock" /><!-- the dashboard has its own light/dark theme: stop the Dark Reader extension re-darkening it -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denri Africa · Marketing Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <script>
    // Theme before first paint (V5 light is the default; 'denri_theme' remembers the choice)
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('denri_theme') || 'light'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    })();
  </script>
  <script src="v5_theme.js"></script>
  <script src="top_nav.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Dashboard V5 tokens ─────────────────────────────────── */
    :root {
      --bg-app:      #f4f5fa;
      --bg-bar:      #ffffff;
      --bg-content:  #f4f5fa;
      --bg-raised:   #ffffff;
      --border:      #e4e7ef;
      --text-hi:     #0f172a;
      --text-mid:    #475569;
      --text-lo:     #64748b;
      --track:       #14161f;     /* dark pill track — same in both themes, as in V5 */
      --track-ink:   #a1a7bb;
      --accent:      #4f46e5;     /* V5 indigo */
      --accent-hi:   #6366f1;
      --accent-dim:  rgba(79,70,229,0.10);
      --live:        #10b981;     /* data-freshness dot stays semantic green */
      --shadow:      0 1px 2px rgba(16,24,40,0.04), 0 6px 18px rgba(16,24,40,0.06);
      --menu-shadow: 0 16px 40px rgba(16,24,40,0.14);
      --ease:        cubic-bezier(0.16, 1, 0.3, 1);
    }
    :root[data-theme="dark"] {
      --bg-app:      #0b0d14;
      --bg-bar:      #11131c;
      --bg-content:  #0f1117;
      --bg-raised:   #1a1d2b;
      --border:      #232738;
      --text-hi:     #f1f5f9;
      --text-mid:    #aab4c3;
      --text-lo:     #8a97a8;
      --track:       #1c1f2d;
      --accent-dim:  rgba(99,102,241,0.16);
      --shadow:      0 8px 24px rgba(0,0,0,0.3);
      --menu-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    html, body { height: 100%; overflow: hidden; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { background: var(--bg-app); color: var(--text-hi); display: flex; flex-direction: column; }

    /* ── Header row: brand · pill nav · status ───────────────── */
    .topbar {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.7rem 1.25rem; background: var(--bg-bar);
      border-bottom: 1px solid var(--border); flex-shrink: 0; min-width: 0;
    }
    .brand { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      background: linear-gradient(135deg, #4f46e5, #06b6d4);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.78rem; color: #fff; letter-spacing: 0.04em;
      box-shadow: 0 4px 12px rgba(79,70,229,0.35);
    }
    .brand-name { font-weight: 800; font-size: 0.92rem; letter-spacing: 0.01em; color: var(--text-hi); line-height: 1.15; }
    .brand-sub  { font-size: 0.64rem; color: var(--text-lo); letter-spacing: 0.02em; }

    /* The V5 signature: a dark pill track of tabs with an indigo active tab */
    .pillnav-wrap { flex: 1; min-width: 0; display: flex; justify-content: center; }
    .pillnav {
      display: flex; align-items: center; gap: 2px; max-width: 100%;
      background: var(--track); border-radius: 999px; padding: 4px;
      overflow-x: auto; box-shadow: 0 6px 18px rgba(16,24,40,0.12);   /* scroll bar + arrows: top_nav.js */
    }
    .tn-frame { display: flex; min-width: 0; max-width: 100%; border-radius: 999px; }   /* hugs the pill; carries the glow */
    .nav-item {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.46rem 0.85rem; border-radius: 999px;
      font-size: 0.74rem; font-weight: 600; white-space: nowrap;
      color: var(--track-ink); cursor: pointer; user-select: none; flex-shrink: 0;
      background: transparent; border: none; font-family: inherit;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }
    .nav-item:hover { color: #ffffff; background: rgba(255,255,255,0.07); }
    .nav-item.active { background: var(--accent); color: #ffffff; box-shadow: 0 4px 14px rgba(79,70,229,0.5); }
    .nav-icon { width: 14px; height: 14px; flex-shrink: 0; }
    .nav-sep { width: 1px; height: 16px; background: rgba(255,255,255,0.12); margin: 0 3px; flex-shrink: 0; }

    .topbar-right { display: flex; align-items: center; gap: 0.6rem; flex-shrink: 0; }
    .status {
      display: flex; align-items: center; gap: 0.45rem; margin-right: 0.35rem;
      padding: 0.5rem 0.85rem; border-radius: 999px; background: var(--bg-raised); border: 1px solid var(--border);
    }
    .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: dotPulse 1.8s ease-out infinite; }
    @keyframes dotPulse {
      0%   { box-shadow: 0 0 0 0 rgba(16,185,129,0.55); }
      70%  { box-shadow: 0 0 0 7px rgba(16,185,129,0); }
      100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
    }
    .dot-live.stale { background: #f59e0b; animation: none; }
    .topbar-time { font-size: 0.74rem; color: var(--text-mid); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

    .icon-btn {
      width: 36px; height: 36px; border-radius: 11px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-mid);
      cursor: pointer; text-decoration: none;
      transition: border-color 0.16s var(--ease), color 0.16s var(--ease);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

    .user { display: flex; align-items: center; gap: 0.55rem; }
    .avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #1e1b4b, #4f46e5); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 700;
    }
    .user-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
    .tu-name { font-size: 0.78rem; font-weight: 700; color: var(--text-hi); white-space: nowrap; }
    .tu-role { font-size: 0.62rem; color: var(--text-lo); white-space: nowrap; }

    /* ── Owner credit — Jonathan Owiti, the person behind the dashboard ──
       Shimmering gradient name + twinkling spark, a slowly turning ring on the avatar and the
       title as a gradient-bordered pill. Darker gradient stops in light theme keep it readable. */
    :root { --own-a: #4f46e5; --own-b: #0e7490; --own-c: #047857; --own-glow: rgba(79,70,229,0.28); }
    :root[data-theme="dark"] { --own-a: #818cf8; --own-b: #22d3ee; --own-c: #34d399; --own-glow: rgba(99,102,241,0.45); }
    @property --own-spin { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
    .owner-avatar { position: relative; isolation: isolate; box-shadow: 0 0 0 2px var(--bg-bar), 0 0 16px var(--own-glow); }
    .owner-avatar::before {
      content: ''; position: absolute; inset: -4px; border-radius: 50%; z-index: -1;
      background: conic-gradient(from var(--own-spin), var(--own-a), var(--own-b), var(--own-c), var(--own-a));
      animation: ownSpin 6s linear infinite;
    }
    .owner-name {
      font-weight: 800; letter-spacing: 0.01em;
      background: linear-gradient(90deg, var(--own-a), var(--own-b), var(--own-c), var(--own-b), var(--own-a));
      background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: ownShimmer 6s linear infinite;
    }
    .owner-spark { display: inline-block; margin-left: 0.3rem; color: #f59e0b; font-size: 0.9em; -webkit-text-fill-color: #f59e0b;
                   animation: ownTwinkle 2.4s ease-in-out infinite; }
    .owner-role {
      display: inline-block; margin-top: 3px; padding: 0.12rem 0.5rem; border-radius: 999px;
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.02em; color: var(--text-mid); white-space: nowrap;
      border: 1px solid transparent;
      background: linear-gradient(var(--bg-raised), var(--bg-raised)) padding-box,
                  linear-gradient(90deg, var(--own-a), var(--own-b), var(--own-c)) border-box;
    }
    .owner-role .role-short { display: none; }
    @keyframes ownSpin { to { --own-spin: 360deg; } }
    @keyframes ownShimmer { to { background-position: 200% center; } }
    @keyframes ownTwinkle {
      0%, 100% { opacity: 0.6; transform: scale(0.85) rotate(0deg); }
      50%      { opacity: 1; transform: scale(1.15) rotate(20deg); text-shadow: 0 0 8px rgba(245,158,11,0.75); }
    }
    @media (prefers-reduced-motion: reduce) {
      .owner-avatar::before, .owner-name, .owner-spark { animation: none !important; }
      .owner-spark { opacity: 1; }
    }

    /* Theme switch — a small dark pill, like V5's "Dashboard 1 / Dashboard 2" */
    .theme-pill { display: inline-flex; background: var(--track); border-radius: 999px; padding: 3px; flex-shrink: 0; }
    .theme-opt {
      display: inline-flex; align-items: center; gap: 0.3rem;
      padding: 0.36rem 0.7rem; border-radius: 999px; border: none; background: transparent;
      font-family: inherit; font-size: 0.7rem; font-weight: 600; color: var(--track-ink); cursor: pointer;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }
    .theme-opt:hover { color: #fff; }
    .theme-opt[aria-pressed="true"] { background: var(--accent); color: #fff; }

    /* ── Title row: page title · actions ─────────────────────── */
    .pagebar {
      display: flex; align-items: center; gap: 1rem;
      padding: 0.95rem 1.5rem 0.85rem; flex-shrink: 0; min-width: 0;
    }
    .page-titles { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    h1#page-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; color: var(--text-hi);
                    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-purpose { font-size: 0.74rem; color: var(--text-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .page-actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }

    .btn-ref {
      display: inline-flex; align-items: center; gap: 0.4rem;
      padding: 0.52rem 0.95rem; border-radius: 999px;
      background: var(--bg-raised); border: 1px solid var(--border); color: var(--text-mid);
      font-family: inherit; font-size: 0.74rem; font-weight: 600; cursor: pointer;
      transition: border-color 0.16s var(--ease), color 0.16s var(--ease), background 0.16s var(--ease), transform 0.16s var(--ease);
    }
    .btn-ref:hover { border-color: var(--accent); color: var(--accent); }
    .btn-ref.spinning svg { animation: spin 0.6s linear infinite; }
    /* One clear primary action, V5-style: solid indigo pill */
    #btn-export { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 6px 16px rgba(79,70,229,0.35); }
    #btn-export:hover { background: var(--accent-hi); border-color: var(--accent-hi); color: #fff; transform: translateY(-1px); }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Export dropdown ─────────────────────────────────────── */
    .export-wrap { position: relative; }
    .export-menu {
      position: absolute; top: calc(100% + 8px); right: 0;
      background: var(--bg-raised); border: 1px solid var(--border);
      border-radius: 14px; padding: 0.35rem; min-width: 190px;
      box-shadow: var(--menu-shadow); display: none; z-index: 50;
    }
    .export-menu.open { display: block; }
    .export-item {
      display: flex; align-items: center; gap: 0.55rem;
      width: 100%; padding: 0.5rem 0.6rem;
      background: transparent; border: none; border-radius: 9px;
      color: var(--text-mid); font-family: inherit; font-size: 0.74rem; text-align: left;
      cursor: pointer; transition: background 0.16s var(--ease), color 0.16s var(--ease);
    }
    .export-item:hover { background: var(--accent-dim); color: var(--text-hi); }
    .export-item .fmt {
      font-size: 0.55rem; font-weight: 800; letter-spacing: 0.05em;
      padding: 0.14rem 0.35rem; border-radius: 5px; flex-shrink: 0; min-width: 34px; text-align: center;
    }
    .fmt-pdf { background: rgba(239,68,68,0.14);  color: #dc2626; }
    .fmt-doc { background: rgba(59,130,246,0.14); color: #2563eb; }
    .fmt-xls { background: rgba(16,185,129,0.14); color: #059669; }
    :root[data-theme="dark"] .fmt-pdf { color: #fca5a5; }
    :root[data-theme="dark"] .fmt-doc { color: #93c5fd; }
    :root[data-theme="dark"] .fmt-xls { color: #6ee7b7; }

    /* ── Content: the page sits in a rounded V5 canvas ───────── */
    .content {
      flex: 1; min-height: 0; position: relative; overflow: hidden;
      margin: 0 1.25rem 1.25rem; border-radius: 20px;
      background: var(--bg-content); border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    #dash-frame { width: 100%; height: 100%; border: none; display: block; background: var(--bg-content); }

    .overlay {
      position: absolute; inset: 0; background: var(--bg-content);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; opacity: 0; pointer-events: none; transition: opacity 0.18s;
    }
    .overlay.show { opacity: 1; pointer-events: all; }
    .spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.65s linear infinite; }
    .overlay-text { font-size: 0.76rem; color: var(--text-lo); text-align: center; }

    /* Visible keyboard focus on every interactive control */
    .btn-ref:focus-visible, .export-item:focus-visible, .nav-item:focus-visible,
    .icon-btn:focus-visible, .theme-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* ── Responsive ──────────────────────────────────────────── */
    /* Crowded widths (all ten tabs share the header row): keep the name, shorten the title pill */
    @media (max-width: 1600px) and (min-width: 1341px) {
      .owner-role .role-full { display: none; }
      .owner-role .role-short { display: inline; }
    }
    @media (max-width: 1560px) {
      .pillnav .nav-icon { display: none; }            /* labels only — keeps all 10 tabs in view */
      .nav-item { padding: 0.46rem 0.72rem; }
    }
    @media (max-width: 900px)  { .status { display: none; } }
    @media (max-width: 1340px) {
      /* Pill nav drops to its own full-width row */
      .topbar { flex-wrap: wrap; row-gap: 0.6rem; }
      .pillnav-wrap { order: 3; flex-basis: 100%; justify-content: flex-start; }
      .topbar-right { margin-left: auto; }
    }
    @media (max-width: 940px) {
      /* Tabs scroll inside the pill; the fade says "there's more" */
      .pillnav { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
    }
    @media (max-width: 640px) {
      .topbar { padding: 0.6rem 1rem; }
      .brand-sub, .user .avatar, .status, .user .owner-role { display: none; }
      .theme-opt .lbl { display: none; }
      .pagebar { padding: 0.75rem 1rem 0.6rem; }
      h1#page-title { font-size: 1.05rem; }
      .topbar-purpose { display: none; }
      .btn-ref { padding: 0 0.8rem; min-height: 44px; }
      .btn-ref .lbl { display: none; }
      .nav-item { min-height: 40px; }
      .icon-btn, .theme-opt { min-height: 40px; min-width: 40px; justify-content: center; }
      .export-item { min-height: 44px; }
      .content { margin: 0 0.5rem 0.5rem; border-radius: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .12s !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

  <div class="topbar-right">
    <div class="theme-pill" role="group" aria-label="Colour theme">

        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>

    </a>

<div class="pagebar">

        <button class="export-item" onclick="exportWord()"><span class="fmt fmt-doc">DOC</span> Word — colour on white</button>
        <button class="export-item" onclick="exportExcel()"><span class="fmt fmt-xls">XLS</span> Excel workbook</button>

<main class="content">
  <iframe id="dash-frame" src="current_performance.html" title="Dashboard page"></iframe>
  <div class="overlay show" id="overlay">
    <div class="spinner"></div>
    <div class="overlay-text" id="overlay-text">Loading…</div>
  </div>
</main>

<script>
  var frame   = document.getElementById('dash-frame');
  var overlay = document.getElementById('overlay');
  var titleEl = document.getElementById('page-title');
  var clockEl = document.getElementById('clock');
  var btnRef  = document.getElementById('btn-ref');

  // ── Theme (V5 light default / dark) ──────────────────────
  // The shell recolours itself via :root[data-theme]; each page inside the iframe is themed by
  // v5_theme.js on load. Light is applied in place; going back to dark reloads the page so it
  // shows its native colours again.
  function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function syncThemeButtons() {
    var t = currentTheme();
    document.querySelectorAll('.theme-opt').forEach(function(b) {
      b.setAttribute('aria-pressed', b.dataset.mode === t ? 'true' : 'false');
    });
  }
  function themeFrame() {
    var doc;
    try { doc = frame.contentDocument; } catch (e) { return; }
    if (!doc || !window.V5Theme || /^about:/.test(doc.URL)) return;
    try { window.V5Theme.apply(doc, currentTheme()); } catch (e) { console.error('V5 theme:', e); }
  }
  function setTheme(mode) {
    var prev = currentTheme();
    if (mode === prev) return;
    document.documentElement.setAttribute('data-theme', mode);
    try { localStorage.setItem('denri_theme', mode); } catch (e) {}
    syncThemeButtons();
    if (mode === 'light') { themeFrame(); return; }
    overlay.classList.add('show');
    document.getElementById('overlay-text').textContent = 'Switching to dark…';
    frame.src = bust(decodeURIComponent(frame.src.split('/').pop().split('?')[0]));
  }
  syncThemeButtons();

  // Append a cache-busting timestamp so the browser never serves a stale iframe
  function bust(file) {
    return file + '?_ts=' + Date.now();
  }

  // One-line purpose statement per page (anchors the H1 for scanability + a11y).
  var PAGE_PURPOSE = {
    'current_performance.html': 'Month-to-date sales vs target — live from Odoo POS & Sheets',
    'new_products.html':        'How this month’s new bags are selling',
    'timed_offers.html':        'Live timed-offer campaigns and the sales lift they drive',
    'self_made_combos.html':    'Running vs self-made combos, per market',
    'bags_on_offer.html':       'Offer vs non-offer bag revenue, and shops vs their Odoo target',
    'POSTING (SALES YIELDS FROM ACCURATE POSTING).html': 'Sales yield earned from accurate marketing posting',
    'shops_efficiency.html':    'Per-shop dispatch, stock and sell-through',
    'insights.html':            'Automated read-outs across the dashboards',
    'monthly_report.html':      'The month’s report, targets and commentary',
    'history.html':             'Archived monthly reports from Supabase',
  };
  var purposeEl = document.getElementById('page-purpose');
  function setPurpose(src) {
    if (purposeEl) purposeEl.textContent = PAGE_PURPOSE[src] || '';
  }

  // ── Nav from dashboard_pages.json — the ONE page list, shared with streamlit_app.py ──
  // Rebuilds the pill nav, the purposes and the owner credit from the manifest; the baked
  // buttons above stay as the fallback when it can't be fetched (e.g. shell opened from disk).
  function escAttr(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  fetch('dashboard_pages.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (m) {
    var nav = document.querySelector('.pillnav');
    if (!nav || !m || !m.pages || !m.pages.length) return;
    var icons = {}, generic = '';
    nav.querySelectorAll('.nav-item').forEach(function (b) {
      var svg = b.querySelector('svg');
      if (svg) { icons[b.dataset.src] = svg.outerHTML; if (!generic) generic = svg.outerHTML; }
    });
    var cur = decodeURIComponent(frame.src.split('/').pop().split('?')[0]), html = '', last = null;
    m.pages.slice().sort(function (a, b) { return a.order - b.order; }).forEach(function (p) {
      if (last !== null && p.section !== last) html += '<span class="nav-sep" aria-hidden="true"></span>';
      last = p.section;
      var on = p.html === cur;
      html += '<button class="nav-item' + (on ? ' active" aria-current="page' : '') + '" data-src="' + escAttr(p.html) + '" data-title="' + escAttr(p.title) +
              '" title="' + escAttr(p.purpose) + '" onclick="navigate(this)">' + (icons[p.html] || generic) + escAttr(p.short || p.label) + '</button>';
      PAGE_PURPOSE[p.html] = p.purpose;
    });
    nav.innerHTML = html;
    if (window.TopNav) TopNav.reveal(nav);   // keep the current tab in view after the rebuild
    setPurpose(cur);
    var o = m.owner || {};
    if (o.name) {
      var n = document.querySelector('.owner-name'), fu = document.querySelector('.owner-role .role-full'),
          sh = document.querySelector('.owner-role .role-short'), av = document.querySelector('.owner-avatar'), u = document.querySelector('.user');
      if (n && n.firstChild) n.firstChild.nodeValue = o.name;
      if (fu && o.title) fu.textContent = o.title;
      if (sh && o.title_short) sh.textContent = o.title_short;
      if (av && o.initials) av.textContent = o.initials;
      if (u) u.title = 'Built and maintained by ' + o.name + (o.title ? ', ' + o.title : '');
    }
  }).catch(function () { /* keep the baked nav */ });

  // Tabs scroll left ↔ right: wheel, drag, ‹ › arrows (top_nav.js)
  if (window.TopNav) TopNav.attach(document.querySelector('.pillnav'));

  function navigate(el) {
    document.querySelectorAll('.nav-item').forEach(function(n){ n.classList.remove('active'); n.removeAttribute('aria-current'); });
    el.classList.add('active');
    el.setAttribute('aria-current', 'page');
    if (el.scrollIntoView) el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });   // keep the tab visible in a scrolled pill nav
    var title = el.dataset.title;
    titleEl.textContent = title;
    setPurpose(el.dataset.src);
    document.getElementById('overlay-text').textContent = 'Loading ' + title + '…';
    overlay.classList.add('show');
    frame.src = bust(el.dataset.src);
  }

  var SCRIPT_MAP = {
    'current_performance.html':                             'current_performance.html',
    'new_products.html':                                    'new_products.html',
    'timed_offers.html':                                    'timed_offers.html',
    'self_made_combos.html':                                'self_made_combos.html',
    'bags_on_offer.html':                                   'bags_on_offer.html',
    'POSTING (SALES YIELDS FROM ACCURATE POSTING).html':   'POSTING (SALES YIELDS FROM ACCURATE POSTING).html',
    'forward_projections.html':                             'forward_projections.html',
    'shops_efficiency.html':                                'shops_efficiency.html',
    'insights.html':                                        'insights.html',
    'history.html':                                         'history.html',
  };

  function reloadFrame() {
    overlay.classList.add('show');
    btnRef.classList.add('spinning');

    var filename = decodeURIComponent(frame.src.split('/').pop().split('?')[0]);
    var hasDashboard = Object.prototype.hasOwnProperty.call(SCRIPT_MAP, filename);

    if (hasDashboard) {
      document.getElementById('overlay-text').textContent = 'Refreshing data…';
      fetch('/api/refresh?dashboard=' + encodeURIComponent(filename) + '&_ts=' + Date.now())
        .then(function(r) { return r.json(); })
        .then(function(data) {
          // Deployed (Vercel): /api/refresh dispatches the cloud rebuild — it isn't
          // instant, so wait out the run + redeploy, then reload THIS page only.
          if (data && data.dispatched) {
            var eta = (data.etaSeconds || 210);
            var mins = Math.max(1, Math.round(eta / 60));
            btnRef.classList.remove('spinning');
            document.getElementById('overlay-text').innerHTML =
              (data.message || 'Refreshing from Odoo…') +
              '<br><span style="opacity:.75;font-size:0.92em">Fresh data in ~' + mins +
              ' min — this page reloads itself.</span>';
            setTimeout(function() { overlay.classList.remove('show'); }, 6000);   // let them keep viewing
            setTimeout(function() {
              overlay.classList.add('show');
              document.getElementById('overlay-text').textContent = 'Loading fresh data…';
              frame.src = bust(filename);                                          // reload current page only
            }, (eta + 45) * 1000);
            return;
          }
          // Local (main.py): the generator already ran — reload now.
          document.getElementById('overlay-text').textContent = 'Loading…';
          if (data && data.ok) {
            frame.src = 'about:blank';
            setTimeout(function() { frame.src = bust(filename); }, 80);
          } else {
            overlay.classList.remove('show');
            btnRef.classList.remove('spinning');
            alert('Refresh failed:\n' + ((data && data.error) || 'unknown error'));
          }
        })
        .catch(function() {
          frame.src = 'about:blank';
          setTimeout(function() { frame.src = bust(filename); }, 80);
        });
    } else {
      frame.src = 'about:blank';
      setTimeout(function() { frame.src = bust(filename); }, 80);
    }
  }

  // Theme the page first, then lift the overlay, so it never flashes the old colours.
  frame.addEventListener('load', function() {
    if (/^about:/.test(frame.src)) return;   // refresh bounces through about:blank
    themeFrame();
    overlay.classList.remove('show');
    btnRef.classList.remove('spinning');
  });

  // Clock
  function tick() {
    var now = new Date();
    var h = now.getHours().toString().padStart(2,'0');
    var m = now.getMinutes().toString().padStart(2,'0');
    var s = now.getSeconds().toString().padStart(2,'0');
    var days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    var mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    var dateStr = days[now.getDay()] + ', ' + now.getDate() + ' ' + mons[now.getMonth()] + ' ' + now.getFullYear();
    clockEl.textContent = dateStr + ' · ' + h + ':' + m + ':' + s;
  }
  tick();
  setInterval(tick, 1000);   // live ticking

  /* ── Export (PDF / Word / Excel) ─────────────────────────── */

  var exportMenu = document.getElementById('export-menu');

  function toggleExportMenu(e) {
    e.stopPropagation();
    exportMenu.classList.toggle('open');
  }
  document.addEventListener('click', function() {
    exportMenu.classList.remove('open');
  });

  function exportFileName(ext) {
    var page = titleEl.textContent.replace(/[^\w]+/g, '_').replace(/^_+|_+$/g, '');
    var d = new Date();
    var stamp = d.getFullYear() + '-' +
                String(d.getMonth() + 1).padStart(2, '0') + '-' +
                String(d.getDate()).padStart(2, '0');
    return 'Denri_' + page + '_' + stamp + '.' + ext;
  }

  function downloadBlob(content, mime, filename) {
    var blob = new Blob([content], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(a.href); }, 5000);
  }

  /* ── Colour helpers for the Word (paper) export ──────────── */

  function parseRGB(s) {
    var m = String(s).match(/rgba?\(([\d.]+)[, ]+([\d.]+)[, ]+([\d.]+)(?:[,/ ]+([\d.]+))?\)/);
    if (!m) return null;
    return { r: +m[1], g: +m[2], b: +m[3], a: m[4] === undefined ? 1 : +m[4] };
  }

  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    var h = 0, s = 0, l = (mx + mn) / 2, d = mx - mn;
    if (d) {
      s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      switch (mx) {
        case r: h = (g - b) / d + (g < b ? 6 : 0); break;
        case g: h = (b - r) / d + 2; break;
        default: h = (r - g) / d + 4;
      }
      h *= 60;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
  }

  function hslCss(h, s, l, a) {
    return 'hsla(' + h + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')';
  }

  // Convert one on-screen colour to its paper (white background) version.
  // kind: 'text' | 'bg' | 'border'
  function paperColor(cssColor, kind) {
    var c = parseRGB(cssColor);
    if (!c || c.a < 0.05) return null;
    var hsl = rgbToHsl(c.r, c.g, c.b), h = hsl[0], s = hsl[1], l = hsl[2];

    if (kind === 'bg') {
      if (s < 30) return l < 60 ? '#ffffff' : null;   // dark surface → white
      if (c.a < 0.6) return null;                     // coloured tint → keep
      if (l < 45) return hslCss(h, s, 92);            // solid dark chroma → pale tint
      return null;
    }
    if (kind === 'border') {
      if (s < 30) return l < 70 ? '#d1d5db' : null;   // dark border → light grey
      return hslCss(h, Math.min(s, 60), 70, c.a);
    }
    // text: neutrals invert (light grey → dark grey); colours keep their
    // hue but darken enough to read on white
    if (s < 20) return hslCss(0, 0, Math.max(10, Math.min(45, 100 - l)));
    return hslCss(h, s, Math.min(l, 40));
  }

  // Walk source + clone in lockstep and inline paper-adjusted colours.
  function colorizeForPaper(srcDoc, clone) {
    var src = srcDoc.querySelectorAll('*');
    var dst = clone.querySelectorAll('*');
    var n = Math.min(src.length, dst.length);
    var view = srcDoc.defaultView;

    for (var i = 0; i < n; i++) {
      var cs = view.getComputedStyle(src[i]);
      if (cs.display === 'none') continue;

      var hasGradient = cs.backgroundImage && cs.backgroundImage !== 'none';
      if (hasGradient) {
        // Word can't render CSS gradients — flatten to the gradient's
        // first colour and keep the original (usually white) text
        var gm = cs.backgroundImage.match(/rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}/);
        if (gm) {
          dst[i].style.setProperty('background-image', 'none', 'important');
          dst[i].style.setProperty('background-color', gm[0], 'important');
        }
      } else {
        var t = paperColor(cs.color, 'text');
        if (t) dst[i].style.setProperty('color', t, 'important');
      }

      var bg = paperColor(cs.backgroundColor, 'bg');
      if (bg) dst[i].style.setProperty('background-color', bg, 'important');

      if (parseFloat(cs.borderTopWidth) > 0) {
        var bc = paperColor(cs.borderTopColor, 'border');
        if (bc) dst[i].style.setProperty('border-color', bc, 'important');
      }
    }
  }

  // First opaque background behind a chart canvas (white card in V5 light, dark tile in dark).
  function chartTileColor(doc, el) {
    var view = doc.defaultView;
    for (var n = el; n && n.nodeType === 1; n = n.parentElement) {
      var c = parseRGB(view.getComputedStyle(n).backgroundColor);
      if (c && c.a > 0.5) return 'rgb(' + c.r + ',' + c.g + ',' + c.b + ')';
    }
    return currentTheme() === 'dark' ? '#1e2130' : '#ffffff';
  }

  // Clone the live dashboard, snapshot charts to images, strip scripts.
  // mode: 'dark' keeps the on-screen theme; 'paper' converts to white
  // background with readable full-colour accents.
  function buildExportDoc(mode) {
    var doc = frame.contentDocument;
    if (!doc || !doc.body) { alert('Dashboard not loaded yet.'); return null; }

    var clone = doc.documentElement.cloneNode(true);

    // Colour walk must happen while source and clone have identical
    // element lists — before canvas swaps and script removal
    if (mode === 'paper') colorizeForPaper(doc, clone);

    var srcCanvases   = doc.querySelectorAll('canvas');
    var cloneCanvases = clone.querySelectorAll('canvas');
    srcCanvases.forEach(function(cv, i) {
      if (!cloneCanvases[i]) return;
      try {
        var backing = document.createElement('canvas');
        backing.width  = cv.width;
        backing.height = cv.height;
        var ctx = backing.getContext('2d');
        ctx.fillStyle = chartTileColor(doc, cv);   // charts keep the tile colour they sit on
        ctx.fillRect(0, 0, backing.width, backing.height);
        ctx.drawImage(cv, 0, 0);
        var img = document.createElement('img');
        img.src = backing.toDataURL('image/png');
        img.style.maxWidth = '100%';
        cloneCanvases[i].parentNode.replaceChild(img, cloneCanvases[i]);
      } catch (err) { /* tainted/empty canvas — skip */ }
    });

    clone.querySelectorAll('script').forEach(function(s) { s.remove(); });

    var style = document.createElement('style');
    var common =
      '.card-reveal,.s1-reveal{animation:none!important;opacity:1!important;transform:none!important}' +
      '.filter-bar,select,input,button,[data-export-hide]{display:none!important}' +
      'body{display:block!important;min-height:auto!important}';
    if (mode === 'paper') {
      style.textContent = common +
        'body{background:#ffffff!important;padding:24px!important}' +
        '*{text-shadow:none!important;box-shadow:none!important}';
    } else {
      // exact on-screen colours — force browsers to print backgrounds
      style.textContent = common +
        '*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}' +
        '@page{margin:8mm}';
    }
    (clone.querySelector('head') || clone).appendChild(style);

    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  function exportPDF() {
    var html = buildExportDoc('dark');   // full colour, exactly as on screen
    if (!html) return;
    var w = window.open('', '_blank');
    if (!w) { alert('Pop-up blocked — allow pop-ups to export PDF.'); return; }
    w.document.write(html);
    w.document.close();
    setTimeout(function() {
      w.focus();
      w.print();   // user picks "Save as PDF" in the dialog
    }, 400);
  }

  function exportWord() {
    var html = buildExportDoc('paper');  // white paper, colour accents kept
    if (!html) return;
    downloadBlob(html, 'application/msword', exportFileName('doc'));
  }

  /* Excel: KPI cards become a "KPIs" sheet; every table gets its own sheet */

  function xmlEsc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function xlCell(text) {
    var t = String(text).trim();
    var num = t.replace(/,/g, '');
    if (/^-?\d+(\.\d+)?$/.test(num) && num !== '') {
      return '<Cell><Data ss:Type="Number">' + num + '</Data></Cell>';
    }
    return '<Cell><Data ss:Type="String">' + xmlEsc(t) + '</Data></Cell>';
  }

  function xlSheetName(raw, used, fallback) {
    var name = String(raw || fallback).replace(/[\[\]:*?\/\\]/g, ' ')
                 .replace(/\s+/g, ' ').trim().slice(0, 31) || fallback;
    var base = name, n = 2;
    while (used.indexOf(name) !== -1) {
      name = (base.slice(0, 28) + ' ' + n++);
    }
    used.push(name);
    return name;
  }

  function exportExcel() {
    var doc = frame.contentDocument;
    if (!doc || !doc.body) { alert('Dashboard not loaded yet.'); return; }

    var used = [];
    var sheets = '';

    // ── Sheet 1: KPI cards (label / value / note) ──
    var kpiRows = '';
    doc.querySelectorAll('.card, .kpi').forEach(function(card) {
      var label = card.querySelector('.card-label, .kpi-label');
      var value = card.querySelector('.card-value, .kpi-value');
      if (!label || !value) return;
      var note = card.querySelector('.card-interpretation, .kpi-sub, .card-sub');
      kpiRows += '<Row>' + xlCell(label.textContent) + xlCell(value.textContent) +
                 xlCell(note ? note.textContent : '') + '</Row>';
    });
    if (kpiRows) {
      sheets += '<Worksheet ss:Name="' + xmlEsc(xlSheetName('KPIs', used, 'KPIs')) + '"><Table>' +
                '<Row>' + xlCell('Metric') + xlCell('Value') + xlCell('Notes') + '</Row>' +
                kpiRows + '</Table></Worksheet>';
    }

    // ── One sheet per table ──
    doc.querySelectorAll('table').forEach(function(tbl, idx) {
      var rows = '';
      tbl.querySelectorAll('tr').forEach(function(tr) {
        var cells = tr.querySelectorAll('th, td');
        if (!cells.length) return;
        var r = '<Row>';
        cells.forEach(function(c) { r += xlCell(c.textContent); });
        rows += r + '</Row>';
      });
      if (!rows) return;

      var wrap  = tbl.closest('.table-wrap');
      var title = wrap ? wrap.querySelector('.table-title') : null;
      var name  = xlSheetName(title ? title.textContent : '', used, 'Table ' + (idx + 1));
      sheets += '<Worksheet ss:Name="' + xmlEsc(name) + '"><Table>' + rows + '</Table></Worksheet>';
    });

    if (!sheets) { alert('Nothing found to export on this page.'); return; }

    var workbook =
      '<?xml version="1.0"?>' +
      '<?mso-application progid="Excel.Sheet"?>' +
      '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" ' +
      'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">' +
      sheets + '</Workbook>';

    downloadBlob(workbook, 'application/vnd.ms-excel', exportFileName('xls'));
  }
</script>

</body>
</html>

<script>
  function fmt(n) { return (typeof n === 'number') ? n.toLocaleString() : (n || '—'); }

  function pctColor(tone) {
    return { good: 'tone-good', warn: 'tone-warn', sold: 'tone-sold', info: 'tone-info' }[tone] || 'tone-info';
  }
  function barColor(tone) {
    return { good: 'bar-good', warn: 'bar-warn', sold: 'bar-sold', info: 'bar-info' }[tone] || 'bar-info';
  }
  function pctNum(s) { return parseFloat(String(s).replace('%','')) || 0; }

  /* Summary table: metric | total | target | actual % (bar) | current week % */
  function summaryTable(period, periodLabel) {
    var rows = period.summary.map(function(r) {
      var barW = Math.min(pctNum(r.actualPct), 100);
      var tcls = pctColor(r.tone), bcls = barColor(r.tone);
      return '<tr>' +
        '<td><span class="sum-metric">' + r.metric + '</span>' +
          '<span class="sum-desc">' + r.desc + '</span></td>' +
        '<td>' + fmt(r.actual) + (r.target != null ? ' <span class="muted">/ ' + fmt(r.target) + '</span>' : '') + '</td>' +
        '<td class="muted">' + r.targetPct + '</td>' +
        '<td class="bar-cell"><div class="bar-track"><div class="bar-fill ' + bcls + '" style="width:' + barW + '%"></div></div>' +
          '<span class="pct-strong ' + tcls + '">' + r.actualPct + '</span></td>' +
        '<td class="pct-strong ' + tcls + '">' + r.currentPct + '</td>' +
      '</tr>';
    }).join('');

    return '<div class="block-title">' + periodLabel + ' Target vs Actual</div>' +
      '<div class="table-wrap"><table class="sum-table"><thead><tr>' +
      '<th>Metric</th><th>Actual / Target</th><th>Target %</th><th>Actual %</th><th>Current %</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* Per-shop table: metric rows x shop columns + TOTAL column */
  function perShopTable(period, periodLabel) {
    return groupTable(period.metrics, period.shops, 'byShop', periodLabel + ' — Per Shop Breakdown');
  }

  function chartCard(id, label) {
    return '<div class="card"><div class="card-label">' + label + '</div>' +
      '<div style="position:relative;height:260px"><canvas id="' + id + '"></canvas></div></div>';
  }

  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* Colour a rate against a target. dir='up' → higher is better. */
  function rateClass(val, good, mid, dir) {
    if (val == null) return 'rate-na';
    if (dir === 'down') { // lower is better (e.g. remaining rate)
      if (val <= good) return 'rate-good';
      if (val <= mid)  return 'rate-mid';
      return 'rate-bad';
    }
    if (val >= good) return 'rate-good';
    if (val >= mid)  return 'rate-mid';
    return 'rate-bad';
  }
  function rate(val, good, mid, dir) {
    if (val == null) return '<span class="rate-na">n/a</span>';
    return '<span class="' + rateClass(val, good, mid, dir) + '">' + val.toFixed(1) + '%</span>';
  }
  function scoreColor(s) { return s >= 60 ? '#10b981' : s >= 35 ? '#f59e0b' : '#ef4444'; }

  /* Performance ranked by score. unit = 'Shop' or 'Region'. */
  function performanceTable(perf, title, unit) {
    var rows = (perf || []).map(function(p) {
      var rcls = p.rank <= 3 ? ('rank-' + p.rank) : '';
      return '<tr>' +
        '<td><span class="rank-badge ' + rcls + '">' + p.rank + '</span></td>' +
        '<td><span class="perf-shop">' + esc(p.name) + '</span></td>' +
        '<td>' + rate(p.sellThrough, 20, 10, 'up') + '</td>' +
        '<td>' + rate(p.dispatchConv, 90, 60, 'up') + '</td>' +
        '<td>' + rate(p.remainingRate, 10, 30, 'down') + '</td>' +
        '<td>' + fmt(p.sold) + '</td>' +
        '<td>' + fmt(p.atShop) + '</td>' +
        '<td class="score-cell"><div class="score-track"><div class="score-fill" style="width:' +
          Math.min(p.score, 100) + '%;background:' + scoreColor(p.score) + '"></div></div>' +
          '<span style="font-weight:800;color:' + scoreColor(p.score) + '">' + p.score.toFixed(1) + '</span></td>' +
      '</tr>';
    }).join('');
    return '<div class="block-title">' + title + '</div>' +
      '<div class="table-wrap"><table class="perf-table"><thead><tr>' +
        '<th>#</th><th>' + unit + '</th><th>Sell-through</th><th>Dispatch conv.</th>' +
        '<th>Remaining rate</th><th>Sold</th><th>At ' + unit.toLowerCase() + '</th><th>Score</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  /* Generic metric×group table (group = shop or region) */
  function groupTable(metrics, groups, byField, title) {
    var head = '<th>Metric</th><th class="col-total">TOTAL</th>' +
      groups.map(function(g){ return '<th>' + esc(g) + '</th>'; }).join('');
    var body = (metrics || []).map(function(m) {
      var d = m[byField] || {};
      var cells = groups.map(function(g){ return '<td>' + fmt(d[g] || 0) + '</td>'; }).join('');
      return '<tr><td>' + m.metric + '</td><td class="col-total">' + fmt(m.total) + '</td>' + cells + '</tr>';
    }).join('');
    return '<div class="block-title">' + title + '</div>' +
      '<div class="table-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  }

  /* Filterable STOCKS REMAINING detail table (per period) */
  function detailSection(period, key, label) {
    function opts(field) {
      var seen = {};
      (period.remainingDetail || []).forEach(function(r){ if (r[field]) seen[r[field]] = 1; });
      return Object.keys(seen).sort().map(function(v){
        return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
      }).join('');
    }
    return '<div class="block-title">' + label + ' — Stocks Remaining After Dispatch (filterable)</div>' +
      '<div class="table-wrap">' +
        '<div class="filter-bar">' +
          '<select id="f-' + key + '-shop"><option value="">All Shops</option>' + opts('shop') + '</select>' +
          '<select id="f-' + key + '-category"><option value="">All Categories</option>' + opts('category') + '</select>' +
          '<select id="f-' + key + '-bagType"><option value="">All Bag Types</option>' + opts('bagType') + '</select>' +
          '<select id="f-' + key + '-colour"><option value="">All Colours</option>' + opts('colour') + '</select>' +
          '<input id="f-' + key + '-product" type="text" placeholder="Product name…" />' +
          '<span class="filter-count" id="f-' + key + '-count">0</span>' +
          '<button class="reset" id="f-' + key + '-reset">Reset</button>' +
        '</div>' +
        '<table class="detail-table"><thead><tr>' +
          '<th>Shop</th><th>Colour</th><th>Category</th><th>Product</th><th>Bag Type</th>' +
          '<th>Dispatched</th><th>Sold</th><th>Remaining</th>' +
        '</tr></thead><tbody id="detail-' + key + '"></tbody></table>' +
      '</div>';
  }

  function wireDetail(period, key) {
    var rows = period.remainingDetail || [];
    var ids = ['shop','category','bagType','colour','product'];
    var els = {};
    ids.forEach(function(f){ els[f] = document.getElementById('f-' + key + '-' + f); });
    var tbody = document.getElementById('detail-' + key);
    var countEl = document.getElementById('f-' + key + '-count');

    function render() {
      var fv = {};
      ids.forEach(function(f){ fv[f] = (els[f].value || '').toLowerCase(); });
      var filtered = rows.filter(function(r) {
        if (fv.shop     && String(r.shop).toLowerCase()     !== fv.shop)     return false;
        if (fv.category && String(r.category).toLowerCase() !== fv.category) return false;
        if (fv.bagType  && String(r.bagType).toLowerCase()  !== fv.bagType)  return false;
        if (fv.colour   && String(r.colour).toLowerCase()   !== fv.colour)   return false;
        if (fv.product  && String(r.product).toLowerCase().indexOf(fv.product) === -1) return false;
        return true;
      });
      var totRem = filtered.reduce(function(a, r){ return a + (r.remaining || 0); }, 0);
      countEl.textContent = filtered.length + ' rows · ' + totRem.toLocaleString() + ' bags';

      if (!filtered.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="8">No remaining stock matches these filters.</td></tr>';
        return;
      }
      tbody.innerHTML = filtered.map(function(r) {
        return '<tr><td>' + esc(r.shop) + '</td><td>' + esc(r.colour) + '</td><td>' + esc(r.category) +
          '</td><td>' + esc(r.product) + '</td><td>' + esc(r.bagType) + '</td>' +
          '<td>' + fmt(r.dispatched) + '</td><td>' + fmt(r.sold) + '</td>' +
          '<td class="remain-val">' + fmt(r.remaining) + '</td></tr>';
      }).join('') +
      '<tr class="foot-row"><td colspan="7">Total remaining (filtered)</td><td>' + totRem.toLocaleString() + '</td></tr>';
    }

    ids.forEach(function(f){ els[f].addEventListener(f === 'product' ? 'input' : 'change', render); });
    document.getElementById('f-' + key + '-reset').addEventListener('click', function() {
      ids.forEach(function(f){ els[f].value = ''; });
      render();
    });
    render();
  }

  function renderPeriod(period, label, cssClass, chartId, key) {
    var regions = period.regions || { names: [], metrics: [], performance: [] };
    var regionBlock = regions.names.length
      ? '<div class="block-title" style="color:#22d3ee;margin-top:1.75rem">' + label + ' · By Region</div>' +
        groupTable(regions.metrics, regions.names, 'byRegion', label + ' — Per Region Breakdown') +
        performanceTable(regions.performance, label + ' — Region Performance (ranked)', 'Region') +
        chartCard('chart-perf-region-' + key, label + ' — Region Performance Score (ranked)')
      : '';
    return '<div class="period-divider ' + cssClass + '"><span class="line"></span>' +
      '<span class="label">' + label + '</span><span class="line"></span></div>' +
      summaryTable(period, label) +
      performanceTable(period.performance, label + ' — Shop Performance (ranked)', 'Shop') +
      chartCard('chart-perf-' + key, label + ' — Shop Performance Score (ranked)') +
      perShopTable(period, label) +
      chartCard(chartId, label + ' — Sold from Dispatch vs Cleared Alone (per shop)') +
      regionBlock +
      detailSection(period, key, label);
  }

  /* Horizontal bar of performance score by shop/region (ranked) */
  function drawPerfChart(id, perf) {
    var ctx = document.getElementById(id);
    if (!ctx || !window.Chart) return;
    perf = perf || [];
    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: perf.map(function(p){ return p.name; }),
        datasets: [{
          label: 'Performance score',
          data: perf.map(function(p){ return p.score; }),
          backgroundColor: perf.map(function(p){ return scoreColor(p.score); }),
          borderRadius: 3,
        }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false },
          tooltip: { backgroundColor: '#1e2130', borderColor: '#2d3148', borderWidth: 1 } },
        scales: {
          x: { grid: { color: 'rgba(45,49,72,0.5)' }, ticks: { color: '#94a3b8' }, beginAtZero: true, max: 100 },
          y: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } }
        }
      }
    });
  }

  /* Trend: remaining vs cleared over the recorded snapshots, for a chosen
     shop (or the grand total). Keeps chart instances so it can redraw. */
  var _trendCharts = {};

  function seriesFor(pts, prefix, kind, sel) {
    // kind: 'Remaining' | 'Cleared'
    // sel: '__ALL__' → grand total; 'region:Name' → that region; else a shop
    return pts.map(function(p) {
      if (sel === '__ALL__') return p[prefix + kind] || 0;
      if (sel.indexOf('region:') === 0) {
        var byReg = p[prefix + kind + 'ByRegion'] || {};
        return byReg[sel.slice(7)] || 0;
      }
      var byShop = p[prefix + kind + 'ByShop'] || {};
      return byShop[sel] || 0;
    });
  }

  function drawTrend(id, history, prefix, shop) {
    var ctx = document.getElementById(id);
    if (!ctx || !window.Chart) return;
    var pts = history || [];
    if (_trendCharts[id]) { _trendCharts[id].destroy(); }
    _trendCharts[id] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: pts.map(function(p){ return p.date; }),
        datasets: [
          { label: 'Stocks remaining after dispatch', data: seriesFor(pts, prefix, 'Remaining', shop),
            borderColor: '#f59e0b', backgroundColor: 'rgba(245,158,11,0.12)',
            borderWidth: 2, fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#f59e0b' },
          { label: 'Cleared without dispatch', data: seriesFor(pts, prefix, 'Cleared', shop),
            borderColor: '#06b6d4', backgroundColor: 'rgba(6,182,212,0.12)',
            borderWidth: 2, fill: true, tension: 0.3, pointRadius: 3, pointBackgroundColor: '#06b6d4' },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 11, font: { size: 11 } } },
          tooltip: { backgroundColor: '#1e2130', borderColor: '#2d3148', borderWidth: 1 } },
        scales: {
          x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
          y: { grid: { color: 'rgba(45,49,72,0.5)' }, ticks: { color: '#94a3b8' }, beginAtZero: true }
        }
      }
    });
  }

  function trendSection() {
    var pts = (SE.history || []);
    var note = pts.length < 2
      ? '<div class="card"><div class="card-label">Remaining vs Cleared — Trend</div>' +
        '<p style="font-size:0.8rem;color:#64748b">Only ' + pts.length + ' snapshot so far. ' +
        'Each line fills in as you refresh on more days — one point is recorded per day, per shop.</p></div>'
      : '';
    // Regions available in history (from the latest snapshot)
    var regionNames = [];
    if (pts.length) {
      var last = pts[pts.length - 1];
      regionNames = Object.keys(last.wkClearedByRegion || last.moClearedByRegion || {});
    }
    var shopOpts = '<option value="__ALL__">All shops (total)</option>' +
      '<optgroup label="Regions">' +
        regionNames.map(function(r){ return '<option value="region:' + esc(r) + '">' + esc(r) + '</option>'; }).join('') +
      '</optgroup>' +
      '<optgroup label="Shops">' +
        (SE.shops || []).map(function(s){ return '<option value="' + esc(s) + '">' + esc(s) + '</option>'; }).join('') +
      '</optgroup>';
    return '<div class="period-divider"><span class="line"></span>' +
      '<span class="label" style="color:#22d3ee">Trend — Remaining vs Cleared</span>' +
      '<span class="line"></span></div>' +
      '<div class="filter-bar" style="border:1px solid #2d3148;border-radius:10px 10px 0 0;background:#13151f;margin-bottom:0">' +
        '<span style="font-size:0.7rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#64748b">View</span>' +
        '<select id="trend-shop">' + shopOpts + '</select>' +
        '<span style="font-size:0.72rem;color:#64748b">pick a region or shop to see its own trend</span>' +
      '</div>' + note +
      chartCard('chart-trend-wk', 'Weekly — Stocks Remaining vs Cleared (over time)') +
      chartCard('chart-trend-mo', 'Monthly — Stocks Remaining vs Cleared (over time)');
  }

  function wireTrend() {
    var sel = document.getElementById('trend-shop');
    if (!sel) return;
    function redraw() {
      drawTrend('chart-trend-wk', SE.history, 'wk', sel.value);
      drawTrend('chart-trend-mo', SE.history, 'mo', sel.value);
    }
    sel.addEventListener('change', redraw);
    redraw();
  }

  function drawChart(id, period) {
    var ctx = document.getElementById(id);
    if (!ctx || !window.Chart) return;
    var shops = period.shops;
    var byMetric = {};
    period.metrics.forEach(function(m){ byMetric[m.metric] = m.byShop; });
    var withD = shops.map(function(s){ return byMetric['BAGS SOLD FROM DISPATCH HELP'][s] || 0; });
    var solo  = shops.map(function(s){ return byMetric['CLEARED BAGS WITHOUT DISPATCH'][s] || 0; });
    var rem   = shops.map(function(s){ return byMetric['STOCKS REMAINING AFTER DISPATCH'][s] || 0; });

    new Chart(ctx, {
      type: 'bar',
      data: {
        labels: shops,
        datasets: [
          { label: 'Sold from dispatch', data: withD, backgroundColor: 'rgba(16,185,129,0.75)', borderRadius: 3 },
          { label: 'Cleared without dispatch', data: solo, backgroundColor: 'rgba(6,182,212,0.75)', borderRadius: 3 },
          { label: 'Stock remaining', data: rem, backgroundColor: 'rgba(245,158,11,0.7)', borderRadius: 3 },
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#94a3b8', boxWidth: 11, font: { size: 11 } } },
          tooltip: { backgroundColor: '#1e2130', borderColor: '#2d3148', borderWidth: 1 } },
        scales: {
          x: { stacked: true, grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 10 } } },
          y: { stacked: true, grid: { color: 'rgba(45,49,72,0.5)' }, ticks: { color: '#94a3b8' } }
        }
      }
    });
  }

  if (SE) {
    document.getElementById('page-sub').textContent =
      'Kenya shops · dispatch conversion & buffer clearance · generated ' + SE.generatedOn;

    // Trend panel (both periods over time) is rendered once and stays visible.
    document.getElementById('trend-content').innerHTML = trendSection();
    wireTrend();

    // ── Live dispatch & receiving (Odoo) — appended below each period ──
    function dispatchSection(which) {
      if (!SE.dispatch) return '';
      var dp = (which === 'wk') ? SE.dispatch.weekly : SE.dispatch.monthly;
      if (!dp) return '';
      var di = dp.distributedIn || {}, rec = dp.receiving || {}, shops = SE.shops || [];
      var rangeTxt = (dp.start || '') + ' → ' + (dp.end || '');
      function n(v) { return (v == null) ? '—' : Number(v).toLocaleString(); }
      function sc(s) { return s >= 70 ? '#34d399' : (s >= 40 ? '#fbbf24' : '#f87171'); }
      function pctOf(v, t) { return t ? (v / t * 100) : 0; }

      var recRows = shops.filter(function (s) { return rec[s]; })
                         .map(function (s) { var r = rec[s]; return {
                            shop: s, sent: r.sent, sameDay: r.sameDay, nextDay: r.nextDay,
                            twoDays: r.twoDays, later: r.later, inTransit: r.inTransit,
                            score: r.score, medianDays: r.medianDays }; });
      recRows.sort(function (a, b) { return (b.score - a.score) || (b.sent - a.sent); });
      var recBody = recRows.map(function (r, i) {
        var c = sc(r.score);
        return '<tr>' +
          '<td class="metric">' + (i + 1) + '. ' + r.shop + '</td>' +
          '<td class="value">' + n(r.sent) + '</td>' +
          '<td>' + pctOf(r.sameDay, r.sent).toFixed(0) + '%</td>' +
          '<td>' + pctOf(r.nextDay, r.sent).toFixed(0) + '%</td>' +
          '<td>' + pctOf(r.twoDays, r.sent).toFixed(0) + '%</td>' +
          '<td>' + pctOf(r.later, r.sent).toFixed(0) + '%</td>' +
          '<td>' + n(r.inTransit) + '</td>' +
          '<td>' + (r.medianDays == null ? '—' : r.medianDays) + '</td>' +
          '<td><span style="display:inline-block;width:52px;height:7px;border-radius:4px;background:#2d3148;' +
          'vertical-align:middle;overflow:hidden"><span style="display:block;height:100%;width:' +
          Math.max(2, r.score) + '%;background:' + c + '"></span></span> ' +
          '<b style="color:' + c + '">' + r.score.toFixed(1) + '</b></td></tr>';
      }).join('');

      return '' +
        '<div class="table-wrap" style="margin-top:1.5rem">' +
          '<div class="table-title">Shop Receiving — how fast each shop took stock in · ' + rangeTxt + ' · ' +
          'score: same-day full · next-day 60% · two-day 35% · later 15%</div>' +
          '<table><thead><tr><th>Shop</th><th>Sent</th><th>Same day</th><th>Next day</th>' +
          '<th>2 days</th><th>3+ days</th><th>In transit</th><th>Median</th><th>Score</th></tr></thead><tbody>' +
          (recBody || '<tr><td colspan="9" style="text-align:center;color:#475569;padding:1.2rem">' +
            'No receiving activity in this range.</td></tr>') +
          '</tbody></table></div>';
    }

    // Weekly / Monthly filter: render just the chosen period into #content.
    var toggle = document.getElementById('se-period-toggle');
    function showPeriod(which) {
      var isWk   = (which === 'wk');
      var period = isWk ? SE.weekly : SE.monthly;
      var label  = isWk ? 'Weekly' : 'Monthly';
      document.getElementById('content').innerHTML =
        renderPeriod(period, label, which, 'chart-' + which, which) + dispatchSection(which);
      drawPerfChart('chart-perf-' + which, period.performance);
      drawPerfChart('chart-perf-region-' + which, (period.regions || {}).performance);
      drawChart('chart-' + which, period);
      wireDetail(period, which);
      if (window._seEnhanceSelects) window._seEnhanceSelects();   // style the re-rendered filters
      if (toggle) Array.prototype.forEach.call(toggle.querySelectorAll('button'), function(b) {
        b.classList.toggle('active', b.getAttribute('data-period') === which);
      });
    }
    if (toggle) {
      toggle.style.display = '';
      Array.prototype.forEach.call(toggle.querySelectorAll('button'), function(b) {
        b.addEventListener('click', function() { showPeriod(b.getAttribute('data-period')); });
      });
    }
    showPeriod('wk');   // default view: Weekly
  } else {
    document.getElementById('page-sub').textContent =
      'No data yet — run shops_efficiency.py (or hit Refresh) to populate.';
  }

  /* In-page Refresh: re-runs shops_efficiency.py via the launcher, then
     reloads. Works inside the shell and when opened at its own URL. */
  (function () {
    var btn = document.getElementById('se-refresh');
    if (!btn) return;
    btn.addEventListener('click', function () {
      btn.disabled = true; btn.classList.add('spin');
      fetch('/api/refresh?dashboard=shops_efficiency.html&_ts=' + Date.now())
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok) {
            location.reload();
          } else {
            alert('Refresh failed:\n' + ((d && d.error) || 'unknown error'));
            btn.disabled = false; btn.classList.remove('spin');
          }
        })
        .catch(function () {
          alert('Refresh needs the dashboard server running.\nStart it with:  python main.py');
          btn.disabled = false; btn.classList.remove('spin');
        });
    });
  })();
</script>

<!-- Custom scrollable dropdowns (replace native selects on all filters) -->
<script>
(function(){
  function enhance(sel){
    if (sel.dataset.enhanced || sel.multiple) return;
    sel.dataset.enhanced = '1';
    var wrap = document.createElement('span'); wrap.className = 'cs-wrap';
    sel.parentNode.insertBefore(wrap, sel); wrap.appendChild(sel); sel.style.display = 'none';
    var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'cs-btn';
    var panel = document.createElement('div'); panel.className = 'cs-panel';
    function label(){ var o = sel.options[sel.selectedIndex]; btn.textContent = o ? o.textContent : ''; }
    sel._csSync = label;
    function build(){
      panel.innerHTML = '';
      Array.prototype.forEach.call(sel.options, function(o){
        var d = document.createElement('div'); d.className = 'cs-opt' + (o.selected ? ' sel' : ''); d.textContent = o.textContent;
        d.addEventListener('click', function(e){ e.stopPropagation(); sel.value = o.value; sel.dispatchEvent(new Event('change', { bubbles:true })); label(); panel.classList.remove('open'); });
        panel.appendChild(d);
      });
    }
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var open = panel.classList.contains('open');
      document.querySelectorAll('.cs-panel.open').forEach(function(p){ p.classList.remove('open'); });
      if (!open) { build(); panel.classList.add('open'); }
    });
    sel.addEventListener('change', label);
    wrap.appendChild(btn); wrap.appendChild(panel); label();
  }
  function enhanceAll(){ Array.prototype.forEach.call(document.querySelectorAll('select'), enhance); }
  window._seEnhanceSelects = enhanceAll;   // let the period toggle re-style its re-rendered filters
  function syncAll(){ Array.prototype.forEach.call(document.querySelectorAll('select[data-enhanced]'), function(s){ if (s._csSync) s._csSync(); }); }
  document.addEventListener('click', function(e){
    document.querySelectorAll('.cs-panel.open').forEach(function(p){ p.classList.remove('open'); });
    if (e.target.closest && e.target.tagName === 'BUTTON') setTimeout(syncAll, 0);
  });
  window.addEventListener('load', function(){ setTimeout(enhanceAll, 120); });
})();
</script>

name: Advance dashboard history from Google Sheets

# The LIVE HTML is now rendered by Vercel's build (it reads the sheet each
# deploy — see vercel.json), so this workflow no longer commits HTML. Its job:
#   1. Run the generators so the accumulating trend history / snapshots advance,
#      and commit ONLY those small state JSON files (git stays code, not data).
#   2. Trigger the Vercel build so the live site re-reads the sheet right away.
#
#   • Event-driven: the sheet pings GitHub on change (repository_dispatch, sent
#     by the bound Apps Script — see SETUP.md).
#   • Safety-net schedule (below).
#   • On demand: Actions tab → this workflow → "Run workflow".
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   SERVICE_ACCOUNT_JSON  – FULL contents of the service-account key (also add
#                           the SAME value as a Vercel env var, for its build).
#   VERCEL_DEPLOY_HOOK     – a Vercel Deploy Hook URL. This is what refreshes the
#                           live render, so set it (see SETUP.md).

on:
  repository_dispatch:
    types: [sheet-updated]     # fired by the sheet's Apps Script when data changes
  schedule:
    - cron: "0 */2 * * *"      # safety net every 2 hours (UTC)
  workflow_dispatch: {}        # the manual "Run workflow" button

permissions:
  contents: write              # allow committing the state JSON

concurrency:
  group: dashboard-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Advance history from the sheet
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::SERVICE_ACCOUNT_JSON secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          python build_all.py

      - name: Commit the updated history/state (NOT the HTML — Vercel renders that)
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # Stage everything EXCEPT the generated HTML.
          git add -A -- ':!*.html'
          if git diff --cached --quiet; then
            echo "No history/state changes this run."
          else
            git commit -m "chore: advance dashboard history from Google Sheets [skip ci]"
            git checkout -- '*.html' 2>/dev/null || true   # drop regenerated HTML so a rebase stays clean
            for i in 1 2 3; do
              if git push origin HEAD:main; then echo "Pushed on attempt $i."; break; fi
              echo "Push rejected — syncing with origin/main and retrying…"
              git pull --rebase -X theirs origin main || { echo "::error::Could not rebase onto origin/main."; exit 1; }
              if [ "$i" = "3" ]; then echo "::error::Push still rejected after 3 attempts."; exit 1; fi
            done
          fi

      - name: Trigger the Vercel build (reads the sheet, renders the live site)
        if: ${{ env.VERCEL_DEPLOY_HOOK != '' }}
        run: curl -sS -X POST "$VERCEL_DEPLOY_HOOK"
